     That breakpoint stops at 560px and the height term in the statement curve
     does not shrink the copy enough to make up the difference, so from 561px to
     about 655px the cue was landing under the fold — 27px under at 1440x600,
     47px at 1440x561. A part-height browser window on a laptop and a 1024x600
     netbook both sit in here, so it is not an exotic size.

     Nothing here touches type size. At these heights every vertical clamp in the
     hero is already sitting on its floor, and the largest of those floors is the
     112px top padding, which is there to clear the nav pill — and the pill ends
     around 76px, so roughly 30px of it is dead space. Spending that, plus the
     same 0.35lh seam the landscape breakpoint uses, covers the band with room to
     spare and leaves the statement at the size it is at every other height.
     Raising the breakpoint ceiling instead was the obvious move and the wrong
     one: that treatment sets min-height 0 for a viewport the copy fills on its
     own, so at 1440 wide the hero stopped filling the screen, the next section
     pushed into the fold and the greeting slid under the nav. Tightening the vh
     term worked too, but it is paid at every height where that term binds,
     including the 1440x800 laptop the hero is composed for. */

    .hp-hero { padding-top: 88px; }
    .hp-hero__sentence:last-child {
      margin-top: 0.35em;
      margin-top: 0.35lh;
    }
  }

     centre of the screen is most of what is on screen and the two either side
     are barely in it. Scaling on top of that reads as the page breathing rather
     than as a carousel, so the range comes right in and the gap closes up. */

    .hp-cases { --card-gap: 22px; --card-scale-min: 0.93; --card-dim-min: 0.7; }
  }

  @media (max-width: 400px) {
    /* 10 left, not 8: same vertical + 4 as the block above. At 8 the avatar sat
       2px nearer the end of the pill than it did the top of it, which is the one
       breakpoint where the surround leaned the other way. */
    .hp-nav { gap: 8px; padding: 6px 5px 6px 10px; }
    /* 8 gap + 9 link padding. */
    .hp-nav__brand { padding-right: 17px; gap: 8px; }
    .hp-nav__name { font-size: 13px; }
    .hp-nav__link { padding: 11px 9px; font-size: 12.5px; }
    /* Down with everything else around it, and it buys the two arrows some of
       the room the brand divider takes back. */
    .hp-nav__arrow svg { width: 12px; height: 12px; }
  }

  /* Where the arrows genuinely stop fitting, measured rather than assumed. They
     used to be dropped at 600px, which was far too early. The pill hugs, so the
     pair costs it width rather than needing space it has not got: with them in,
     its content comes to 305px, against a max-width allowing 296px at 320px and
     336px at 360px. Only a 320px screen cannot hold them. Every phone above that
     keeps them, where before none under 601px did.

     Set at 340 rather than 330, which is where the measurement actually turns.
     No device sits between 320 and 360, so every width in that gap is free, and
     stopping at 340 leaves the narrowest real phone that keeps the arrows — 360px
     — 31px of room, enough that a fallback face with wider metrics cannot push
     them out.

     Below this the label needs its gap closed again, or it sits out from the edge
     of a pill with nothing in the space. */
  @media (max-width: 339px) {
    .hp-nav__arrow { display: none; }
    .hp-nav__link { gap: 0; }
    /* 8 gap + 9 link padding + the 4px the 44px tap-target floor adds either side
       of `CV`: with the arrow out, the link's content is narrow enough for
       min-width to bind and centre it, pushing the label further from the line. */
    .hp-nav__brand { padding-right: 21px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hp-nav { transition-duration: 0.01ms; }
    .hp-footer__cta,
    .hp-nav__arrow { transition-duration: 0.01ms; }

    /* The carousel is scroll-coupled movement, so it is dropped rather than
       merely slowed: every card sits at its natural size, with no scale written
       to it by anything. The JS that drives it does not run at all under
       reduced motion, and this is the belt to that pair of braces — it also
       clears the translateZ(0) promotion, which is only there to give the scale
       a compositing layer it no longer needs. */
    .hp-case {
      transform: none;
      /* The dim goes with the scale. A card held at half light is not a
         gentler version of the effect, it is the page rendering three of its
         four case studies as though they were disabled. */
      opacity: 1;
      will-change: auto;
      transition: none;
    }
    /* The arrow's hover move is movement for its own sake, so it goes entirely
       rather than being sped up. What is left is exactly what a touch device
       with no hover shows, so the state that has to read correctly on its own
       is the one being tested here. */
    .hp-case__arrow { transition: none; }
    .hp-case__link:hover .hp-case__arrow,
    .hp-case__link:focus-visible .hp-case__arrow { transform: none; }
    /* The bob is ambient motion with nothing to communicate that the arrow
       does not already say standing still, so it goes rather than being slowed.
       transform is cleared as well: without it the arrow would keep whichever
       end of the travel the animation was cancelled at. */
    .hp-hero__cue-arrow {
      animation: none;
      transform: none;
    }
    /* The index is information, not decoration, so it stays — it just stops
       arriving. Held on rather than left to the scroll trigger, because a rail
       that fades itself in is doing the one thing this mode is asked not to,
       and there is nothing gained by hiding an index until you reach it.
       transform survives, because at desktop it is not motion: it is the
       translateY(-50%) that centres the sticky block on its own height. */
    .hp-count {
      opacity: 1;
      transition: none;
    }
    /* The lit numeral still lights and is still the larger one. Both are how
       the rail reads at all; it is only the sliding between the two that goes. */
    .hp-count__row,
    .hp-count__n { transition: none; }
  }
</style>

    // Uniform Manrope 800. "talk." was the last Instrument Serif italic on the
    // page and the owner asked for it to go, so the <em> went with the rule
    // that styled it rather than being left to inherit a browser italic.
    title: 'Let&rsquo;s talk.',
    lede: '<strong>Open to new opportunities</strong> \u2014 product design leadership, in-house or consultancy. If you&rsquo;re hiring, building a team, or just want a second opinion, my inbox is open.'
  };

  function stripTags(html) {
    var d = document.createElement('div');
    d.innerHTML = html;
    return (d.textContent || '').replace(/"/g, '&quot;');
  }

  // Wraps each character in a span, preserving inline markup. Pass a word class
  // and each word also gets a nowrap wrapper, so a multi-line heading still
  // breaks between words instead of mid-word once every glyph is inline-block.
  function splitChars(text, className, wordClassName) {
    var container = document.createElement('span');
    container.innerHTML = text;
    walk(container);
    return container.innerHTML;

    function charSpan(ch) {
      var span = document.createElement('span');
      span.className = className;
      span.textContent = ch;
      return span;
    }

    function walk(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function(child) {
        if (child.nodeType === 3) {
          var frag = document.createDocumentFragment();
          var parts = child.nodeValue.split(/(\s+)/);
          parts.forEach(function(part) {
            if (!part) return;
            if (/^\s+$/.test(part)) {
              // A real space keeps the line-breaking opportunity intact.
              frag.appendChild(wordClassName
                ? document.createTextNode(' ')
                : charSpan('\u00A0'));
              return;
            }
            var host = frag;
            if (wordClassName) {
              host = document.createElement('span');
              host.className = wordClassName;
            }
            for (var i = 0; i < part.length; i++) host.appendChild(charSpan(part.charAt(i)));
            if (host !== frag) frag.appendChild(host);
          });
          node.replaceChild(frag, child);
        } else if (child.nodeType === 1) {
          walk(child);
        }
      });
    }
  }

  function tagsHtml(p) {
    return '<div class="hp-case__tags">' + p.tags.map(function(t) {
      return '<span class="hp-case__tag">' + t + '</span>';
    }).join('') + '</div>';
  }

  // One glyph. The hover is a short lift handled entirely in CSS, so there is
  // no second copy to travel in behind the first one any more.
  function arrowHtml() {
    return '<span class="hp-case__arrow" aria-hidden="true">' +
      ARROW_NE_LG +
    '</span>';
  }

  // A card image is never laid out wider than 1008 CSS px — it caps there from
  // a 1280px viewport up, and is ~79vw below that — so the ladder is that width
  // against each device pixel ratio in use. Without it a 390px phone at 3x
  // would pull the 3024px file to paint roughly 350px of screen, which for
  // British Cycling is 234KB in place of 57KB.
  //
  // WebP because these are screenshots on flat fields and it is worth 6-11x
  // here: the four rungs are 237/355/530KB against 1.4/2.7/5.2MB as PNG, at
  // 43-46dB PSNR. No PNG fallback and no <picture> to hold one. Every shipping
  // browser has decoded WebP since about 2020, Safari included from 14, so a
  // fallback would not be protecting anyone — it would be a second format to
  // keep in step on every re-export and 4.6MB of PNG in the repo for a
  // population that has emptied.
  //
  // The hash is in the filename because vercel.json serves /assets/* as
  // immutable for a year. Overwriting a name in place would leave everyone who
  // has already loaded the site on the version they cached, with no request
  // made to find out otherwise; a new name is simply a different entry. It is a
  // digest of the source export, so a re-export changes every URL and a rebuild
  // that changes nothing changes none of them.
  var ART_WEBP_W = [1008, 1512, 2016, 3024];
  var ART_SIZES = '(min-width: 1280px) 1008px, 79vw';

  function artSrcset(art) {
    return ART_WEBP_W.map(function (w) {
      return art.base + '-' + w + '.' + art.tag + '.webp ' + w + 'w';
    }).join(', ');
  }

  // One component for all three cards. Everything that differs between them is
  // data: the artwork, the copy, the tags and the ink. Adding a fourth project
  // is a change to PROJECTS and nothing else.
  //
  // The card is her image with a link laid over it. Nothing is drawn under the
  // image and nothing is drawn over it except the three things she left room
  // for — the chips, the sentence and the arrow.
  // One name per project, used by the rail, the card's heading and the link's
  // accessible name alike. It was a client and a project held apart, because
  // the rail set them on two lines at two sizes; on one line there is nothing
  // to hold apart, and a single string is one thing to write rather than three
  // places for two halves to disagree.
  //
  // The names have to do their own disambiguating now, which is why two of them
  // name British Cycling and say app and website: there is no second line left
  // to tell those two apart.

  function buildCase(p, i) {
    var c = CARDS[p.card];
    // Both as shares of the card's WIDTH, because every other measurement on
    // the card is in cqw and mixing in a height-relative number would make the
    // phone crop drift with each image's aspect.
    var ar = p.art.h / p.art.w;
    var style = '--i:' + i + ';--card-bg:' + c.bg + ';--card-ink:' + c.ink +
      ';--art-ar:' + ar.toFixed(4) +
      ';--art-crop:' + (p.art.clear * ar).toFixed(4) + ';';

    return '<article class="hp-case hp-case--' + p.slug + '" style="' + style + '">' +
      // Her artwork carries no visible project name — it lives in the
      // emphasised phrase of the sentence. The heading still has to exist for
      // the document outline, for heading navigation and for search, so it is
      // present and visually hidden rather than removed.
      '<h2 class="hp-case__title">' + p.title + '</h2>' +
      // Comma rather than a dash: "Boots website, read the case study" is a
      // name and then an instruction, which is what it has to be read aloud as.
      '<a class="hp-case__link" href="' + p.href + '" ' +
        'aria-label="' + p.title + ', read the case study">' +
        // Head before art in the source. On a wide card it makes no visual
        // difference — the head is absolutely positioned into the cleared band
        // — but on a phone the two are in flow and this is the order they have
        // to be in. It is also the order the card reads in.
        '<div class="hp-case__head">' +
          '<div class="hp-case__head-text">' +
            tagsHtml(p) +
            '<p class="hp-case__desc">' + p.desc + '</p>' +
          '</div>' +
          arrowHtml() +
        '</div>' +
        // hp-case__shot is kept on the tag because the audit harness uses it to
        // force every card image to decode before it measures or screenshots.
        // src is the smallest rung, for anything that reads src but not srcset.
        '<img class="hp-case__art hp-case__shot"' +
          ' src="' + p.art.base + '-' + ART_WEBP_W[0] + '.' + p.art.tag + '.webp' +
          '" sizes="' + ART_SIZES +
          '" srcset="' + artSrcset(p.art) +
          '" width="' + p.art.w + '" height="' + p.art.h +
          '" alt="' + p.art.alt + '" loading="lazy" decoding="async">' +
      '</a>' +
    '</article>';
  }

  function build() {
    var navHtml = '' +
      '<nav class="hp-nav" aria-label="Primary">' +
        '<div class="hp-nav__brand">' +
          '<img class="hp-nav__avatar" src="' + AVATAR + '" alt="Abbie Truman" loading="eager">' +
          '<span class="hp-nav__name">Abbie Truman</span>' +
        '</div>' +
        '<div class="hp-nav__links">' +
          '<a class="hp-nav__link" href="' + CV + '" target="_blank" rel="noopener">' +
            '<span>CV</span>' +
            '<span class="hp-nav__arrow" aria-hidden="true">' + ARROW_NE + '</span>' +
          '</a>' +
          '<a class="hp-nav__link" href="' + LINKEDIN + '" target="_blank" rel="noopener">' +
            '<span>LinkedIn</span>' +
            '<span class="hp-nav__arrow" aria-hidden="true">' + ARROW_NE + '</span>' +
          '</a>' +
        '</div>' +
      '</nav>';

    var heroHtml = '' +
      '<section class="hp-hero" id="hp-hero">' +
        '<div class="hp-hero__main">' +
          '<p class="hp-hero__greeting">' + HERO.greeting + '</p>' +
          // Per-character spans would otherwise be read out letter by letter.
          '<h1 class="hp-hero__statement" aria-label="' + stripTags(HERO.statement) + '">' +
            '<span class="hp-hero__statement-inner" aria-hidden="true">' + splitChars(HERO.statement, 'hp-hero__char', 'hp-hero__word') + '</span>' +
          '</h1>' +
        '</div>' +
        '<div class="hp-hero__lower">' +
          // A span, not a button: this reports that the page continues, and the
          // whole thing is aria-hidden because "Scroll" describes a mouse gesture
          // to someone who may not be making one. A screen reader reaching the end
          // of the hero is told the next section's heading, which is the same
          // information without the instruction.
          '<span class="hp-hero__cue" aria-hidden="true">' +
            '<span>' + HERO.cue + '</span>' +
            '<span class="hp-hero__cue-arrow">' +
              ARROW_DOWN +
            '</span>' +
          '</span>' +
        '</div>' +
      '</section>';

    var wordmarkHtml = '' +
      '<section class="hp-wordmark" id="hp-wordmark">' +
        '<div class="hp-wordmark__stage">' +
          '<div class="hp-wordmark__inner">' +
            '<div class="hp-wordmark__row">' + WORDMARK + '</div>' +
            '<div class="hp-wordmark__row">' + WORDMARK + '</div>' +
            '<div class="hp-wordmark__row">' + WORDMARK + '</div>' +
          '</div>' +
        '</div>' +
      '</section>';

    // Built from the same array the cards are, so the index cannot disagree
    // with how many case studies there are, and row three is card three because
    // both are walking one list. Adding a sixth is an edit to PROJECTS and
    // nothing else.
    //
    // aria-hidden, and it has to be. It changes as you scroll, and a live
    // readout announcing "two of five, British Cycling app" every time a card
    // passes the middle of the screen is noise over the top of the headings
    // that carry the same information properly.
    var countHtml = '<div class="hp-count" id="hp-count" aria-hidden="true">' +
        '<ol class="hp-count__list">' +
          PROJECTS.map(function(p, i) {
            return '<li class="hp-count__row' + (i ? '' : ' is-now') + '">' +
                '<span class="hp-count__n">' + pad(i + 1) + '</span>' +
              '</li>';
          }).join('') +
        '</ol>' +
      '</div>';

    var casesHtml = '<section class="hp-cases" id="hp-cases" aria-label="Selected work">' +
      countHtml +
      '<div class="hp-cases__list">' +
        PROJECTS.map(buildCase).join('') +
      '</div>' +
    '</section>';

    var footerHtml = '' +
      '<footer class="hp-footer" id="hp-footer">' +
        '<span class="hp-eyebrow hp-eyebrow--rule">' + FOOTER.eyebrow + '</span>' +
        '<h2 class="hp-footer__title">' + FOOTER.title + '</h2>' +
        '<p class="hp-footer__lede">' + FOOTER.lede + '</p>' +
        // A phone number where LinkedIn used to be. LinkedIn is still one tap
        // away in the nav, and repeating it here spent the ghost button on a
        // link the page already has rather than on a second way to make contact.
        '<div class="hp-footer__ctas">' +
          '<a class="hp-footer__cta" href="mailto:' + EMAIL + '">' + EMAIL + '<span class="hp-footer__cta-arrow">' + ARROW_NE + '</span></a>' +
          '<a class="hp-footer__cta is-ghost" href="tel:' + PHONE_TEL + '">' + PHONE + '<span class="hp-footer__cta-arrow">' + ARROW_NE + '</span></a>' +
        '</div>' +
        '<div class="hp-footer__base">' +
          '<span>&copy; ' + new Date().getFullYear() + ' Abbie Truman</span>' +
          '<button class="hp-footer__top" type="button" data-top>' +
            '<span class="hp-footer__cta-arrow" aria-hidden="true">' + ARROW_UP + '</span>Back to top' +
          '</button>' +
        '</div>' +
      '</footer>';

    var html = '<div class="hp-root" id="hp-root">' +
      navHtml + heroHtml + wordmarkHtml + casesHtml + footerHtml +
    '</div>';

    document.body.insertAdjacentHTML('afterbegin', html);
    console.log('HP ' + VERSION + ' mounted');
  }

  // Two digits, because a count that runs 9 then 10 changes width mid-scroll
  // and shifts the slash along with it.
  function pad(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function revealNav() {
    var nav = document.querySelector('.hp-nav');
    if (nav) nav.classList.add('is-ready');
  }

  function initBackToTop() {
    var btn = document.querySelector('[data-top]');
    var root = document.getElementById('hp-root');
    if (!btn || !root) return;
    btn.addEventListener('click', function() {
      root.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
    });
  }

  // A case study's "Back to selected work" link arrives here as /#work, and the
  // browser cannot honour that fragment for two separate reasons: at the moment
  // it would act on one this script has not built the page yet, and the target
  // does not sit in the document scroller but inside #hp-root, which is fixed
  // and scrolls its own contents. So it is read by hand, writing to that
  // scroller the same way the back-to-top button does.
  //
  // #work rather than #hp-cases: the id is this file's own naming and the URL is
  // something a visitor sees and shares.
  function initWorkAnchor() {
    var root = document.getElementById('hp-root');
    var cases = document.getElementById('hp-cases');
    if (!root || !cases) return;

    // Where this last put the page, or null once the visitor has moved it and
    // it stops being ours to set.
    var held = null;

    function go(smooth) {
      if (window.location.hash !== '#work') return;
      var top = root.scrollTop
        + cases.getBoundingClientRect().top
        - root.getBoundingClientRect().top;
      smooth = smooth && !REDUCED;
      root.scrollTo({ top: top, behavior: smooth ? 'smooth' : 'auto' });
      // Where it went, which is not always where it was sent: an instant scroll
      // aimed past the end of a page that is still filling in gets clamped, and
      // re-reading is what lets the correction below tell that from a visitor
      // who has taken over. Nothing to read mid-flight on a smooth one, and by
      // then the page has settled anyway.
      held = smooth ? null : Math.round(root.scrollTop);
    }

    // The cards do not stay where they were aimed at. The hero above them is
    // set in a webfont that has not arrived yet and wraps to a different depth
    // in the fallback, the artwork is still loading, and a phone that turns
    // re-lays the column. So it is re-aimed each time one of those lands — but
    // only while the page is still where this put it, because moving it under
    // someone who has started reading is the rudest thing this could do.
    function again() {
      if (held === null) return;
      if (Math.abs(root.scrollTop - held) > 2) { held = null; return; }
      go(false);
    }

    // On arrival, land there outright. Someone coming back from a case study
    // asked for the work, not to watch the hero go past on the way to it.
    go(false);
    // Following the same link while already on the homepage sets the hash
    // without navigating, and nothing above runs again. Here the travel is the
    // only feedback that the click did anything, so this one is smooth.
    window.addEventListener('hashchange', function() { go(true); });

    if (document.readyState === 'complete') setTimeout(again, 0);
    else window.addEventListener('load', again);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(again);
    var settleTimer;
    window.addEventListener('resize', function() {
      clearTimeout(settleTimer);
      settleTimer = setTimeout(again, 200);
    });
  }

  // The hero is the opening moment — no splash gate in front of it.
  function initHero() {
    if (typeof gsap === 'undefined') return;
    if (REDUCED) return;

    var chars = document.querySelectorAll('.hp-hero__char');
    var greeting = document.querySelector('.hp-hero__greeting');
    // The hairline and the cue arrive together, on a beat late enough to read as
    // the composition closing rather than as part of the copy. They settle while
    // the statement is still writing — a ~150-glyph stagger outruns them — which
    // is why they get their own slower duration instead of a later start: the
    // band should be arriving underneath the sentence, not queueing behind it.
    var below = document.querySelectorAll('.hp-hero__lower');

    gsap.set(chars, { yPercent: 55, opacity: 0 });
    gsap.set([greeting], { opacity: 0, y: 16 });
    gsap.set(below, { opacity: 0, y: 22 });

    gsap.timeline({
      defaults: { ease: 'expo.out', force3D: true },
      onComplete: function() {
        // yPercent is cleared before handing the glyphs to the cursor field,
        // which drives `y` — GSAP sums the two, so they must not overlap.
        gsap.set(chars, { yPercent: 0, y: 0 });
        initHeroCursorField();
      }
    })
      .to([greeting], { opacity: 1, y: 0, duration: 1 }, 0)
      .to(chars, { yPercent: 0, opacity: 1, duration: 1, stagger: 0.011 }, 0.2)
      .to(below, { opacity: 1, y: 0, duration: 1.1, stagger: 0.12 }, 0.85);
  }

  // Cursor field — glyphs lift toward the pointer so the hero stays alive
  // without needing scroll. Deliberately a different gesture from the wordmark.
  function initHeroCursorField() {
    if (typeof gsap === 'undefined' || REDUCED) return;
    if (window.matchMedia('(hover: none)').matches) return;

    var chars = Array.prototype.slice.call(document.querySelectorAll('.hp-hero__char'));
    var hero = document.getElementById('hp-hero');
    if (!chars.length || !hero) return;

    var RADIUS = 165;
    var LIFT = 16;

    var items = chars.map(function(el) {
      return {
        el: el,
        setY: gsap.quickTo(el, 'y', { duration: 0.55, ease: 'power3' }),
        setScale: gsap.quickTo(el, 'scale', { duration: 0.55, ease: 'power3' }),
        cx: 0,
        cy: 0,
        last: 0
      };
    });

    function measure() {
      items.forEach(function(it) {
        var r = it.el.getBoundingClientRect();
        it.cx = r.left + r.width / 2;
        it.cy = r.top + r.height / 2;
      });
    }
    measure();

    var mx = -9999, my = -9999, queued = false;

    function apply() {
      queued = false;
      items.forEach(function(it) {
        var dx = mx - it.cx;
        var dy = my - it.cy;
        var falloff = 0;
        // Cheap reject before the sqrt — most glyphs are out of range on a
        // statement this long, and there are well over a hundred of them.
        if (Math.abs(dx) < RADIUS && Math.abs(dy) < RADIUS) {
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < RADIUS) {
            falloff = 1 - dist / RADIUS;
            // Ease the falloff so the effect has a soft shoulder, not a cone.
            falloff = falloff * falloff * (3 - 2 * falloff);
          }
        }
        // Skip glyphs that are already settled at rest.
        if (falloff === 0 && it.last === 0) return;
        it.last = falloff;
        it.setY(-LIFT * falloff);
        it.setScale(1 + 0.06 * falloff);
      });
    }

    window.addEventListener('mousemove', function(e) {
      mx = e.clientX;
      my = e.clientY;
      if (!queued) { queued = true; requestAnimationFrame(apply); }
    }, { passive: true });

    hero.addEventListener('mouseleave', function() {
      mx = my = -9999;
      apply();
    });

    // Positions are viewport-relative, so re-measure whenever they can shift.
    var remeasure;
    function scheduleMeasure() {
      clearTimeout(remeasure);
      remeasure = setTimeout(measure, 150);
    }
    window.addEventListener('resize', scheduleMeasure);
    var root = document.getElementById('hp-root');
    if (root) root.addEventListener('scroll', scheduleMeasure, { passive: true });
  }

  // One reveal recipe for every section below the fold.
  function reveal(trigger, steps) {
    if (REDUCED || !trigger) return;
    var active = steps.filter(function(s) { return s.els && s.els.length; });
    if (!active.length) return;

    active.forEach(function(s) {
      gsap.set(s.els, { opacity: 0, y: s.y == null ? 30 : s.y });
    });

    ScrollTrigger.create({
      trigger: trigger,
      start: 'top 82%',
      once: true,
      onEnter: function() {
        var tl = gsap.timeline({ defaults: { ease: 'expo.out', force3D: true } });
        active.forEach(function(s) {
          tl.to(s.els, {
            opacity: 1,
            y: 0,
            duration: s.duration || 1.1,
            stagger: s.stagger || 0
          }, s.at || 0);
        });
      }
    });
  }

  function initScrollScenes() {
    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
      console.warn('GSAP / ScrollTrigger unavailable — scenes static');
      return;
    }
    gsap.registerPlugin(ScrollTrigger);

    var root = document.getElementById('hp-root');
    ScrollTrigger.defaults({ scroller: root });

    // ---------- WORDMARK ----------
    // The section holds itself still: it is 420vh tall with a position:sticky
    // stage inside it, so the compositor owns the pin and GSAP never writes a
    // transform to anything that is supposed to be stationary. ScrollTrigger's
    // only job here is to map scroll position onto the timeline, and the
    // timeline only ever touches transforms.
    //
    // 'top top' → 'bottom bottom' is exactly the span over which the stage is
    // stuck, and it reproduces the previous pin distance (320vh) and total
    // scroll cost (420vh) to the pixel.
    var wordmark = document.getElementById('hp-wordmark');
    if (wordmark) {
      var inner = wordmark.querySelector('.hp-wordmark__inner');
      var rows = wordmark.querySelectorAll('.hp-wordmark__row');
      var outer = [rows[0], rows[2]];

      if (REDUCED) {
        // Nothing scroll-driven, so the extra 320vh would be dead scroll past
        // a mark that never changes. Collapse to one screen and leave the
        // three rows sitting at their untransformed, fully visible position.
        wordmark.classList.add('hp-wordmark--static');
      } else {
        // Initial offsets live here rather than in CSS so GSAP owns the
        // transform outright and never has to reconcile with a stylesheet value.
        gsap.set(outer, { xPercent: 100, yPercent: 0 });
        gsap.set(rows[1], { xPercent: -100 });
        gsap.set(inner, { scale: 1 });

        gsap.timeline({
          defaults: { force3D: true },
          scrollTrigger: {
            trigger: wordmark,
            start: 'top top',
            end: 'bottom bottom',
            invalidateOnRefresh: true,
            // No smoothing. Interpolation only made sense as compensation for
            // a pin that was already lagging; with the pin off the main
            // thread it just adds its own lag and lets the mark drift on
            // after the scroll has stopped.
            scrub: true
          }
        })
          // 1 — rows slide in from alternating sides
          .to(outer,   { xPercent: 0, duration: 1, ease: 'none' }, 0)
          .to(rows[1], { xPercent: 0, duration: 1, ease: 'none' }, 0)
          // 2 — outer rows converge behind the middle row
          .to(rows[0], { yPercent: 100,  duration: 1, ease: 'power1.inOut' }, 1.15)
          .to(rows[2], { yPercent: -100, duration: 1, ease: 'power1.inOut' }, 1.15)
          // 3 — the collapsed mark shrinks away
          .to(inner, {
            scale: window.innerWidth <= 900 ? 0.34 : 0.2,
            duration: 1.2,
            ease: 'power2.inOut'
          }, 2.35);
      }
    }

    // ---------- CASE CARDS: the carousel ----------
    // The card nearest the middle of the screen is at full size and the ones
    // above and below it sit smaller, so scrolling the section reads as moving
    // through a set rather than down a list.
    //
    // Two rules govern how this is allowed to be built, and they come from the
    // wordmark's long-standing shake:
    //
    //   1. Nothing is pinned. This scales a card that is scrolling normally.
    //      The shake happened because a transform was being written on the main
    //      thread to hold an element STILL against a compositor-thread scroll,
    //      and any lag in that race shows up as jitter. A scale on a moving
    //      element has no such reference to disagree with.
    //   2. transform only. No width, no height, no top, no margin — nothing
    //      that would put the card back through layout on a scroll frame.
    //
    // The timeline runs from the card entering the bottom of the viewport to it
    // leaving the top, so its midpoint is exactly the moment the card's centre
    // passes the viewport's centre. That is the "distance from centre" the
    // effect is described by, expressed as scroll progress rather than measured
    // per frame in JS.
    var cards = Array.prototype.slice.call(document.querySelectorAll('.hp-case'));
    var casesEl = document.getElementById('hp-cases');
    // Owned by the stylesheet, so the value that ships and the value that is
    // audited are the same value, and so the phone band can widen the range
    // without JS knowing which band it is in.
    function token(name, fallback) {
      var v = casesEl
        ? parseFloat(getComputedStyle(casesEl).getPropertyValue(name))
        : NaN;
      return (v > 0 && v <= 1) ? v : fallback;
    }
    var scaleMin = token('--card-scale-min', 0.85);
    var dimMin = token('--card-dim-min', 0.5);

    // TEMPORARY — carousel comparison switch, ?fx=0..3. Delete once one is
    // chosen and fold its values into the code below.
    //
    // Why it exists: measured on a 1440x900 desktop, the carousel moves 0.2% of
    // its scale range and 0.2% of its opacity range during the whole time the
    // card is more than 90% on screen. It reaches full size and full brightness
    // while it is still a sliver at the bottom edge. A card is 808px tall in a
    // 900px viewport, so no second card is ever in frame to compare it with
    // either — the effect is real, correctly wired, and invisible.
    //
    // The cause is the easing, and it was chosen on purpose: power2.out
    // front-loads the change so the card is at rest while you are looking at
    // it. These variants walk that decision back by degrees.
    var FX = (function() {
      var m = /[?&]fx=(\d)/.exec(location.search);
      return m ? +m[1] : 0;
    })();
    var FXS = [
      // 0 — as shipped. All the change happens off-screen.
      { inEase: 'power2.out', outEase: 'power2.in', s: scaleMin, o: dimMin },
      // 1 — same range, easing reversed. The card stays small while it climbs
      // the screen and comes up to size as it reaches the middle, so the change
      // lands where you are looking instead of before you get there.
      { inEase: 'power2.in', outEase: 'power2.out', s: scaleMin, o: dimMin },
      // 2 — the same again, linear. The most obvious, and the one most at risk
      // of the drift the original easing was there to avoid.
      { inEase: 'none', outEase: 'none', s: scaleMin, o: dimMin },
      // 3 — depth carried by light rather than size. The card barely changes
      // shape, so there is almost no edge movement under the eye, but it comes
      // up out of the dark much harder than it does now.
      { inEase: 'power2.in', outEase: 'power2.out', s: 0.955, o: 0.22 }
    ];
    var fx = FXS[FX] || FXS[0];

    // ---------- WHERE YOU ARE IN THE SET ----------
    // Shown while the cards are what is on screen and taken away either side of
    // them, so it never floats over the hero or the footer, where there is
    // nothing for it to be counting.
    //
    // This runs under reduced motion as well. It is a readout, not an effect —
    // the only thing the preference takes off it is the way the digit changes.
    var counter = document.getElementById('hp-count');
    var rows = counter ? counter.querySelectorAll('.hp-count__row') : [];
    var shown = 1;

    // Nothing to sequence. Every row is already on the page with its own colour
    // and size transition, so moving the lit one is a class swap and the CSS
    // crossfades the two against each other.
    function setCount(n) {
      if (n === shown || !rows.length) return;
      shown = n;
      for (var i = 0; i < rows.length; i++) {
        rows[i].classList.toggle('is-now', i === n - 1);
      }
    }

    if (counter && casesEl) {
      ScrollTrigger.create({
        trigger: casesEl,
        start: 'top 72%',
        end: 'bottom 28%',
        onToggle: function(self) {
          counter.classList.toggle('is-on', self.isActive);
        }
      });
    }

    // ---------- THE CARDS ----------
    // Eased at both ends rather than linear, so the card is close to full size
    // for the whole time it is the one you are looking at and does its growing
    // while it is still arriving. A linear ramp makes the size change
    // constantly under the cursor, which reads as drift.
    //
    // opacity rides along with the scale. It is the second compositor-only
    // property there is — no width, no filter, nothing that returns the card to
    // layout or to the paint step on a scroll frame — so rule 2 above still
    // holds. Scale alone was carrying the whole effect and a 10% size change
    // across a screen of travel is not much to carry it with; light is what the
    // eye actually reads as depth.
    function carousel(card, st) {
      gsap.timeline({ defaults: { force3D: true }, scrollTrigger: st })
        .fromTo(card,
          { scale: fx.s, opacity: fx.o },
          { scale: 1, opacity: 1, duration: 1, ease: fx.inEase }, 0)
        .to(card, {
          scale: fx.s, opacity: fx.o, duration: 1, ease: fx.outEase
        }, 1);
    }

    // One-shot entrance for the text, once:true so it costs nothing per scroll
    // frame. The artwork is not faded in separately — it is the card, and
    // fading it in under a carousel that is already scaling it is two effects
    // arguing.
    function headIn(card, st) {
      var head = card.querySelector('.hp-case__head');
      if (!head) return;
      gsap.set(head, { opacity: 0, y: 24 });
      st.once = true;
      st.onEnter = function() {
        gsap.to(head, {
          opacity: 1, y: 0, duration: 0.9, ease: 'expo.out', force3D: true
        });
      };
      ScrollTrigger.create(st);
    }

    // A card owns the count from the moment its top passes the middle of the
    // screen until its bottom does. Between two cards neither is over the
    // middle and the last one there keeps it, which is the right answer: in the
    // gap you are still leaving the card you just read.
    //
    // Both edges are computed rather than written as 'top center'. A keyword
    // resolves against the element's bounding box, and the carousel has a
    // transform on every one of these cards: one sitting at its resting 0.85
    // measures as a box smaller than the card and about 60px further down the
    // page than the card occupies, so a trigger built from it fires late by
    // roughly that much. Card three had the middle of the screen while the
    // index still said two.
    //
    // offsetTop and offsetHeight are the layout box, which no transform
    // touches, so the edges come from those and are handed over as scroll
    // positions. Functions, so a resize or the webfont swap re-measures them on
    // the same refresh as everything else.
    function layoutTop(el) {
      var y = 0;
      for (var n = el; n && n !== root; n = n.offsetParent) y += n.offsetTop;
      return y;
    }

    cards.forEach(function(card, i) {
      if (!REDUCED) {
        headIn(card, { trigger: card, start: 'top 82%' });
        carousel(card, {
          trigger: card,
          start: 'top bottom',
          end: 'bottom top',
          invalidateOnRefresh: true,
          scrub: true
        });
      }
      ScrollTrigger.create({
        trigger: card,
        start: function() { return layoutTop(card) - window.innerHeight / 2; },
        end: function() {
          return layoutTop(card) + card.offsetHeight - window.innerHeight / 2;
        },
        onEnter: function() { setCount(i + 1); },
        onEnterBack: function() { setCount(i + 1); }
      });
    });

    // ---------- FOOTER ----------
    var footer = document.getElementById('hp-footer');
    if (footer) {
      reveal(footer, [
        { els: footer.querySelectorAll('.hp-eyebrow--rule, .hp-footer__title'), y: 30, stagger: 0.1 },
        { els: footer.querySelectorAll('.hp-footer__lede, .hp-footer__ctas, .hp-footer__base'), y: 24, stagger: 0.09, at: 0.3 }
      ]);
    }

    ScrollTrigger.refresh();

    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() { ScrollTrigger.refresh(); }, 180);
    });
  }

  function init() {
    try {
      build();
      revealNav();
      initBackToTop();
      initWorkAnchor();
      initHero();          // starts the cursor field once the entrance lands
      initScrollScenes();

      // Webfont metrics change where the description wraps, which changes how
      // tall a card's text block is; the carousel's start and end are measured
      // from the card, so the triggers have to be recomputed once the fonts are
      // in. Nothing is re-measured by hand any more — the card takes its height
      // from the artwork's own aspect, which does not depend on the fonts.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() {
          if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh();
        });
      }
      console.log('HP ' + VERSION + ' ready');
    } catch (err) {
      console.error('HP ' + VERSION + ' error:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
