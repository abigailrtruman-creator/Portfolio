<!-- Everything from here to the <title> is document metadata, and it sits ABOVE
     the title deliberately: build-injection.py cuts the file at the <title>
     line, so none of this reaches the Squarespace build. That is correct — a
     code injection cannot own the page's title, description, canonical or
     icons, because Squarespace emits its own. It belongs to this document.

     The description is the statement verbatim, 156 characters, so the words in
     a search result are hers. The aside under it is left out: a snippet should
     carry the pitch, and with the aside the line runs past 200 characters and
     would be cut mid-joke. -->
<meta name="description" content="I perfect the pixels, piece together the bigger picture and take ideas from pencil to production. Through it all, I invest in people as much as the product.">
<link rel="canonical" href="https://abbietruman.vercel.app/">

<!-- Open Graph and Twitter, so a link she sends a hiring manager unfurls as her
     hero instead of as a bare URL. Absolute URLs throughout: scrapers do not
     resolve relative paths against the page they found them on.
     og:image is a static PNG and has to be. No scraper runs JavaScript, and
     this page builds its hero in JS, so the card is a photograph of the hero
     rather than the hero itself — see build-og-image.py, which takes it, hashes
     it and rewrites the two URLs below. It has to be retaken whenever the hero
     copy changes. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Abbie Truman">

<!-- The circular AT monogram, built by build-favicon-at.py (prefix 'atc').
     The PNGs are content-hashed because vercel.json serves /assets/*
     immutable for a year; favicon.ico is at the root, where that header does
     not apply, because browsers request /favicon.ico by default and that path
     cannot carry a hash. It is a copy of the staged favicon-atc.ico.
     build-favicons.py still writes the rejected photograph straight to
     /favicon.ico, so it must not be run against this tree. -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-atc-16.7a5e6b0e.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-atc-32.7a5e6b0e.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-atc-180.7a5e6b0e.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-atc-192.7a5e6b0e.png">

<title>Abbie Truman — Product Design Leader in the UK</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- GSAP, hers, in her own repo — the same argument as the avatar and the CV, and
     with more riding on it than either. These two files were hot-linked from
     jsdelivr, which made the homepage's opening depend on a third party being
     reachable at the moment a hiring manager opened it. When they are not, this
     page does not degrade gracefully: initHero returns early so the hero never
     animates, initScrollScenes warns and returns, and the wordmark is left as
     420vh of scroll with three motionless rows in it. That is not a site with the
     animation switched off, it is a site that looks broken, and corporate networks
     that block public CDNs are exactly the networks the people she is applying to
     sit behind.
     Unmodified dist files at 3.13.0, hashed the way every other asset here is
     hashed, because /assets/* is served immutable for a year — the version is in
     the name for a reader and the digest is in it for the cache. Upgrading means
     downloading, re-hashing and rewriting both of these lines together.

     Deferred, and the two ordering guarantees that makes safe are worth stating:
     deferred scripts execute in document order, so ScrollTrigger still finds gsap,
     and they execute before DOMContentLoaded, which is the event init() already
     waits for. What defer buys is the parser — two synchronous scripts here used
     to stop the parse before the stylesheet below them had been read, so the
     browser could not even paint the background.
     What neither change buys is the hero arriving without JavaScript at all:
     DOMContentLoaded waits for deferred scripts too, and the markup is built in
     JS, so the opening view is still gated on these two files. Same origin and
     an already-open connection is most of what that gate costs; removing it
     entirely would mean building the markup at parse time and holding the
     pre-entrance state in CSS, which trades this page's one-file simplicity for a
     hero that is invisible if the stylesheet and the script ever disagree. -->
<script defer src="/assets/gsap-3.13.0.96c01b81.js"></script>
<script defer src="/assets/scrolltrigger-3.13.0.30821939.js"></script>

<style>
  html.hp-active, html.hp-active body {
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    height: 100vh !important;
    background: #0a0a0c !important;
    color: #f5f5f5 !important;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .hp-root {
    /* ---------- TYPE SYSTEM ----------
       Two families, no third. One governing rule, applied to every element on
       this page:

         DISPLAY  → Manrope. Every headline and every word set above ~28px:
                    the wordmark, case titles, section ledes, the footer line.
                    800 for short headlines, 700 for multi-line statements so
                    long runs don't go blobby. The hero statement is not among
                    them. It is the same face as the greeting, at paragraph
                    size, so the block does not change form halfway down.
         BODY/UI  → Inter. Every sentence you actually read, plus all labels,
                    eyebrows, nav and buttons. Where a sentence needs a
                    word lifted out of it, that is Inter 500 in full white.

       There is no serif and no accent face. Instrument Serif italic used to
       carry one phrase per section; the sections that held those phrases were
       deleted or reset one at a time until the footer's "talk." was the last
       one on the page, and that word is now Manrope too. The family has been
       dropped from the Google Fonts request as well as from the stylesheet —
       an unused font file is a real download, not a spare part. */
    --ff-display: 'Manrope', 'Inter', -apple-system, sans-serif;
    --ff-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

    --bg: #0a0a0c;
    --ink: #ffffff;
    --ink-1: rgba(255,255,255,0.74);
    --ink-2: rgba(255,255,255,0.52);
    --ink-3: rgba(255,255,255,0.40);
    --rule: rgba(255,255,255,0.10);

    --pad-x: clamp(28px, 6vw, 110px);
    --shell: 1560px;

    position: fixed;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--bg);
    z-index: 999999;
    font-family: var(--ff-body);

    /* The pill's underside at desktop, 28 of offset plus 78 of pill, with a
       little air under it. While the pill is on screen the cards park no
       higher than this; while it is away, --deck-clear drops to nothing and
       the cards sit on the centred line. See .hp-cases__list. */
    --deck-clear: 124px;
  }
  .hp-root.is-nav-away { --deck-clear: 0px; }
  .hp-root * { font-family: inherit; box-sizing: border-box; }

  /* ---------- Shared primitives ---------- */
  .hp-eyebrow {
    display: block;
    /* 12px from about 545px of window up. Below that it comes down with the
       viewport, so on a phone it is not the same size as on a desktop. */
    font-size: clamp(8.5px, 2.2vw, 12px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
  }
  .hp-eyebrow--rule {
    display: inline-flex;
    align-items: center;
    gap: clamp(8px, 2vw, 12px);
  }
  .hp-eyebrow--rule::before {
    content: '';
    width: clamp(16px, 4.2vw, 28px);
    height: 1px;
    background: rgba(255,255,255,0.3);
  }

  /* ---------- NAV (floating pill) ----------
     Content-width and centred at every width: no width is set anywhere, so the
     pill is only ever as long as the brand and the links inside it. The phone
     block's max-width is a guard against the screen edges, not a width.

     It should not be stretched to the page's column at any breakpoint. A pill
     wide enough to push the two groups to opposite ends leaves the brand divider
     stranded after her name, separating a group from a few hundred pixels of
     nothing, and the two ends stop reading as a pair. Hugging is what keeps the
     divider doing its job. */
  .hp-nav {
    position: fixed;
    top: 28px;
    left: 50%;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 24px;
    /* Left padding equals the vertical padding, which is what makes the space
       around the avatar even rather than merely equal-looking in the stylesheet.
       The pill's ends are fully round, so the end cap's radius is half the height,
       which is the avatar's radius plus this padding. The avatar is therefore
       concentric with the cap only when the left padding matches the vertical one,
       and then the gap is the same at the far left as it is above and below.

       At 12px vertical against 16px left it was not: 13px over and under, 17px at
       the extreme left, and because the cap curves away between the two the gap
       visibly pinched at the avatar's upper-left shoulder. Both are 15px now, so
       the surround is a constant 16px around the whole end.

       15 against a 46px avatar, down from 18 against 52: the pill was 90px deep
       and read as a bar rather than as something floating over the page. The two
       numbers move together or not at all — dropping the padding alone would
       leave the avatar 3px off the centre of the round end.

       This only holds while the avatar is the tallest thing in the row. Below
       900px the link's 44px tap-target floor is taller than the avatar, so it is
       centred in the row and the left padding has to carry that offset too; see
       those blocks. */
    padding: 15px 11px 15px 15px;
    background: rgba(18,18,22,0.55);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 999px;
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.07),
      0 32px 80px -16px rgba(0,0,0,0.55),
      0 6px 24px rgba(0,0,0,0.28);
    opacity: 0;
    transform: translate(-50%, -16px);
    transition: opacity 0.9s cubic-bezier(0.32,0.72,0,1), transform 0.9s cubic-bezier(0.32,0.72,0,1);
    /* Named for the cross-document transition into a case study, where the
       same pill exists at the same place: it holds still while the page
       changes under it instead of cross-fading with everything else. */
    view-transition-name: hp-nav;
  }
  .hp-nav.is-ready { opacity: 1; transform: translate(-50%, 0); }
  /* Out of the way while the reader is scrolling down through the cards, back
     the moment they scroll up or bring the pointer to the top edge. The reveal
     above is a 0.9s arrival; every toggle after it is quicker, because a pill
     that takes most of a second to leave is still over the artwork for most of
     a second. */
  .hp-nav.is-ready.is-hidden {
    opacity: 0;
    transform: translate(-50%, -28px);
    pointer-events: none;
  }
  /* is-live is added once the arrival has played; from then on both directions
     take the shorter duration. Set here rather than on is-hidden alone because a
     transition reads its duration from the state it is going TO, and the return
     journey has to be as quick as the departure. */
  .hp-nav.is-live { transition-duration: 0.45s, 0.45s; }

  .hp-nav__brand {
    display: flex;
    align-items: center;
    gap: 14px;
    /* Closes the brand group, and sits the same distance from her name as it does
       from `CV`. That distance is not one value: on the name's side it is this
       padding, but on the label's side it is the pill's gap plus the link's own
       left padding, 24 + 18 here. Setting the padding to 24 made the two inputs
       look equal in the stylesheet while the line sat 18px off centre between the
       two words, which is why this is 42 and why it is derived rather than
       matched by eye. Both inputs step down with the pill, so there is a value
       per breakpoint; if either moves, this moves with it.

       It also costs the two arrows room on a phone — this padding plus the rule
       itself — which is why the width the arrows are dropped at is measured with
       it in place, not without. */
    padding-right: 42px;
    border-right: 1px solid rgba(255,255,255,0.09);
  }
  .hp-nav__avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(255,255,255,0.16);
    display: block;
  }
  .hp-nav__name {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1.2;
    color: #fff;
    white-space: nowrap;
  }

  .hp-nav__links {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .hp-nav__link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 44px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
    border-radius: 999px;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .hp-nav__link:hover { background: rgba(255,255,255,0.06); }
  .hp-nav__arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.55);
    transition: color 0.25s ease, transform 0.25s cubic-bezier(0.32,0.72,0,1);
  }
  .hp-nav__link:hover .hp-nav__arrow { color: #fff; transform: translate(3px, -3px); }
  .hp-nav__arrow svg { width: 16px; height: 16px; display: block; }

  /* ---------- HERO ----------
     All three pieces of copy are one block: the greeting reads into the
     statement, the statement is the largest thing on the page, and the support
     paragraph reads back out of it. The intervals inside that block are much
     smaller than the intervals around it, which is what makes it read as one
     thought rather than three stacked elements.
     The rule used to sit between the statement and the support paragraph,
     which cut the copy in half. It now sits below all of it and separates only
     the scroll cue, so it still gives the composition a second horizontal edge
     to close on — the cue is too small to hold the bottom of a full-height
     section by itself — without splitting anything anyone reads. */
  .hp-hero {
    /* The hero's body size. The greeting and the scroll cue share it. The
       aside used to as well, and the joke then read as a second greeting.
       It has its own smaller curve, so it is the quietest line in the stack.
       The greeting stays a step under the statement, which is the large type. */
    --hero-body: clamp(15px, 1.6vw, 24px);
    --hero-aside: clamp(15px, 1.6vw, 24px);
    position: relative;
    min-height: 100vh;
    max-width: var(--shell);
    margin: 0 auto;
    padding: clamp(112px, 13vh, 150px) var(--pad-x) clamp(36px, 5vh, 64px);
    display: grid;
    /* One column, and it must be allowed to be narrower than its content.
       The logo row is a track many times the width of the hero. Without a
       floor of zero the grid sizes the column to that track, the hairline
       runs out through the right padding, and the window clips the marks. */
    grid-template-columns: minmax(0, 1fr);
    /* Four tracks, two of them empty, so spare height is *divided* rather
       than pooled. Rows 1 and 3 are the clearance above the copy block and the
       open field below it. The slack splits 1 : 1.15. 1.8 was the ratio for
       the longer paragraph, and with this one it left the block high: 184px
       under the pill and 311px above the marks at 1440x900, the words 64px
       above the centre of that field. 1 : 1 puts the block a few pixels below
       centre. 1.15 leaves it a hair above — 11px at 1440x900, 11px at
       1280x800, 5px at 1920x1080, 10px at 1024x768 — with the two gaps within
       about 20px of each other. The nav clearance at that ratio is 180px at
       1024x768, the tightest desktop measured, and the marks still clear the
       fold.
       The minmax() floor on row 3 is the smallest gap the
       marks may ever have from the copy: they are pinned to the foot of the
       first screen, and they must never read as part of the paragraph. Both
       spacer tracks collapse on short viewports where there is no slack.
       Landscape phones do not use this ratio: that breakpoint sets the top
       track to 0fr and hides the marks. */
    grid-template-rows: 1fr auto minmax(clamp(96px, 14vh, 180px), 1.15fr) auto;
    gap: 0;
  }
  /* Ambient glow. The copy is capped at --shell, but light in a room is not,
     and painting the haze inside that same box put a hard vertical edge down
     the page wherever the window was wider than the cap — the gradient still
     had a third of its strength left when it hit the hero's left edge, so it
     stopped dead rather than fading out.
     So the painted area is full-bleed while the geometry stays measured off
     the capped box. `at 10%` of a 100vw box would slide the light rightwards
     as the window grew and unstick it from the headline, so the focal point is
     given as an offset from the centre the hero is already aligned to instead:
     50% - 0.40 * measure is arithmetically the old 10% of the measure, and the
     50% is the element's own centre, so it tracks the copy rather than the
     window. Vertical stays in percentages — the box height is unchanged.
     Not position:fixed: this has to scroll with the hero inside .hp-root.

     An element rather than .hp-hero::before, which is what it was. The exit
     dims and contracts the light as the hero leaves, and a pseudo-element
     cannot be handed to GSAP — the only way to animate one is to re-declare
     the gradient through a custom property on the parent, which repaints a
     full-viewport gradient on every scroll frame. The div is the same box in
     the same place: position:absolute takes it out of flow, so it is not a
     grid item and the four tracks above are untouched, and it stays the
     hero's first painted child the way the pseudo-element was. */
  .hp-hero__glow {
    /* The hero's own width. Reading it off the viewport is a few px out below
       the cap on platforms with classic scrollbars, which is nothing against a
       ~540px falloff, and above the cap — where the seam was — it is exact. */
    --glow-measure: min(100vw, var(--shell));
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 100vw;
    margin-left: -50vw;
    pointer-events: none;
    /* The focal point of the key light, restated as the origin of the scale, so
       the light contracts toward its own centre instead of sliding leftwards
       out of the copy as it shrinks. Same expression as the `at` in the key
       light below, which is why the two have to be read together: they describe
       one point in one box. Declared here rather than passed to GSAP because a
       calc() with a custom property in it is not something a transform origin
       should be parsed out of and rebuilt by JS. */
    transform-origin: calc(50% - 0.40 * var(--glow-measure)) 22%;
    will-change: transform, opacity;
    backface-visibility: hidden;
  }
  .hp-hero__glow-a,
  .hp-hero__glow-b,
  .hp-hero__lamp { position: absolute; inset: 0; }

  /* The key light, unchanged and deliberately motionless. This is the gradient
     that was calibrated against the copy — the geometry below is the same
     arithmetic it has always been — and it is the one thing in here that does
     not move, for a reason that is not caution: it is clipped on purpose. Its
     ellipse extends well past the left edge of the box so the light bleeds off
     the side of the page instead of ending in a visible falloff, which means the
     box edge is doing real work. Translate this layer by even 20px and that edge
     comes inboard, and a strip of bare background appears down the left of the
     screen with a tenth of the light's strength stopping dead against it.
     Everything that moves in this hero is therefore a separate layer, and every
     one of those is drawn to stay well inside its own box. */
  .hp-hero__glow-a {
    background: radial-gradient(
      ellipse calc(0.62 * var(--glow-measure)) 52%
      at calc(50% - 0.40 * var(--glow-measure)) 22%,
      rgba(94,116,178,0.13) 0%, transparent 68%);
  }

  /* The second light, which is new, and which is in the lower right because that
     is the emptiest part of the composition. It is not there to be seen as a
     light — at 0.085 against the key light's 0.13 it is under half the strength
     and it has no edge anywhere — it is there so the field behind the copy has
     more than one source in it, which is the difference between a lit room and a
     gradient.
     Everything about its geometry is chosen to be self-contained. Percentages of
     its own box rather than of --glow-measure, because unlike the key light it is
     not aligned to anything — it should stay in the empty third at any width, and
     the empty third is a fraction of the window. The radii are 26% and 24% with
     the transparent stop at 70% of the ray, so the light is invisible beyond
     about 18% from its centre: it reaches 50% and 86% horizontally, which leaves
     roughly 14% of the box clear on the near side and far more on the far one.
     The drift and the pointer between them move it by at most ~5%, so no edge of
     this layer can ever arrive on screen. */
  .hp-hero__glow-b {
    background: radial-gradient(
      ellipse 26% 24% at 68% 62%,
      rgba(94,116,178,0.085) 0%, transparent 70%);
    will-change: transform, opacity;
    backface-visibility: hidden;
  }
  /* The pointer's own layer, and the only reason it exists is that the drift and
     the parallax are two motions with different time bases on one light. GSAP
     owns `x`/`y` here and `xPercent`/`yPercent` on the layer inside it; on one
     element those are the same matrix and the faster one would keep resetting
     the slower. Nested, they compose. */
  .hp-hero__lamp {
    will-change: transform;
    backface-visibility: hidden;
  }

  /* The copy block. `gap` is the greeting-to-statement interval, deliberately
     the tightest one in the hero so the greeting reads as a lead-in rather than
     a separate line of text. */
  .hp-hero__main {
    grid-row: 2;
    position: relative;
    display: flex;
    flex-direction: column;
    /* The statement's column from the frame: 1271px at 1504 wide, centred.
       The gap is a step under the statement's line: close enough that the
       greeting reads as its lead-in, open enough to be a separate line. */
    justify-self: center;
    width: min(100%, 1271px);
    align-items: stretch;
    text-align: center;
    gap: clamp(12px, 1.5vw, 22px);
  }
  .hp-hero__greeting {
    margin: 0;
    font-family: var(--ff-display);
    font-size: var(--hero-body);
    line-height: 1.375;
    letter-spacing: 0;
    font-weight: 500;
    color: #fff;
  }
  .hp-hero__greeting strong { color: var(--ink); font-weight: 500; }

  /* The wink. Same face and colour as the greeting, a size down from it, so
     the joke is the quietest line in the stack rather than a second greeting.
     It is not display type. Set at the statement's size the joke would be the
     loudest line on the page, and the page's largest type has to stay the
     thing that gets her hired.
     The flex gap above is the same interval as the greeting, which held the
     wink against the statement. The extra margin is hers: a little more air,
     so the aside reads as a step down rather than as the next line. It is not
     applied on a landscape phone, where that air is the difference between the
     line and the fold. */
  .hp-hero__aside {
    /* A little more than the greeting's gap, so the wink reads as a step
       down from the statement rather than as its next line. */
    margin: clamp(4px, 0.6vw, 10px) auto 0;
    max-width: none;
    font-family: var(--ff-display);
    font-size: var(--hero-aside);
    line-height: 1.375;
    letter-spacing: 0;
    font-weight: 500;
    color: #919191;
  }

  .hp-hero__statement {
    margin: 0;
    /* Manrope 48 / 66 on the 1504 frame, the same face as the greeting.
       The size comes down with the viewport; 66/48 is the line-height. */
    max-width: none;
    font-family: var(--ff-display);
    font-weight: 500;
    font-size: clamp(22px, 3.19vw, 48px);
    line-height: 1.375;
    letter-spacing: 0;
    color: #fff;
  }
  /* Words stay in nowrap wrappers so a multi-line heading breaks between
     words, not between letters, once every glyph is its own inline-block. */
  .hp-hero__word { display: inline-block; white-space: nowrap; }
  /* Same mechanism one level up: a run of words that must not be split from
     each other, so the statement can never end on a single word. */
  .hp-hero__keep { white-space: nowrap; }

  /* The entrance works a line at a time rather than a letter at a time. After
     the webfont has landed the words are measured, grouped by the line they
     fell on, and each group is wrapped in one of these: a box exactly one line
     tall that clips, with the words inside it starting below the box and rising
     into it. The sentence is uncovered rather than assembled, which is how a
     sentence should arrive. The wrappers are removed again once the entrance
     has played, so the statement wraps normally on resize afterwards.
     The padding and negative margins are the allowance for the glyphs: at a
     line-height of 1.03 the ascenders and descenders both stand outside the
     line box, so a box clipped to it takes the top off d and h and the tail
     off g and p. The box is given room both ways and the stack takes it back,
     so the leading is what it was. The script starts each line far enough
     down to clear the whole box, padding included. */
  .hp-hero__line {
    display: block;
    overflow: hidden;
    white-space: nowrap;
    padding: 0.12em 0 0.16em;
    margin: -0.12em 0 -0.16em;
  }
  .hp-hero__line-in { display: block; will-change: transform; }

  /* One sentence per block, which is the only way the four-beat structure of the
     statement survives the width sweep. Left to flow as one paragraph the
     sentence breaks land wherever the measure runs out: at 1920 and 1152 they
     happened to fall at line ends and the statement read as two stanzas, while
     at 1280-1680 the same copy set as `except the problems. I design, I lead,
     and I` — a new sentence starting three words from the end of a line, which
     is the one place a full stop cannot be seen. The copy is written as four
     escalating beats, so a visitor who never sees them has been served
     different writing to the one that was approved.
     Blocks, not <br>: a forced break is a decision about where a line ends,
     which is width-dependent and would need a value per breakpoint. This is a
     decision about where a sentence ends, which is width-independent, so it
      needs stating once. The statement is one paragraph now, so it is one
     block: the three sentences flow, and a full stop can land mid-line, which
     is what a paragraph does. Within the block the text wraps normally. */
  .hp-hero__statement-inner,
  .hp-hero__sentence { display: block; }
  /* While the entrance has each line in its own clip box, those boxes are flex
     items. Their padding and the negative margin that cancels it would
     otherwise collapse between lines, so the leading opens up for the
     entrance and snaps shut when the boxes are removed. Flex items do not
     collapse, so the gap on screen is the gap the type settles at. */
  .hp-hero__sentence:has(.hp-hero__line) {
    display: flex;
    flex-direction: column;
    /* Each line box is as wide as its own words, and centred, so the
       entrance plays as the centred stack the paragraph settles into.
       Starting them on the left snapped the block sideways when the boxes
       came off. */
    align-items: center;
  }
  /* Most of a line between the sentences. They are three beats, and without
     the air they read as one paragraph set large. A full blank line is the
     next step and it spends the fold. `lh` is one line at any line-height;
     the em value is the fallback where `lh` is unsupported. */
  .hp-hero__sentence + .hp-hero__sentence {
    margin-top: 0.75em;
    margin-top: 0.75lh;
  }
  /* Balanced within each block, because a block per sentence fixes where the
     full stops land but not how the words inside them distribute. Greedy
     wrapping fills each line to the measure and hands the remainder to the last
     one, which is how a full line ends up sitting above a stub; balancing evens
     them instead.
     Safe here specifically because these blocks are short: the algorithm is
     capped at six lines per block in Chromium, and none of the three sentences
     reaches that — about two lines from a laptop up, and at most four on a phone —
     so it never silently stops applying. Where it is
     unsupported the hp-hero__keep runs still hold the phrases that must not
     come apart, which is the floor this is an improvement on rather than a
     dependency. */
  .hp-hero__sentence { text-wrap: balance; }
  /* "Through it all" is its own line. The second sentence is its own block,
     so it starts a line, and the margin stays at nothing so that line sits
     in the same leading as the two above it. */
  .hp-hero__statement .hp-hero__sentence + .hp-hero__sentence {
    margin-top: 0;
  }

  /* The closing band: the clients drifting along the foot of the first
     screen. There is no rule above them. A hairline here sat in the middle
     of the open field, nearer the marks than the words, and read as a lid on
     the logos rather than as an edge of anything; the dark does the
     separating, and the marks fading at either end are the only edge the
     band needs. */
  .hp-hero__lower {
    grid-row: 4;
    position: relative;
    display: block;
    min-width: 0;
  }

  /* ---------- RECENT CLIENTS ----------
     The proof, drifting along the line that closes the hero. Logos rather
     than names: a mark is recognised before it is read. One colour and no
     colour. These are a list, and a row of brand colours would be the loudest
     thing on a page that is otherwise black and white.

     Each mark is a mask over the current colour, so the SVGs and the PNGs
     take the same grey and the same hover without a treatment each. Lloyds
     is the horse and the word as one mark. Each gets its own height, because
     a script, a symbol lockup and a heavy wordmark at one height do not look
     one size. The heights were set by eye. The widths follow each file's
     own ratio. Amundi is the lockup as given, word, rule and line, at a
     height that sits with the others. The small line is part of the mark
     even where it cannot be read.

     The row is drawn twice and moved by half its own width, so the join is
     two copies of the same gap and the loop has no seam. The fade is a mask
     on the window, not a cover laid over the page: the marks thin out at
     the edges instead of arriving as a hard cut. Hover and keyboard focus
     pause it, because a mark you are trying to read or reach should hold
     still. Under reduced motion the second copy goes and the first sits. */
  .hp-hero__clients {
    width: 100%;
    min-height: 44px;
  }
  .hp-hero__marquee {
    overflow: hidden;
    width: 100%;
    --fade: clamp(32px, 8vw, 120px);
    -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent);
    mask-image: linear-gradient(to right, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent);
  }
  .hp-hero__track {
    display: flex;
    width: max-content;
    animation: hp-clients-drift 48s linear infinite;
    will-change: transform;
  }
  .hp-hero__marquee:hover .hp-hero__track,
  .hp-hero__marquee:focus-within .hp-hero__track {
    animation-play-state: paused;
  }
  @keyframes hp-clients-drift {
    from { transform: translate3d(0, 0, 0); }
    to { transform: translate3d(-50%, 0, 0); }
  }
  .hp-hero__clients-list {
    display: flex;
    align-items: center;
    flex: none;
    /* Half a gap of padding each side, so the seam between the two copies
       is the same interval as the gap between two marks. */
    --logo-gap: clamp(56px, 6.4vw, 108px);
    gap: var(--logo-gap);
    margin: 0;
    padding: 0 calc(var(--logo-gap) / 2);
    list-style: none;
  }
  .hp-hero__client {
    display: block;
    color: var(--ink-2);
    background-color: var(--ink-2);
    text-decoration: none;
    transition: background-color 0.45s ease;
  }
  .hp-hero__client:hover,
  .hp-hero__client:focus-visible {
    background-color: var(--ink);
    outline: none;
  }
  .hp-hero__logo {
    display: block;
    /* --h is the frame. The ink does not fill every frame the same way:
       a script and a circle use the whole height, a word under a set of
       bars or over a tagline does not. The height is chosen so the ink
       matches, and --oy slides a mark whose weight is not in the middle
       of its frame. */
    height: var(--h);
    width: calc(var(--h) * var(--r));
    transform: translateY(var(--oy, 0));
    -webkit-mask: var(--mark) center / contain no-repeat;
    mask: var(--mark) center / contain no-repeat;
    background-color: var(--ink-2);
  }
  .hp-hero__logo--boots   { --h: 22px; --r: 1.887; --mark: url(/assets/logo-boots.e629e6b8.svg); }
  .hp-hero__logo--bc      { --h: 24px; --r: 2.802; --mark: url(/assets/logo-british-cycling.5e9b5aaf.png); }
  .hp-hero__logo--lloyds  { --h: 24px; --r: 3.633; --mark: url(/assets/logo-lloyds.96ad6dfe.png); }
  .hp-hero__logo--pwc     { --h: 26px; --r: 1.936; --oy: -6%; --mark: url(/assets/logo-pwc.2065f915.svg); }
  .hp-hero__logo--amundi  { --h: 25px; --r: 2.547; --oy: 8%; --mark: url(/assets/logo-amundi.92ce4aa1.png); }
  .hp-hero__logo--imi     { --h: 24px; --r: 2.043; --mark: url(/assets/logo-imi.64e95895.png); }


  /* ---------- WORDMARK (3 rows converge → scale down) ----------
     Motion, scale values and scroll cost are locked; only the mechanism has
     changed. The section used to be 100vh and was held in place by GSAP
     writing a transform to it on every scroll update. Inside a custom
     overflow-y:auto scroller that transform is a main-thread write racing a
     compositor-thread scroll, which is what made it shake.

     Now the section is simply tall — 100vh of stage plus the 320vh the
     animation is scrubbed over, matching the old pin distance exactly — and
     the stage inside it is position:sticky. The compositor holds the stage
     still on its own, with no JS in the loop, and GSAP is left doing the one
     thing it is good at here: mapping scroll position onto the timeline. */
  .hp-wordmark {
    position: relative;
    width: 100%;
    /* 100vh of stage plus 120vh of scrubbed travel, down from 320vh. The
       three-row slide, converge and shrink read exactly the same over the
       shorter distance; what the extra two screens were buying was time on a
       title card, at the cost of the first client name arriving five screens
       down the page. */
    height: 220vh;
    background: #0a0a0c;
  }
  .hp-wordmark__stage {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Has to live on the stage, not the section: an overflow other than
       visible on an ancestor would make that ancestor the sticky element's
       scrollport and kill the stick entirely. */
    overflow: hidden;
    background: #0a0a0c;
  }
  /* Reduced motion gets the mark as a static composition, so the section
     costs one screen of scroll instead of four with nothing happening. */
  .hp-wordmark--static { height: 100vh; }
  .hp-wordmark__inner {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* Promote to its own compositing layer so the scale-down is GPU
       interpolated rather than re-rasterising glyphs every frame. */
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
  }
  .hp-wordmark__row {
    position: relative;
    width: 100%;
    text-align: center;
    font-family: var(--ff-display);
    font-weight: 800;
    /* "Selected work" sets ~6.5x its own font-size wide and must not be
       clipped, so the vw term is what keeps it inside the viewport: 13.5vw
       fills ~87% of the width. The vh term only engages on genuinely short
       viewports (landscape phones), where three rows at the vw size would
       otherwise be taller than the section and get sliced top and bottom.
       There is deliberately no px floor — a fixed floor overflows narrow
       screens, which is what clipped the mark below ~470px. */
    font-size: min(13.5vw, 28vh, 210px);
    /* Optically centred glyphs in a row box that is still exactly one em tall.
       Both halves of that matter.
       Manrope's ascent and descent do not straddle the em evenly, and "Selected
       work" has nothing below the baseline but the overshoot of its round
       letters, so at line-height:1 the row's box carries 0.148em of empty space
       above the glyphs and 0.102em below them: measured, 28.8px against 19.8px
       at the 194px desktop size. The glyphs therefore sit 4.5px low in their
       own box, which is what makes the middle row read as hanging below centre
       between its neighbours — the boxes are the page's own black, so the only
       thing the eye can measure is where the ink sits inside them.
       Half of that difference, 0.0232em, is taken out of the line-height, which
       moves the baseline up by exactly that much and leaves 0.125em of space
       top and bottom. `height` then puts the em back, because the row's own
       height is the distance GSAP moves it: the convergence is yPercent 100,
       a percentage of this element, and it has to land each outer row exactly
       on the middle one. Trimming the box instead — text-box-trim, which this
       Chrome does support — cannot be used for that reason: it changes the
       height it is trimming, and the pitch and the travel are the same number.
       Not a transform either, for the same reason: GSAP owns that. */
    height: 1em;
    line-height: 0.9535;
    letter-spacing: -0.05em;
    color: #fff;
    white-space: nowrap;
    background: #0a0a0c;
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
  }
  /* Middle row sits above the outer two so they slide in behind it. */
  .hp-wordmark__row:nth-child(2) { z-index: 2; }


  /* ---------- CASE STUDY CARDS ----------
     Each card is one image the owner supplied, with a sentence and an arrow laid
     into the empty area she left at the top of it.

     Nothing here draws a card any more. The colour, the rounded corners, the
     browser window and its chrome, the phone composition and every shadow are
     baked into her artwork, so the only work left is to place her image and put
     the sentence and the arrow back where she had them in the
     composite. Anything this stylesheet drew over that would be a second
     designer's opinion arriving uninvited, which is what the previous version
     of this section had become.

     The cards scroll normally. There is no pin and no sticky stack: the card
     nearest the middle of the screen is at full size and the others sit
     smaller. That is a scroll-linked transform on an element that is not trying
     to hold still, and the distinction is the whole reason it is safe here. The
     wordmark shook for months because JS wrote a transform to keep something
     stationary inside this compositor-scrolled container, where a main-thread
     write races a compositor-thread scroll; on a stationary element that race
     is visible as jitter, on a scale it is not. */
  /* The tokens are shared with .hp-build, which holds card 01 while it is
     being built and has to size, round and space that card exactly as this
     section sizes the other four — the build's last frame IS card 01 at rest,
     and a token read here and restated there would be a seam waiting to open.
     Only the tokens are shared; the section's own box follows in its own
     rule, because the build is a full-width stage and not a column. */
  .hp-cases,
  .hp-build {
    /* The card is constrained from the height again, and by a different thing
       than it used to be. The old cap here existed so three cards could stack
       inside one viewport; there is no stack, so that reason went. What replaced
       it is one card having to fit one viewport, which is not the same
       requirement and produces a different number. See --card-cap-h. */
    /* One column, the cards, and nothing beside them. (An index of the set
       once took a grid track down the right; it floated, and then it went.)
       The whole content width is the card's to use and the card is centred
       in the page rather than in what was left after the rail.

       Named here because two separate things need the same arithmetic — the
       card's own width cap and the corner radius — and a card that disagreed
       with the space it sits in would be a scrollbar. */
    --content-w: calc(min(100vw, var(--shell)) - 2 * var(--pad-x));
    /* The same figure --card-w below reaches through 100%, written as a length
       because the radius needs it as one rather than as a share of a box it is
       not inside: a percentage there would resolve against whatever property it
       eventually lands in, and it lands in a corner radius. */
    /* The tallest card's aspect ratio, and it is the tallest rather than each
       card's own because all five have to be one width — a column whose cards
       changed width card to card would read as a mistake. So the one needing the
       most height decides for the set. Saddle and PwC are 3024x2798, which is
       0.9253; the other three are 0.8955 and get slightly more room than they
       need. A future export taller than this has to move this number with it. */
    --art-ar-max: 0.9253;
    /* The widest the card can be and still fit the screen it is on.
       Without this the card was sized from width alone, and on the laptops
       people actually use it came out taller than the viewport: 1003px of card
       in 900px at 1440x900, and 987px in 768px at 1366x768. Both mean the card
       can never be seen whole at any scroll position, which is what this fixes.
       It only governs where it needs to — above about 1140px of viewport height
       the 1120px cap is still the smaller number and nothing changes.

       svh rather than vh because the smallest viewport height is the one the
       card has to fit inside; the conservative end is the right end here.

       The card takes 78% of the height, not all of it. At the old allowance of
       one --card-gap the card at rest was 93% of the screen, which is a card
       with no room around it: the carousel's lit card is meant to sit in the
       dark with the dim ones showing either side, and at 93% there was no dark
       to sit in and the next card was never in frame to be dim. At 78% there
       is 11% of screen clear above and below the card when it is centred, and
       the lit card reads as a card rather than as the page. */
    --card-cap-h: calc(78svh / var(--art-ar-max));
    --card-w-px: min(var(--content-w), var(--card-cap-h), 1120px);
    --card-w: min(100%, var(--card-cap-h), 1120px);
    /* Taken from --card-w-px rather than in cqw because this applies to the
       query container itself, where container units resolve against an ancestor
       container instead of against the element.

       The artwork's own corner is cut at 0.0179 of the width. A clip can only
       round a corner further than the picture already is, so this used to sit
       just outside that curve — 0.02 — and its only job was to hide the black
       wedge the WebP flatten leaves outside it.

       It is past the artwork now, on purpose. The corners were asked to be
       rounder than the export, then eased back from 0.046 to 0.034: at the
       larger figure the card, and the white square that shares this radius,
       were reading too round. The wedge is inside the curve, so it goes with
       the clip rather than showing on the page.

       The floor stays 14px. On a phone the crop takes the artwork's corners
       away and this radius is the corner, and the old 16px floor was the
       roundest thing on the page at the width where the card is smallest. */
    --card-r: max(14px, calc(var(--card-w-px) * 0.034));
    --card-gap: clamp(26px, 6.5vh, 78px);
    /* Overlay geometry, declared here so the card and its descendants share one
       source for the description's legibility floor. */
    --sp-desc-floor: 19px;
    --sp-desc-ratio: 0.03636;    /* 64 / 1760 */
  }
  .hp-cases {
    max-width: var(--shell);
    margin: 0 auto;
    /* Top padding clears the fixed nav pill, which is 106px deep at desktop, 82
       at tablet and 72 on a phone, so the first card does not arrive already
       underneath it. */
    padding: clamp(80px, 12vh, 132px) var(--pad-x) clamp(24px, 6vh, 80px);
  }
  /* With the build on, the deck opens with the stage, which is a full screen
     and clears the nav by itself. */
  .hp-cases--build { padding-top: 0; }

  /* ---------- THE DECK ----------
     The cards do not scroll past; they stack. Each one is sticky at its own
     parking line, a little lower than the one before it, so as you scroll the
     next card rises over the one you were reading and parks on top of it,
     leaving a sliver of the earlier card showing above. Every card stays
     parked until the list runs out, and then the whole pile leaves together.
     That is the whole mechanism, and it is the browser's: no script places a
     card. What the script adds (see "the deck" in initScrollScenes) is that a
     card being covered draws back as the cover arrives — it scales down about
     its top edge and dims — so the pile reads as going into the page rather
     than as paper on paper.

     A flex column rather than a grid, because a sticky item is held inside
     its containing block and a flex item's containing block is unambiguously
     the container. The gap is the container's, not a margin on the card: a
     margin on a sticky element is part of the box that has to stay inside the
     container, and would let the card go a gap early at the end.

     The five parking lines are spread about the middle of the screen as one
     thing — the first two slivers above centre, the last two below — so the
     deck is centred and not hanging off the top. The spread is small on
     purpose: four slivers of flat colour are a depth cue, not a stack of
     paper to be read, and anything wider started to eat the card beneath. */
  .hp-cases__list {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--card-gap);
    --deck-peek: clamp(12px, 2vh, 20px);
    /* Where the first card parks while the pill is away. The tallest card's
       height is the one used for all five so every parking line is the same
       calculation; see --art-ar-max for why one height stands for the set.
       svh, because a phone's toolbars come and go and the line must not move
       with them. On a laptop this line sits under the pill, so the card
       actually parks at whichever of this and --deck-clear is lower. */
    --deck-top: calc((100svh - var(--card-w-px) * var(--art-ar-max)) / 2 - 2 * var(--deck-peek));
  }
  .hp-cases__list > .hp-case {
    position: sticky;
    top: calc(max(var(--deck-clear), var(--deck-top)) + var(--i) * var(--deck-peek));
    /* The same 0.45s and curve as the pill's return, so the card eases down
       as the pill eases in. */
    transition: top 0.45s cubic-bezier(0.32, 0.72, 0, 1);
    margin: 0;
    /* The pile leaves as one. A sticky box lets go when its own bottom
       meets the end of its container, so five cards of two heights on five
       parking lines would let go at five different moments — the stage
       first, being a full screen tall. Padding under each card brings its
       bottom to the same place as the stage's, the bottom of the screen, so
       the end of the list reaches all five in the same frame. The padding
       is empty and under the card; nothing is drawn in it. */
    /* Stays on the centred line, not the cleared one. The empty space is
       what makes the pile let go together, and it must not grow and shrink
       as the pill comes and goes or the page would change length under the
       scroll. */
    padding-bottom: max(0px, calc(100vh - var(--deck-top) - var(--i) * var(--deck-peek) - var(--card-w-px) * var(--art-ar)));
    /* Drawn back about the top edge, so a covered card's sliver stays on its
       parking line and its sides come in — the one way a scale reads as
       distance rather than as shrinking. */
    transform-origin: 50% 0;
  }
  /* A card's shade. Black over the whole link, under nothing, at zero; the
     deck brings it up as the card is covered. Opacity only, so it costs the
     same as the scale it rides with. */
  .hp-case__shade {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
  }
  /* The dwell on the last card. Sticky holds only while the container has
     room beneath, so without this the fifth card would park and leave in the
     same breath. */
  .hp-cases__hold {
    flex: none;
    width: 100%;
    height: clamp(120px, 30vh, 320px);
  }

  .hp-case {
    /* The card is the containment context for its own contents, so every value
       in the overlay is a share of the card rather than a pixel size that only
       happens to be right at the 1760px reference width. 1cqw is 1% of the
       card, so a spec value converts as value / 17.6. Container units are used
       on the card's DESCENDANTS only; on the query container itself they
       resolve against an ancestor container, which is why the radius above
       comes from --card-w-px instead. */
    container-type: inline-size;
    position: relative;
    width: var(--card-w);
    margin: 0 auto var(--card-gap);
    /* The deck scales the whole card, sentence included, so the type goes
       back with the picture as a card is covered. Scaling only the artwork
       left the words full size on a shrinking card.
       The radius and the clip have moved down onto the link. GSAP owns this
       element's transform for the deck, so the hover lift cannot live here
       — a CSS transition on the same property would be fighting a scroll-driven
       write every frame — and the link is the next box down, the same size. */
    transform-origin: center center;
    will-change: transform, opacity;
    transform: translateZ(0);
    backface-visibility: hidden;
  }
  .hp-case__scaler {
    position: relative;
  }
  .hp-case:last-child { margin-bottom: 0; }

  /* Her artwork, whole and unaltered, at its own aspect. width and height are
     on the tag too, so the box is reserved at the right shape before the file
     arrives and a lazily-loaded card further down cannot shift the page when it
     lands. */
  .hp-case__art {
    display: block;
    width: 100%;
    height: auto;
  }

  /* One link over the whole card, so the hit area is the artwork and not just
     the words on it. The accessible name comes from aria-label rather than from
     the contents, which would otherwise read out as one long run.

     The overlay geometry, once, as shares of the card. Every number is the
     Figma value at the 1760px reference divided by 17.6, which is also what her
     composite measures: its cards are 330px wide with the overlay starting
     24px in, and 24/330 is 7.27% against this 7.386%.

     The max() floors are what keep the card usable on a phone: a 346px-wide
     card would otherwise set the description at 12.6px.
     Above roughly a 520px card the proportions govern and the floors
     never engage.

     The chip row above the sentence was removed once and is back at the owner's
     request. Its sizing has been through three versions, and the one here is
     the simplest: it is the case pages' pill, to the pixel.

     The first version was clamp(8px, 7.23px + 0.292cqw, 10.5px), a floor
     wearing a proportion's clothes — the card is capped at 1120px, so the cqw
     term topped out at 3.3px and the floor decided the label at every width.
     The second, --sp-tag, was a curve that moved with the card so the pill
     stayed in one proportion to the sentence beside it, with a separate pair
     of padding ratios in the phone band to hold the contrast there. Both were
     about keeping the chips subordinate to the sentence, which was the right
     question while the chips were the card's own.

     They are not the card's own any more. The same three words sit on the case
     page the card opens, in a pill of fixed size — 14px label, 7px by 14px
     of padding, 8px between — and the view transition carries the row from one
     to the other.      The owner's read was that the case page's pill is the better
     one and that the two should be the same size, which settles the ceiling
     here by reference: 14px label, 7px by 14px of padding, an 8px gap. That
     box is what a desktop card hands the view transition.

     It cannot be the box at every width. The sentence shrinks with the card
     and the pill did not, so on a phone the label was the sentence's size
     and the longer row wrapped. The label follows the card up to that
     ceiling and no further — see .hp-case__tags — so a desktop card is still
     the case page's pill and a phone card is a smaller one of the same
     shape. */
  .hp-case__link {
    --sp-pad: max(22px, 7.386cqw);       /* 130px */
    /* The spec's 120/1760. It set the interval between the old text column and
       the old arrow column, and now that those are one row it has one job left:
       the gap the artwork is pulled up by, so the sentence and the mockup keep
       the spec's distance. The head sets its own column gap — see there. */
    --sp-gap: max(18px, 6.818cqw);       /* 120px, sentence -> mockup */
    /* Written from the properties the wrapper declares rather than as literals,
       so the floor is stated in one place. 0.03636 * 100cqw is 3.636cqw, the
       spec's 64/1760. */
    --sp-desc: max(var(--sp-desc-floor), calc(var(--sp-desc-ratio) * 100cqw));
    /* The outer bound on the sentence, for a card narrower than the shared
       cap in .hp-case__desc. At the card's type size 1em is 3.636cqw, so
       that 20em cap is 73cqw and this only binds below it. */
    --sp-textcol: 78cqw;

    display: block;
    position: relative;
    border-radius: var(--card-r);
    overflow: hidden;
    color: var(--card-ink);
    text-decoration: none;
    transition: transform 0.55s cubic-bezier(0.32,0.72,0,1);
  }
  /* The whole card is the link and until now only the arrow answered the
     pointer. The card lifts a little; nothing inside it moves, so the artwork
     keeps the framing it was composed with. Pointer devices only: on a touch
     screen a hover state sticks after the tap and the card would stay lifted
     on the page you just left. */
  @media (hover: hover) {
    .hp-case__link:hover { transform: translateY(-6px); }
    .hp-case__link:active { transform: translateY(-4px); transition-duration: 0.18s; }
  }
  /* Inset so the ring is not clipped away by the card's own overflow:hidden,
     and in the card's ink so it stays visible on the light card too. */
  .hp-case__link:focus-visible {
    outline: 3px solid var(--card-ink);
    outline-offset: -5px;
  }

  /* The head sits in the cleared band without taking part in the card's
     height — the card is exactly as tall as her artwork. Its inset is --sp-pad
     on three sides, which is the spec's 130/1760 and also what her composite
     measures: 24px in from the edge of a 330px card, or 7.27% against this
     7.386%. One column: the chip row, then the sentence. The arrow that used
     to share the first row is the pointer now, so the row no longer keeps a
     column open for it. */
  .hp-case__head {
    position: absolute;
    z-index: 2;
    top: var(--sp-pad);
    left: var(--sp-pad);
    right: var(--sp-pad);
    display: grid;
    grid-template-columns: 1fr;
    /* Pills to sentence. A share of the card, the interval this row had
       before it was opened up to match the case page. The floor keeps a
       phone from closing the gap to nothing. */
    row-gap: max(15px, 2.7cqw);
    align-items: center;
  }
  /* The wrapper stays in the markup but stops drawing a box of its own.
     display:contents hands the chip row and the sentence straight to the grid
     above, so each can be placed on its own row without a second nested layout
     in between. */
  .hp-case__head-text { display: contents; }
  /* Above the sentence. The case page puts its pills under the heading, and
     that is that page's order: the card keeps the row it had, and the view
     transition carries each one across rather than the card being rearranged
     to match. */
  .hp-case__tags { grid-column: 1; grid-row: 1; justify-self: start; }

  /* Real heading, kept out of the picture. The reference carries the project
     name only in the bold phrase of the sentence, but the document outline,
     search engines and heading navigation all still need an h2. */
  .hp-case__title {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* With no visible title this sentence IS the card's headline. The spec sets
     it at 400 rather than the 700 it carried before, so it reads considerably
     lighter — that is the spec's intent, not a regression.
     Inter, not Manrope: the spec asks for 'Helvetica Neue', which is not loaded
     here and is not dependable off macOS. Inter is the neo-grotesque already on
     the page and the closest thing to what the spec draws. Manrope at 400 and
     this size would not match it — its geometry is much rounder. */
  .hp-case__desc {
    grid-column: 1;
    grid-row: 2;
    margin: 0;
    /* Three quarters of the card, held here rather than on the wrapper now that
       the wrapper draws no box. The old 16.52em (the spec's 1057px against a
       64px size) is 60% of the card, and measuring her composite shows her own
       longest line running to 74.5%. That difference is not cosmetic: at 60%
       both British Cycling and Sofa to Saddle wrap to four lines where her
       artwork has three, and the fourth line is what pushed the text out of the
       area she cleared for it and onto her mockup.
       Swept against all five sentences at every width from 360px to 1728px, this
       measure holds every one of them to three lines. */
    /* Three lines, set by hand, so every card has the same shape: the
       first line the longest, the second a step shorter, the third the
       shortest. The first line is about three quarters of the card. A
       shared max-width cannot do this — the five sentences break at
       different words — so each one is three .hp-case__line spans and
       this only has to stay wider than the longest of them. */
    max-width: 86cqw;
    font-family: var(--ff-display);
    font-size: min(var(--sp-desc), 34px);
    line-height: 1.14;
    letter-spacing: -0.028em;
    font-weight: 500;
    color: var(--card-ink);
    text-wrap: wrap;
  }
  .hp-case__line { display: block; }
  /* The project name stays lifted out of the sentence. The case page's
     heading carries the same 600 on the same phrase, so the two snapshots
     the transition blends are one and the same. */
  .hp-case__desc strong { font-weight: 600; color: inherit; }
  /* The case page's .cs-hero__lockup. "x Lloyds’" stays on one line there, so
     it stays on one line here; and the hyphenated words — habit-forming,
     full-fibre, real-time — are held whole, because the case page's heading
     is split into one box per word for its entrance and cannot break at a
     hyphen, so a card that could would wrap differently from the heading it
     becomes. */
  .hp-case__lockup { white-space: nowrap; }

  /* Outlined chips. The ceiling is the case pages' chip: a 14px label,
     7px by 14px of padding and an 8px gap, so a desktop card hands the view
     transition a pill of the same box. Below the card where that label would
     be the sentence's size, the label follows the card instead — the same
     phone curve as before, capped at 14px rather than left to outgrow the
     sentence. Padding and gap are em of the label, and at 14px they are
     exactly 7px, 14px and 8px, so the ceiling is not a second set of numbers.

     The stroke and the label are the card's ink, where the case page's are
     white on black. */
  .hp-case__tags {
    display: flex;
    flex-wrap: wrap;
    /* 0.57em of a 14px label is the 8px the case page uses. */
    gap: 0.57em;
    margin: 0;
    padding: 0;
    list-style: none;
    /* 8.2px on the narrowest card, 9px at 390, 14px from about a 710px card up. */
    font-size: clamp(8.2px, calc(4.21px + 1.376cqw), 14px);
  }
  .hp-case__tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    /* 0.5em / 1em is 7px / 14px when the label is at its ceiling. */
    padding: 0.5em 1em;
    /* The ink at full strength first, then the softened version. If a browser
       does not understand rgb()'s slash alpha or has no --card-ink-rgb to read,
       the chip keeps a visible outline rather than losing its shape entirely.
       The alpha is higher than the case page's 0.22 because the stroke is
       half a pixel of card ink on a coloured ground rather than of white on
       black, and at 0.22 it disappeared on the lighter cards. */
    border: 0.5px solid var(--card-ink);
    border-color: rgb(var(--card-ink-rgb) / 0.55);
    border-radius: 999px;
    background: transparent;
    color: var(--card-ink);
    font-family: var(--ff-body);
    font-size: 1em;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.01em;
    text-align: center;
    white-space: nowrap;
  }

  /* ---------- THE BUILD: card 01, from lines to UI ----------
     After "Selected work", the Boots card does not arrive — it is built.
     Hairlines across the screen, the layout's own grid, the checkout's panels
     as wireframe, a few lines of its markup, then the screenshot resolves
     through the wire and the navy card closes round it. The last frame IS
     card 01: the real article, its real image from its own srcset, its chips
     and sentence, which then scrolls on into the carousel as any card does.
     Same mechanism as the wordmark: a tall section, a sticky stage inside
     it, GSAP mapping scroll onto a timeline and writing transform, opacity,
     dash and clip and nothing that lays out.

     One coordinate system. Every wire rect lives in an SVG whose viewBox is
     the artwork's own pixel grid, laid over the card's own image at the same
     box, so the wire of a panel is the panel to the pixel and there is no
     alignment to keep. Only the opening hairlines sit outside that box; they
     run the width of the screen and are measured off the card's rect by the
     script on every refresh.

     The default state of everything here is the finished card. The wires,
     the guides and the code are hidden until the script has
     built the timeline and adds is-live, so a page with no GSAP, or a
     timeline that throws, shows card 01 and never a half-built one. */
  /* The stage is the deck's first card: a full screen, sticky at the top of
     the list like the cards after it are sticky at their lines, with card 01
     drawn on the first card's parking line inside it. It stays parked for
     the whole of the deck, so the finished Boots card is the one at the back
     of the pile, and leaves with the rest. The scroll the build plays over
     is a spacer after it — see .hp-build__travel — rather than a height on
     this box or a margin on it, because a sticky box is held inside its
     container by its margin box, and a margin here would let the stage go
     that far before the end. */
  .hp-build {
    position: sticky;
    top: 0;
    width: 100%;
    /* svh, not vh. On a phone the large viewport is taller than the screen
       while the browser chrome is up, and a stage of that height loses its
       bottom behind the chrome. The deck already parks on svh. */
    height: 100svh;
    background: #0a0a0c;
  }
  .hp-build__travel {
    /* 360vh, up from 320vh, once the scrub was smoothed. The timeline runs up
       to two seconds behind the scroll, so the finished card needs a
       hold at the end long enough that someone who has scrolled straight
       through still has the stage in front of them while it closes. The
       extra 40vh stretches the whole sequence by an eighth, which is also the
       pace the owner asked for. */
    --build-travel: 360vh;
    flex: none;
    width: 100%;
    height: var(--build-travel);
  }
  .hp-build__stage {
    height: 100%;
    display: grid;
    justify-items: center;
    align-items: start;
    /* The card sits on the deck's first parking line, not at the centre, so
       card 02 covers it exactly as 03 will cover 02. */
    padding-top: max(var(--deck-clear), var(--deck-top));
    transition: padding-top 0.45s cubic-bezier(0.32, 0.72, 0, 1);
    /* The card is the only child the stage lays out; the guides and the
       wire are absolute over it. Paint containment keeps
       the per-frame SVG repaints inside this box. */
    contain: paint;
  }
  .hp-build .hp-case {
    width: var(--card-w-px);
    margin: 0;
    transform-origin: 50% 0;
  }
  /* The image is what the whole sequence resolves into. Only opacity is
     ever animated on it; a clip to its window is set once and dropped once. */
  .hp-build .hp-case__art { will-change: opacity; }
  /* The card's navy, as a layer the size of the card behind the image. The
     window resolves first with the image clipped to it; then this fades up
     across the whole frame, one even fade, so the card closes round the
     window rather than rising out of it. Once it is in, the image's clip is
     dropped in one frame — the image carries the same navy — and the
     finished card is the image alone, as on every other card. */
  .hp-build__navy {
    position: absolute;
    inset: 0;
    background: var(--card-bg);
    border-radius: var(--card-r);
    opacity: 0;
    pointer-events: none;
  }
  /* On a phone every card's link is painted its own colour, so the sentence
     and the cropped picture read as one card. That paint is the navy, and
     on this card it would be there from the first line of the drawing.
     The layer above is the navy, and it fades in when the card closes
     round the window — the same moment as on a desktop, where the link
     was never painted. Until then the drawing sits on the stage. */
  #hp-build .hp-case__link { background: transparent; }
  /* On a phone this card uses the same head and the same crop as the other
     four. Holding the sentence in the artwork's own band left the last line
     on the checkout — about 8px of air, where the wholesale card has the
     spec's gap. The fade is unchanged; only the place it lands is. */
  .hp-build__guides,
  .hp-build__wire {
    position: absolute;
    pointer-events: none;
    overflow: visible;
    visibility: hidden;
  }
  .hp-build__guides { inset: 0; width: 100%; height: 100%; }
  .hp-build__wire { inset: 0; width: 100%; height: 100%; }
  .hp-build.is-live .hp-build__guides,
  .hp-build.is-live .hp-build__wire { visibility: visible; }
  /* Hairlines are one device pixel whatever the viewBox scale, and snapped
     rather than anti-aliased. Circles and the chevron keep their curves. */
  .hp-build__wire *,
  .hp-build__guides * { vector-effect: non-scaling-stroke; }
  .hb-wire, .hb-ol, .hb-sec, .hb-dim, .hb-guide, .hb-accent {
    fill: none;
    stroke: rgba(252,249,245,0.55);
    stroke-width: 1;
    stroke-linecap: butt;
    shape-rendering: crispEdges;
  }
  .hb-guide { stroke: rgba(252,249,245,0.28); }
  .hb-ol { stroke: rgba(252,249,245,0.35); }
  /* The section boxes inside a panel. Solid, a step quieter than the panel
     they subdivide; they were dashed, which read as clutter rather than
     hierarchy — on a 1px hairline the dashes are the only texture on the
     screen and the eye goes to them. */
  .hb-sec { stroke: rgba(252,249,245,0.2); }
  .hb-dim { stroke: rgba(252,249,245,0.45); }
  .hb-accent { stroke: rgba(252,249,245,0.9); stroke-width: 2; }
  .hb-bar { fill: rgba(252,249,245,0.14); shape-rendering: crispEdges; }
  .hb-col { fill: rgba(252,249,245,0.06); shape-rendering: crispEdges; }
  .hb-ground, .hb-fill { fill: rgba(252,249,245,0.04); shape-rendering: crispEdges; }
  .hb-round { shape-rendering: geometricPrecision; }
  .hb-radio { fill: rgba(252,249,245,0.9); }
  .hb-label {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    fill: rgba(252,249,245,0.55);
    font-size: 11px;
    letter-spacing: 0.02em;
  }
  /* In the wire's viewBox the type scales with the card: 46 units is 10.5px
     on the 691px card a 1440x820 window lays out. */
  .hp-build__wire .hb-label { font-size: 46px; }

  /* One component, sat on the component. The left is the gift card
     button, the right is the first product tile, and each box is only as
     tall as that markup. It then dissolves into the screenshot, so the
     thing being typed is that control, not the whole panel. A box the
     height of the panel, typed with one short snippet, read as the panel
     having stopped early. Mono, small, cream at 70 with the tags held
     back to 45 so what reads first is the words. The box and every line
     are opacity only; the width and the type are fixed so no line ever
     wraps mid-build. */
  .hp-build__code {
    position: absolute;
    /* Shares of the picture. The script rewrites these when the picture is
       cropped — on a phone the file's top band is not in the box, so a
       percentage of the file is not that percentage of the box. */
    top: var(--code-y, 79.6%);
    left: var(--code-x, 17.51%);
    width: var(--code-w, 38.19%);
    padding: 1.2cqw 1.2cqw;
    overflow: hidden;
    border-radius: 0.7cqw;
    /* The fill stays the black it was. The edge is one grey all the way
       round, and the shadow is what lifts the card off the wire. */
    border: 1px solid rgba(255, 255, 255, 0.28);
    background: #0c0c0f;
    box-shadow: 0 22px 40px -16px rgba(0, 0, 0, 0.9), 0 4px 12px -6px rgba(0, 0, 0, 0.65);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* 12px from a 774px card up. The product tile is the narrow one, so
       the size is what fits an 18-character line in it; the button's lines
       are longer and the payment panel is wider, so they fit with room. The
       5px floor is the phone, where a higher one overflows that tile. */
    font-size: clamp(5px, 1.55cqw, 12px);
    line-height: 1.55;
    letter-spacing: -0.015em;
    color: rgba(252,249,245,0.7);
    white-space: pre;
    pointer-events: none;
    opacity: 0;
  }
  .hp-build__code--sum { --code-x: 60.46%; --code-y: 56.43%; --code-w: 25.03%; }
  .hp-build__code-line { display: block; opacity: 0; }
  .hp-build__code .t { color: rgba(252,249,245,0.45); }

  /* ---------- SOUND ----------
     The one control for sound, parked at the bottom right while the work is
     on screen — the build is the only thing on the site that makes a noise,
     and the cards after it are where you would still be hearing the last of
     it. Off until pressed, because browsers will not start audio before a
     gesture and a control that claimed otherwise would be lying; pressed, it
     says so, and it stays, so it can be pressed again. The label is the state
     — "Sound on" or "Sound off" — rather than the action, with the icon
     agreeing: the same two arcs either way, a line through them when off,
     and the whole thing dimmer when off so the two states are told apart
     at a glance and not by reading.
     It wears the nav's treatment, same fill, hairline and blur, so the two
     pieces of floating furniture read as one family from opposite corners.
     Nothing is stored between visits; a return visit needs the press anyway. */
  .hp-sound {
    position: fixed;
    right: var(--pad-x);
    bottom: clamp(18px, 3.5vh, 34px);
    z-index: 90;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 9px 14px 10px;
    border-radius: 999px;
    background: rgba(18,18,22,0.55);
    border: 1px solid rgba(255,255,255,0.09);
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
    color: var(--ink-3);
    font-family: var(--ff-display);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    line-height: 1;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), color 0.25s ease, border-color 0.25s ease;
  }
  .hp-sound.is-on { opacity: 1; pointer-events: auto; }
  .hp-sound:hover { border-color: rgba(255,255,255,0.22); }
  .hp-sound:focus-visible { outline: 2px solid rgba(255,255,255,0.7); outline-offset: 2px; }
  .hp-sound[aria-pressed="true"] { color: var(--ink); }
  .hp-sound svg { width: 12px; height: 12px; display: block; color: currentColor; }
  /* The arcs stay. The line is the off state, so aria-pressed hides it
     when the sound is on. The label swaps with the same value. */
  .hp-sound[aria-pressed="true"] .hp-sound__off { display: none; }
  .hp-sound[aria-pressed="true"] .hp-sound__label-off,
  .hp-sound[aria-pressed="false"] .hp-sound__label-on { display: none; }
  /* On a short screen the stage's card leaves little beneath it — under 70px
     at the smallest size — and the coordinate at its bottom right corner sits
     in the first 21 of those. The control tucks lower and a little tighter so
     the two never touch; above this height the band is wide enough that the
     clamp does the job alone. */
  @media (max-height: 720px) {
    .hp-sound { bottom: 12px; padding: 8px 13px 9px; }
  }

  /* ---------- FOOTER ---------- */
  .hp-footer {
    /* The footer's own gutter, so the two rules can align to the content
       column without restating the value. It is --pad-x everywhere except the
       phone band, which sets its own tighter gutter. */
    --foot-x: var(--pad-x);
    min-height: 86vh;
    padding: clamp(80px, 12vh, 160px) var(--foot-x) clamp(32px, 4vh, 52px);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--bg);
    max-width: var(--shell);
    margin: 0 auto;
  }
  /* The rule that opens the footer. It was the element's own border-top, which
     put it edge to edge across the viewport and made it a division of the
     window rather than of the page. It is the content column instead: one
     gutter in on each side, so it begins and ends where the eyebrow, the
     headline, the buttons and the copyright row do.
     It was tried three gutters short on the right, and it was wrong — a line
     that stops inside the row it heads reads as having fallen short of it,
     not as having been placed. The column is the page's own measure and it is
     not the window's: at the top of the range the footer is capped at --shell
     and centred, so the rule is 70% of a 1920 screen with 290px of page either
     side of it, and below that cap it is the gutter that holds it off the
     edge.
     Absolutely positioned rather than a flex child: the footer is a centred
     flex column, so a real element would take part in the distribution and
     move everything under it. */
  .hp-footer::before {
    content: '';
    position: absolute;
    top: 0;
    left: var(--foot-x);
    right: var(--foot-x);
    height: 1px;
    background: var(--rule);
  }
  /* This eyebrow used to have its dash suppressed, on the grounds that the
     full-width hairline 90px above had already opened the footer and the dash
     restated it smaller. Asked for by the owner and reinstated: the dash is not
     doing the hairline's job of dividing the page, it is marking where a label
     starts, and it puts the eyebrow's first ink on the same left edge as the
     hairline, the headline and the copyright row rather than starting the label
     40px inside them. It is the default from .hp-eyebrow--rule now, so there is
     no exception here and the footer matches the case study's other eyebrows. */
  .hp-footer__title {
    margin: clamp(22px, 3vh, 40px) 0 0;
    font-family: var(--ff-display);
    font-size: clamp(52px, 8.4vw, 148px);
    line-height: 0.92;
    letter-spacing: -0.048em;
    font-weight: 800;
    color: var(--ink);
    max-width: 12ch;
  }
  /* The lede is the only thing between the headline and the buttons, so it
     carries the interval on both sides itself. It used to sit in the left
     column of a two-column band with a Based / Open to list beside it; the
     list was removed as duplication — the sentence already says both — and a
     grid with one item in it is not structure, so the wrapper went with it. */
  .hp-footer__lede {
    margin: clamp(40px, 6vh, 80px) 0 clamp(36px, 5vh, 60px);
    /* 50ch, up from 40ch, on the owner's instruction: at 40ch these 163
       characters set in four lines from 901px up and she wants three. The
       measure is the only thing widened — the size curve is untouched, because
       shrinking the type to make the count is the one way of hitting it that
       makes the paragraph worse.
       50ch is where three lines starts, and it is not overshot on purpose: it
       sets ~63/65/35 characters, and the top of a comfortable measure for body
       copy is around 75. Anything wider buys nothing — the line count cannot go
       below three at this length — and costs the reader the return sweep. The
       measure is in ch, so it tracks the font-size curve and the count holds at
       every desktop width rather than at the one it was tuned on. */
    max-width: 50ch;
    font-size: clamp(17px, 1.35vw, 22px);
    line-height: 1.5;
    letter-spacing: -0.011em;
    color: var(--ink-1);
  }
