  .hp-footer__lede strong { color: var(--ink); font-weight: 500; }
  .hp-footer__ctas {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .hp-footer__cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    padding: 18px 24px;
    background: #fcf9f5;
    color: #0a0a0c;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.005em;
    text-decoration: none;
    transition: transform 0.4s cubic-bezier(0.32,0.72,0,1);
  }
  .hp-footer__cta.is-ghost {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .hp-footer__cta:hover { transform: translateY(-3px); }
  .hp-footer__cta-arrow { display: inline-flex; align-items: center; }
  .hp-footer__cta-arrow svg { width: 16px; height: 16px; display: block; }

  /* The bar closing the footer, with its hairline back above it at the owner's
     request. The interval is the one it had before the rule was briefly
     removed: 56-110px of margin above the line and 20-28px between the line
     and the copyright, roughly 4:1. While there was no rule the margin was
     raised to 88-160px to stand in for it; leaving it there now would have the
     line floating in the middle of a void of its own instead of closing the
     button group and opening the fine print. */
  .hp-footer__base {
    /* One value, used twice: it is the gap under the rule, and the distance
       the rule has to travel back up to sit on the bar's top edge. */
    --base-gap: clamp(20px, 2.4vw, 28px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    /* The bar is widened to the footer's full width and given the gutter back
       as padding, so its content sits in the same column it always did. The
       reason is the rule below: its insets are measured from whatever box it
       is positioned in, and both rules have to be measured from the same one
       or they cannot come out the same length. From a bar the width of the
       column, a gutter of inset would put the line a gutter inside the column
       rather than on it.
       It also makes that immune to the reveal: GSAP puts a transform on this
       bar, which silently turns it into the containing block for the line, so
       the line would otherwise be one length before the footer animates in and
       another afterwards. */
    margin-left: calc(-1 * var(--foot-x));
    margin-right: calc(-1 * var(--foot-x));
    margin-top: clamp(56px, 9vh, 110px);
    padding: var(--base-gap) var(--foot-x) 0;
    font-size: 13px;
    letter-spacing: -0.003em;
    color: var(--ink-3);
  }
  /* The same geometry as the rule at the top of the footer, in the same terms:
     the content column, a gutter in on each side. The two are the only
     horizontal lines here and they sit 480-740px apart, so they have to be
     coextensive or one of them reads as a mistake.
     Spanning the column is what makes this one a bracket rather than a lid:
     Back to top starts exactly under its left end and the copyright finishes
     exactly under its right, so the line closes over the row instead of
     stopping somewhere inside it.
     Vertically it has no `top` of its own — that would be measured from the
     top of the footer, hundreds of pixels away and dependent on how the copy
     above it wrapped. It takes its static position instead, which for an
     absolutely positioned child of a flex container is where it would sit as
     the only flex item: align-self pins that to the start rather than the
     centre the bar aligns its real items on, landing the line on the top of
     the bar's content, and the translate lifts it back over the padding onto
     the bar's edge. A transform, not a negative margin: margins are dropped on
     an absolutely positioned box that is taking its static position. */
  .hp-footer__base::before {
    content: '';
    position: absolute;
    align-self: flex-start;
    transform: translateY(calc(-1 * var(--base-gap)));
    left: var(--foot-x);
    right: var(--foot-x);
    height: 1px;
    background: var(--rule);
  }
  .hp-footer__top {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 0;
    background: none;
    border: 0;
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    transition: color 0.25s ease;
  }
  .hp-footer__top:hover { color: var(--ink); }
  .hp-footer__top svg { width: 14px; height: 14px; display: block; }

  /* ---------- Responsive ----------
     Four width bands plus a small-phone trim:

       >  1100      desktop — the composition every other band steps down from
       901 – 1100   narrow desktop / landscape tablet: the split case stacks
       601 –  900   tablet portrait: desktop structure at tablet scale
       401 –  600   phone
       <=   400     small phone (nav only)

     601–900 previously inherited the phone rules, so a 768px iPad was styled
     as a 390px phone: phone gutters, phone type, a single-column approach grid
     and two of the four device shots. It is now its own band.

     Anything that can be one continuous curve — the hero statement, the
     wordmark, the device row — is handled with clamp()/min() in the base rules
     rather than restated per band, so there are no size jumps at the seams. */
  /* Shared by tablet and phone. */
  @media (max-width: 900px) {
    /* Fills ~94% of the width instead of ~104%, which is what clipped the
       mark at every width below 900px. */
    .hp-wordmark__row { font-size: min(14.5vw, 28vh, 150px); }
  }

  /* ---------- Tablet portrait ---------- */
  @media (min-width: 601px) and (max-width: 900px) {
    /* Left matching vertical again, for the even surround described in the base
       rule. The avatar is 44px here and so is the link's floor, so the row is the
       avatar's own height and no centring offset is involved. */
    .hp-nav { top: 20px; gap: 16px; padding: 14px 10px 14px 14px; }
    /* 16 gap + 14 link padding. */
    .hp-nav__brand { padding-right: 30px; gap: 12px; }
    .hp-nav__avatar { width: 44px; height: 44px; }
    .hp-nav__name { font-size: 16px; }
    .hp-nav__link { padding: 12px 14px; font-size: 14px; gap: 6px; }
    .hp-nav__arrow svg { width: 14px; height: 14px; }

    .hp-hero { padding: clamp(112px, 14vh, 164px) var(--pad-x) clamp(32px, 4.5vh, 52px); }
    .hp-hero__statement { max-width: none; }

    /* The nav pill is shallower here, so the cards can start higher. */
    .hp-cases { padding-top: clamp(64px, 10vh, 104px); }
    /* No card type overrides in this band: the overlay scales itself from the
       card's own width, so a tablet gets the same proportions as a desktop
       rather than a separately tuned size that has to be kept in step. */

    .hp-footer { min-height: 0; }
    .hp-footer__title { font-size: clamp(60px, 10vw, 92px); }
    /* The 56ch override is gone: the base measure is now 50ch, which is wider
       than the 40ch this band existed to escape and narrower than the 56ch it
       used. At 56ch this band was already setting three lines, but as 66/78/17
       — a 78-character line and a three-word widow. The same copy at 50ch sets
       63/65/35 here, so the band inherits both a better rag and one fewer rule
       to keep in step with the desktop. */
  }

  /* ---------- Phone ---------- */
  @media (max-width: 600px) {
    .hp-nav {
      top: 14px;
      gap: 10px;
      /* Left is vertical + 4, not vertical, because from here down the row is the
         link's 44px tap-target floor rather than the 36px avatar: the avatar is
         centred in it and gains 4px above and below on its own. 6 and 10 give an
         even 11px surround. Left tracks any change to the vertical padding at this
         breakpoint by that offset, not one for one. */
      padding: 6px 6px 6px 10px;
      /* A guard, not a width: the pill still hugs, and this only stops a long
         name taking it to the screen edges. It is close to binding on the
         narrowest phones, which is what sets the width the arrows drop out at —
         see the rule at the bottom of the stylesheet.

         Percentage rather than 100vw: vw counts a classic scrollbar and this
         element's containing block does not, so a narrow window on Windows or
         Linux would allow the pill 15px more than the screen really has. */
      max-width: calc(100% - 24px);
    }
    /* 10 gap + 12 link padding. */
    .hp-nav__brand { padding-right: 22px; gap: 10px; }
    .hp-nav__avatar { width: 36px; height: 36px; }
    .hp-nav__name { font-size: 14px; }
    .hp-nav__links { gap: 2px; }
    /* Labels stay. Hiding them left two identical arrow glyphs with no way to
       tell CV from LinkedIn — the arrow is the decoration, not the label. */
    .hp-nav__link {
      min-width: 44px;
      padding: 11px 12px;
      font-size: 13px;
      /* The arrows are shown at this width now, so the label needs clearing
         from the glyph again. It was 0 only because there was nothing there. */
      gap: 4px;
    }

    /* Tighter spacer floors than the desktop rhythm: on a phone the hero is
       close to content-height already, and a generous minimum open field is
       what pushes the cue off the bottom of a small screen. */
    .hp-hero {
      /* The greeting's phone size, moved onto the property both it and the cue
         read. It was on .hp-hero__greeting, where it sized only the greeting and
         left the cue on its own 12px floor.

         Capped against the viewport as well, because the greeting has to hold
         one line on a phone and at a flat 15px it did not. It needs 353px and
         a 390px phone gives it 346, so it wrapped at every width from 320px to
         390px — every phone in common use — and only came together at 402px.
         Two lines is the wrong shape for it: it is one sentence naming who she
         is, and split with `in the UK.` alone underneath it reads as a stray
         fragment below the statement rather than as a line of its own.

         3.3vw keeps the greeting a step under the statement, which is 15px on
         a 390 phone. 13px governs from about 394px up, and below that the type
         comes down only as far as the line needs — 12.9px on a 390px phone,
         10.6px at 320px — keeping slack at the narrowest width so a font fallback with wider
         metrics cannot tip it back onto two lines. The cue comes down with it,
         which is the whole point of the shared property: they remain one size,
         as the owner asked. */
      --hero-body: min(13px, 3.3vw);
      /* A step under the greeting at every phone width, including 320 where
         the greeting itself is already down at 11px. */
      --hero-aside: min(12px, 3vw);
      padding: 94px 20px 30px;
      /* The same 1 : 1.15 as the desktop. 1.4 was the lift for the longer
         paragraph, and with this one it left 226px under the pill and 285px
         above the marks at 390x844, the words 30px above the centre of that
         field. 1.15 brings it to 249 and 261, 6px above centre. The marks
         still clear the fold. */
      grid-template-rows: 1fr auto minmax(56px, 1.15fr) auto;
    }
    .hp-hero__main { gap: 12px; }
    .hp-hero__aside { margin-top: 6px; }
    /* Four lines on a phone: two for each sentence. The longer half of the
       first sentence, 'picture and take ideas from pencil to production.',
       is 339px at 15px, which fits the 350px column on a 390 phone. Above
       that the size climbs with the width, so a wider phone does not get
       smaller type than it needs. */
    .hp-hero__statement {
      max-width: none;
      font-size: clamp(13.5px, 3.85vw, 18px);
      line-height: 1.4;
      letter-spacing: 0;
    }
    /* The marks come down a little, so six of them still read as one line
       rather than as the heaviest thing on a phone. */
    .hp-hero__logo { height: calc(var(--h) * 0.82); width: calc(var(--h) * 0.82 * var(--r)); }

    .hp-cases,
    .hp-build {
      /* The height cap comes off here, and here rather than at 900px, because
         this is where the crop starts. Below 601px the artwork loses its cleared
         band to object-fit and the head moves into the flow, so the card's height
         is no longer the artwork's ratio times its width and a cap written from
         that ratio would shrink it for nothing. Between 601 and 900 the card is
         still the desktop composition at full aspect, so the cap belongs there
         and does the same job it does above 900.

         Set large rather than removed, so --card-w reads identically in every
         band and this is the only value that differs. */
      --card-cap-h: 9999px;
      /* The floor decides the line count on a phone, not the ratio. At 17.5px
         the sentence ran to four lines at 390 and five at 320: the type stopped
         shrinking while the column kept narrowing, and three lines is the
         composition at every other width. 11px is the largest floor that still
         holds three at 320, the narrowest this lays out for. Above about 360
         the ratio is already the larger of the two and this stops applying, so
         the curve runs continuously into the band above rather than stepping at
         the breakpoint. */
      /* Shared with the build. Its sentence is this same one, and the
         19px floor is the desktop card's. Left on a phone-width card it
         sets the type at 19px, which is neither the other cards nor the
         band the artwork cleared. */
      --sp-desc-floor: 11px;
      /* A phone card is nearly the full width of the screen, so the same 0.9
         that reads clearly on a desktop is barely a change here — there is no
         surrounding space for the difference to show against. A wider range
         gives the carousel something to say at this size. */
      --card-scale-min: 0.82;
      --card-dim-min: 0.55;
    }
    .hp-cases {
      padding-top: clamp(56px, 9vh, 92px);
      padding-bottom: 64px;
    }
    /* ---- The text comes out of her cleared band on a phone ----
       Her artwork clears the top 35% of the card for the overlay, which is a
       fixed share, so on a 264px-wide card that band is 82px tall. The overlay
       at its proportional size would fit in 69px of it — but at that size the
       description is 9.6px and the chip labels are 3px, which is not type, it
       is texture. The legibility floors exist for exactly that reason, and with
       them the block is 172px: twice the band.

       There is no width that resolves that, so the text stops sharing the
       card's top with the artwork and sits above it instead. The card takes the
       colour she cleared, the head goes back into the flow, and her image
       follows underneath at its own aspect, untouched. Because the top of every
       one of her images is that same flat colour, the join is invisible: what
       the phone shows is her card with a taller clear band, not a different
       composition.

       The artwork is then pulled up by its own cleared band, less one --sp-gap
       to leave the spec's interval between the sentence and the mockup. Two
       reasons, and the second is the one that matters:

         Without it that band becomes dead space. It is 31-37% of the card's
         width of empty colour sitting between the text and the mockup, on top
         of the text's own padding — measured 155px of nothing on a 334px card.

         Her corners are rounded against black rather than against
         transparency, so once the image is not at the top of the card its top
         two corners would show as black notches partway down it. The crop is
         many times the 3% corner radius, so they go with the band.

       Nothing of hers is lost either way: every pixel removed is the flat
       colour the card is already painted in. --art-crop is per card, measured
       from each file, because the three bands are not the same depth. */
    /* On the link, which is the box that carries the radius and the clip. */
    .hp-case__link { background: var(--card-bg); }
    .hp-case__head {
      position: static;
      padding: var(--sp-pad) var(--sp-pad) 0;
    }
    /* The build's sentence rises the last 24px, which crosses onto the
       picture. The picture is a later sibling with its own layer, so a
       static head would finish that rise underneath it. relative keeps this
       head in the same place in the flow and paints the words above the
       picture; the shade stays above both, so a covered card still dims the
       sentence. top, left and right belong to the absolute head — left set,
       they would shift this one by a second padding. */
    #hp-build .hp-case__head {
      position: relative;
      z-index: 2;
      top: auto;
      right: auto;
      left: auto;
    }
    #hp-build .hp-case__shade { z-index: 3; }
    /* object-fit rather than a negative margin. A negative margin does not crop
       an image, it moves the whole thing up — including the part that is
       supposed to be gone — and since that part is opaque flat colour it lands
       on top of the sentence and paints it out. Giving the box the height the
       cropped image should have and letting cover trim it from the top is the
       only one of the two that actually removes anything. */
    .hp-case__art {
      height: calc((var(--art-ar) - var(--art-crop)) * 100cqw + var(--sp-gap));
      object-fit: cover;
      object-position: center bottom;
    }
    /* The pill scales with the card from the base rule, up to the case
       page's 14px, so this band no longer needs a label of its own. The
       sentence ratio is all that is left of that block. */
    .hp-case__link {
      /* The last 3% the three-line ceiling allows. Steps 0.6px against the
         band above at the 600px edge. */
      --sp-desc-ratio: 0.0375;
    }

    /* The one width where the three-quarter measure and the three-line ceiling
       cannot both be had. On a 320px phone the sentence has 186px to run in and
       the longest three of the five need a fourth line to fit; given the whole
       column they need three. The ceiling wins, because a fourth line is the
       thing that overruns the band she cleared in the artwork, and at this width
       a right-hand margin on a 220px column was never reading as a measure
       anyway. Everything from 360px up keeps the proportion. */
    @media (max-width: 359px) {
      .hp-case__desc { grid-column: 1 / -1; max-width: 100%; }
    }

    /* The phone gutter is 22px, not the 28px --pad-x floors at, so the top
       rule has to be told about it or it would start 6px inside the column it
       is meant to align with. Same padding as before, named once. */
    .hp-footer { --foot-x: 22px; min-height: 0; padding: 76px var(--foot-x) 28px; }
    .hp-footer__title { font-size: clamp(46px, 13vw, 76px); }
    /* Left at 52ch against a 16.5px body: on a phone the viewport is the
       measure long before any ch value is, so this only binds from about 585px
       up. Three lines is not physically available below that at a legible
       size, and the instruction is explicitly not to shrink the type to buy
       it, so the copy wraps to whatever the width allows. */
    .hp-footer__lede { margin: 32px 0 30px; max-width: 52ch; font-size: 16.5px; }
    .hp-footer__cta { padding: 15px 20px; font-size: 14px; }
    /* The rule is back here too, so the margin goes back to what it was when
       it last had one to sit above. --base-gap is inherited from the base
       rule, which floors at 20px — right for a 12px bar. */
    .hp-footer__base { margin-top: 46px; font-size: 12px; }
  }
  /* ---------- Short portrait phones: no scroll cue ----------
     Measured, not assumed. The hero's copy block is a fixed content height at
     a given width, and the cue sits under it, so whether the cue clears the
     fold is a question about height. Sweeping the height at each phone width
     puts the cue's bottom edge at:

       320 wide   714px      390 wide   643px      430 wide   630px

     Below those heights the cue was rendering below the fold — present,
     focusable, and invisible, which is worse than absent. 670px is under all
     three of the heights that have room (390x844, 430x932, 393x852 and every
     other current phone keep their cue) and over the heights that do not, and
     it catches the 320x568 case that prompted this. The owner's decision is
     to keep the whole copy at that size and lose the cue rather than shrink
     the type to fit both.

     The width bound is not a second opinion about which screens are small; it
     is there because landscape phones at 601px and up already have their own
     rule below, which moves the cue out of the flow into the empty space
     beside the paragraph rather than removing it.

     display:none, not opacity or visibility: the cue is a button and a link to
     the wordmark, so hiding it has to take it out of the accessibility tree
     and out of the tab order too. It also takes the hairline with it, which is
     the right outcome — the rule exists to give the composition a second
     horizontal edge to close on, and with nothing under it to close on it is
     a line ruled across the bottom of the copy for no reason. What is left is
     the copy block in the grid it already sits in, upper-middle with the open
     field below it, which is what the hero reads as above the fold anyway. */
  @media (max-width: 600px) and (max-height: 670px) {
    .hp-hero__lower { display: none; }
  }

  /* Landscape phones. Height is the scarce dimension and width is the
     plentiful one, so the statement comes off the desktop curve and spends the
     extra width instead of the extra height.
     Even then there is no room to stack a closing band under the copy — the
     copy block is most of a 390px-tall viewport on its own, and the cue would
     land below the fold, which is the one thing it must never do. So there is
     no void here to anchor and nothing for a rule to close: the copy IS the
     composition, and the cue becomes a corner marker in the space to the right
     of the statement that the short measure leaves empty anyway. */
  @media (max-height: 560px) and (min-width: 601px) {
    /* The pill comes down with everything else, because at these heights it is
       spending the scarce dimension. Its own height plus its offset was taking 118
       of the 92px the hero waits before starting — the greeting was running under
       it, by 14px before the padding was evened up and 26px after. Nothing caught
       that: the height sweep starts at 561px, one pixel above this band.

       Both numbers come down. 12px of offset rather than 28, and 8px of padding
       rather than 18, which puts the pill's underside at 82px and leaves the
       greeting the 10px of daylight it had before. Left padding matches the
       vertical, as everywhere: the surround stays even, at 9px instead of 19. */
    .hp-nav {
      top: 12px;
      padding: 8px 10px 8px 8px;
    }
    /* The pill ends at 74px here, not 106, so the desktop clearance of 124
       pushed the card off the bottom of a landscape phone. 86 clears this
       shorter pill and still leaves the card on the screen. */
    .hp-root { --deck-clear: 86px; }
    .hp-hero {
      min-height: 0;
      padding-top: 92px;
      padding-bottom: 24px;
      grid-template-rows: 0fr auto minmax(20px, 1fr) auto;
    }
    .hp-hero__main { gap: 10px; }
    .hp-hero__aside { margin-top: 0; }
    .hp-hero__statement { max-width: none; }
    /* Tighter than the laptop. Two gaps at half a line are most of the spare
       height here, and the aside would land on the fold. */
    .hp-hero__sentence + .hp-hero__sentence {
      margin-top: 0.28em;
      margin-top: 0.28lh;
    }
    /* No height for a line under the copy. The marquee would land below the
       fold, which is the thing this breakpoint exists to prevent, so the
       band goes rather than becoming a corner marker. */
    .hp-hero__lower { display: none; }
  }

  /* The band between the landscape treatment above and the full-height layout.
     That breakpoint stops at 560px and the height term in the statement curve
     does not shrink the copy enough to make up the difference, so from 561px to
     about 655px the cue was landing under the fold — 27px under at 1440x600,
     47px at 1440x561. A part-height browser window on a laptop and a 1024x600
     netbook both sit in here, so it is not an exotic size.

     Nothing here touches type size. At these heights every vertical clamp in the
     hero is already sitting on its floor, and the largest of those floors is the
     112px top padding, which is there to clear the nav pill — and the pill ends
     around 76px, so roughly 30px of it is dead space. Spending that, plus the
     same tightened seam the landscape breakpoint uses, covers the band and
     leaves the statement at the size it is at every other height. The statement
     is a short paragraph now, so the band only has to keep the padding from
     eating the fold.
     Raising the breakpoint ceiling instead was the obvious move and the wrong
     one: that treatment sets min-height 0 for a viewport the copy fills on its
     own, so at 1440 wide the hero stopped filling the screen, the next section
     pushed into the fold and the greeting slid under the nav. Tightening the vh
     term worked too, but it is paid at every height where that term binds,
     including the 1440x800 laptop the hero is composed for. */
  @media (min-width: 601px) and (min-height: 561px) and (max-height: 670px) {
    .hp-hero { padding-top: 88px; }
    .hp-hero__sentence + .hp-hero__sentence {
      margin-top: 0.28em;
      margin-top: 0.28lh;
    }
  }

  /* ---------- Short viewports ----------
     A landscape phone has little room over the card, so the gap closes up. */
  @media (max-height: 500px) {
    .hp-cases { --card-gap: 22px; }
  }

  @media (max-width: 400px) {
    /* 10 left, not 8: same vertical + 4 as the block above. At 8 the avatar sat
       2px nearer the end of the pill than it did the top of it, which is the one
       breakpoint where the surround leaned the other way. */
    .hp-nav { gap: 8px; padding: 6px 5px 6px 10px; }
    /* 8 gap + 9 link padding. */
    .hp-nav__brand { padding-right: 17px; gap: 8px; }

  // and real spaces, which is what lets the line grouping below walk it.
  //

  // to a single word span with non-breaking spaces inside it. The span is
  // already nowrap, so this is the same guarantee with one fewer level of
  // nesting, and it is what keeps the per-sentence run flat.
  function splitWords(text, wordClassName) {

    return container.innerHTML;

    function wordSpan(str) {

      span.className = wordClassName;
      span.textContent = str;

  // which is what fits each box on the narrowest card the build runs on.

  // image and nothing is drawn over it except the two things she left room
  // for — the chips and the sentence. The arrow is the pointer, not a glyph

  // the rail set them on two lines at two sizes; on one line there is nothing

      '<h2 class="hp-case__title">' + p.title + '</h2>' +
      // Comma rather than a dash: "Boots website, read the case study" is a

  // The control is shown and hidden by a trigger over the work (see
  // initScrollScenes); this only handles the press. On: the context is made
  // from this gesture and the small confirming note plays. Off: nothing more

  function initSoundToggle() {
    var btn = document.getElementById('hp-sound');
    if (!btn) return;
    btn.addEventListener('click', function() {

  // The scroll the build plays over: the height of the spacer after the
  // stage. Read from the box rather than restated, so the stylesheet is the
  // one place the figure lives.
  function buildTravel(stage) {
    var sp = stage.nextElementSibling;
    return sp && sp.classList.contains('hp-build__travel') ? sp.offsetHeight : 0;
  }

  // Where a card is read to be: the scroll position that puts it on its
  // parking line. For the card in the build stage that is not its layout
  // position, which is the top of the deck with the card still in lines, but
  // the point the build finishes at — the finished card, at rest.
  function cardRestTop(root, card) {
    var stage = card.closest('.hp-build');
    if (stage) {
      return Math.max(0, layoutTopOf(root, stage) + buildTravel(stage));
    }
    var rootRect = root.getBoundingClientRect();
    var cardRect = card.getBoundingClientRect();
    var center = root.scrollTop + (cardRect.top - rootRect.top) + cardRect.height / 2;
    return Math.max(0, center - root.clientHeight / 2);
  }
  // An element's top in the page's layout — where it is in flow, not where
  // it is on screen — as a scroll position in the root scroller.
  //
  // offsetTop would be that, except for sticky elements: Chrome's offsetTop
  // on a stuck element includes the sticky shift, so a stage measured while
  // the reader is half-way down the deck reads as being wherever the page
  // is. For a sticky element the flow position is rebuilt instead from the
  // siblings before it — their heights and the container's gap, which is
  // exactly what laid it out — and the walk continues from its parent. The
  // deck's sticky children have no margins (see .hp-cases__list > .hp-case),
  // which is the one thing this sum relies on.
  function layoutTopOf(root, el) {
    var y = 0, n = el;
    while (n && n !== root) {
      if (getComputedStyle(n).position === 'sticky') {

        var t = (parseFloat(ps.borderTopWidth) || 0) + (parseFloat(ps.paddingTop) || 0);

        for (var sib = p.firstElementChild; sib && sib !== n; sib = sib.nextElementSibling) {
          t += sib.offsetHeight + gap;
        }
        y += t;
        n = p;
        continue;
      }
      y += n.offsetTop;
      n = n.offsetParent;
    }
    return y;
  }

  function initNavHide() {
    var nav = document.querySelector('.hp-nav');
    var root = document.getElementById('hp-root');
    if (!nav || !root) return;

    var last = root.scrollTop;
    var hidden = false;
    var HOLD = 120;     // never hidden within this of the top
    var BAND = 8;       // movement smaller than this is ignored

    function set(h) {
      if (h === hidden) return;
      hidden = h;
      nav.classList.toggle('is-hidden', h);
      /* The cards park lower while the pill is over them. Same moment as
         the pill, so the two move together. */
      root.classList.toggle('is-nav-away', h);
    }

    root.addEventListener('scroll', function() {
      var y = root.scrollTop;
      var d = y - last;
      if (y < HOLD) { set(false); last = y; return; }
      if (d > BAND) set(true);
      else if (d < -BAND) set(false);
      if (Math.abs(d) > BAND) last = y;
    }, { passive: true });

    // Pointer at the top edge, where the pill lives, brings it back.
    if (!window.matchMedia('(hover: none)').matches) {
      window.addEventListener('mousemove', function(e) {
        if (e.clientY < 90) set(false);
      }, { passive: true });
    }
    // A keyboard user tabbing into a hidden pill must be able to see it.
    nav.addEventListener('focusin', function() { set(false); });
  }

  function initBackToTop() {
    var btn = document.querySelector('[data-top]');
    var root = document.getElementById('hp-root');
    if (!btn || !root) return;
    btn.addEventListener('click', function() {
      root.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
    });
  }

  // The loop's duration is a speed, not a period. 36px a second is slow
  // enough to read a mark and obvious enough that the line is moving.
  // Measured off the copy, so a wider set of marks takes longer rather than
  // rushing.
  function initClientMarquee() {
    var track = document.querySelector('.hp-hero__track');
    if (!track || REDUCED) return;
    function pace() {
      var half = track.scrollWidth / 2;
      if (half) track.style.animationDuration = (half / 36) + 's';
    }
    pace();
    window.addEventListener('resize', pace);
  }

  // A client mark scrolls the homepage scroller, not the window, until that
  // card's centre is the viewport's centre — the same place the carousel
  // holds a card at full size. The fibre card has no mark and is not a target.
  function initClientLinks() {
    var root = document.getElementById('hp-root');
    if (!root) return;
    Array.prototype.forEach.call(document.querySelectorAll('.hp-hero__client'), function(link) {
      link.addEventListener('click', function(e) {
        var card = document.querySelector('.hp-case--' + link.getAttribute('data-case'));
        if (!card) return;
        e.preventDefault();
        root.scrollTo({ top: cardRestTop(root, card), behavior: REDUCED ? 'auto' : 'smooth' });
      });
    });
  }

  // A case study's "Back to selected work" link arrives here as /#work, and the
  // browser cannot honour that fragment for two separate reasons: at the moment
  // it would act on one this script has not built the page yet, and the target
  // does not sit in the document scroller but inside #hp-root, which is fixed
  // and scrolls its own contents. So it is read by hand, writing to that
  // scroller the same way the back-to-top button does.
  //
  // #work rather than #hp-cases: the id is this file's own naming and the URL is
  // something a visitor sees and shares.
  function initWorkAnchor() {
    var root = document.getElementById('hp-root');
    var cases = document.getElementById('hp-cases');
    if (!root || !cases) return;

    // Where this last put the page, or null once the visitor has moved it and
    // it stops being ours to set.
    var held = null;

    function go(smooth) {
      if (window.location.hash !== '#work') return;
      // With the build on, the work starts with card 01 at rest in its stage,
      // not with card 02 at the top of this section.
      var first = document.querySelector('.hp-build .hp-case');
      var top = first
        ? cardRestTop(root, first)
        : root.scrollTop
          + cases.getBoundingClientRect().top
          - root.getBoundingClientRect().top;
      smooth = smooth && !REDUCED;
      root.scrollTo({ top: top, behavior: smooth ? 'smooth' : 'auto' });
      // Where it went, which is not always where it was sent: an instant scroll
      // aimed past the end of a page that is still filling in gets clamped, and
      // re-reading is what lets the correction below tell that from a visitor
      // who has taken over. Nothing to read mid-flight on a smooth one, and by
      // then the page has settled anyway.
      held = smooth ? null : Math.round(root.scrollTop);
    }

    // The cards do not stay where they were aimed at. The hero above them is
    // set in a webfont that has not arrived yet and wraps to a different depth
    // in the fallback, the artwork is still loading, and a phone that turns
    // re-lays the column. So it is re-aimed each time one of those lands — but
    // only while the page is still where this put it, because moving it under
    // someone who has started reading is the rudest thing this could do.
    function again() {
      if (held === null) return;
      if (Math.abs(root.scrollTop - held) > 2) { held = null; return; }
      go(false);
    }

    // On arrival, land there outright. Someone coming back from a case study
    // asked for the work, not to watch the hero go past on the way to it.
    go(false);
    // Following the same link while already on the homepage sets the hash
    // without navigating, and nothing above runs again. Here the travel is the
    // only feedback that the click did anything, so this one is smooth.
    window.addEventListener('hashchange', function() { go(true); });

    if (document.readyState === 'complete') setTimeout(again, 0);
    else window.addEventListener('load', again);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(again);
    var settleTimer;
    window.addEventListener('resize', function() {
      clearTimeout(settleTimer);
      settleTimer = setTimeout(again, 200);
    });
  }

  // ---------- THE STATEMENT, A LINE AT A TIME ----------
  // The words of each sentence block are already separate spans. This measures
  // where each one fell, groups the ones that share a top edge into a line,
  // and wraps each line in a clipping box with a moving box inside it. It
  // returns the moving boxes, which are what the entrance animates.
  //
  // Measured after the webfont has landed, because lines found against the
  // fallback face are not the lines the reader sees, and a box that is nowrap
  // around the wrong words would clip when the real face arrived. Undone by
  // unwrapLines once the entrance has played, so resize and balance work on
  // the statement as written.
  function wrapLines(inner) {
    var movers = [];
    var blocks = Array.prototype.slice.call(inner.querySelectorAll('.hp-hero__sentence'));
    // Every position is read before anything is moved. Each wrapper is a
    // block, so the moment the first one is inserted every word after it
    // reflows underneath, and a measurement taken then is of a layout the
    // reader never sees.
    var tops = new Map();
    blocks.forEach(function(block) {
      Array.prototype.forEach.call(block.querySelectorAll('.hp-hero__word'), function(w) {
        tops.set(w, w.offsetTop);
      });
    });
    blocks.forEach(function(block) {
      var nodes = Array.prototype.slice.call(block.childNodes);
      var line = null, mover = null, top = null;
      nodes.forEach(function(n) {
        var isWord = n.nodeType === 1 && n.classList.contains('hp-hero__word');
        if (isWord) {
          var t = tops.get(n);
          if (line === null || Math.abs(t - top) > 2) {
            line = document.createElement('span');
            line.className = 'hp-hero__line';
            mover = document.createElement('span');
            mover.className = 'hp-hero__line-in';
            line.appendChild(mover);
            block.insertBefore(line, n);
            movers.push(mover);
            top = t;
          }
          mover.appendChild(n);
        } else if (mover) {
          // The spaces between words travel with the line they are in.
          mover.appendChild(n);
        } else {
          block.removeChild(n);
        }
      });
    });
    return movers;
  }
  function unwrapLines(inner) {
    Array.prototype.forEach.call(inner.querySelectorAll('.hp-hero__line'), function(line) {
      var mover = line.firstChild;
      var parent = line.parentNode;
      // The spaces travelled with their lines, so nothing is missing once the
      // words are back in one run.
      while (mover.firstChild) parent.insertBefore(mover.firstChild, line);
      parent.removeChild(line);
    });
  }

  // The hero is the opening moment — no splash gate in front of it.
  //
  // Three things arrive: the greeting, the statement's lines, and the closing
  // band, marks already drifting inside it. The statement is uncovered a line at
  // a time, each line rising into a box clipped to its own height, so what the
  // reader watches is a sentence appearing rather than a hundred letters
  // settling. Nothing in here lifts toward the pointer afterwards: that effect
  // has gone, because it was a novelty on the one sentence the page exists to
  // have read.
  function initHero() {
    if (typeof gsap === 'undefined') return;
    if (REDUCED) return;

    var inner = document.querySelector('.hp-hero__statement-inner');
    var greeting = document.querySelector('.hp-hero__greeting');
    var aside = document.querySelector('.hp-hero__aside');
    var below = document.querySelectorAll('.hp-hero__lower');
    if (!inner) return;

    // Hidden before first paint. The entrance cannot start until the lines are
    // measured, and that waits on the font; nothing may show in between.
    gsap.set(inner, { opacity: 0 });
    gsap.set([greeting, aside], { opacity: 0, y: 16 });
    gsap.set(below, { opacity: 0, y: 22 });

    // The body face, or 700ms, whichever is first. A face that never
    // arrives must not mean a hero that never does. fonts.ready can resolve
    // a frame before Inter is the face actually used for the paragraph, and
    // measuring the lines against the fallback makes the word spacing jump
    // when the real face lands. Two frames after the check gives that layout
    // time to settle before anything is measured or shown.
    var ready = (function() {
      if (!document.fonts) return Promise.resolve();
      var spec = '500 48px Manrope';
      var done = document.fonts.ready.then(function() {
        if (document.fonts.check(spec)) return;
        return document.fonts.load(spec);
      }).then(function() {
        return new Promise(function(r) {
          requestAnimationFrame(function() { requestAnimationFrame(r); });
        });
      });
      var cap = new Promise(function(r) { setTimeout(r, 700); });
      return Promise.race([done, cap]);
    })();

    ready.then(function() {
      var movers = wrapLines(inner);
      // 140% of the line's own height, which clears the clip box and both of
      // its paddings with a little to spare.
      gsap.set(movers, { yPercent: 140 });
      gsap.set(inner, { opacity: 1 });

      gsap.timeline({
        defaults: { ease: 'expo.out', force3D: true },
        onComplete: function() {
          unwrapLines(inner);
          // Built here, not in initScrollScenes, and the entrance finishing is
          // the reason. The exit writes opacity and y to the greeting and the
          // closing band, which are the two things the entrance is still
          // writing to; created any earlier, a visitor who scrolls immediately
          // has two timelines setting the same properties on the same elements
          // on the same frame. Waiting for onComplete makes that impossible
          // rather than unlikely. Nothing is lost by arriving late: a scrub
          // trigger reads the scroll position when it is created.
          initHeroExit();
        }
      })
        .to([greeting], { opacity: 1, y: 0, duration: 1 }, 0)
        // A line at a time, 0.1s apart, so the statement reads as settled before
        // the last line has finished moving — the expo ease has a line visibly
        // in place well before its duration is up. The aside follows the
        // statement rather than arriving with the greeting: it is the wink, and
        // a wink that lands before the point has no point.
        .to(movers, { yPercent: 0, duration: 1.15, stagger: 0.1 }, 0.18)
        .to(aside, { opacity: 1, y: 0, duration: 1 }, 0.62)
        // The band arrives under a statement that is still arriving. The marks
        // are already drifting inside it, so they come in with the line
        // rather than one at a time.
        .to(below, { opacity: 1, y: 0, duration: 1.1 }, 0.7);
    });
  }

  // The ambient light. Two motions on the second light and nothing at all on the
  // first, for the reason .hp-hero__glow-a gives at length: the key light is
  // clipped by its own box on purpose and cannot be moved without a seam.
  //
  //   The drift  is a 26s half-cycle, so 52s there and back, on a light that is
  //     under half the strength of the one beside it. It is not meant to be
  //     watched. What it is for is that the hero is now the only screen on the
  //     site a visitor can sit on without scrolling — the entrance finishes in
  //     under two seconds and, on a trackpad, nothing else happens — and a room
  //     with a light that moves is a room rather than a picture of one. The
  //     brightness runs on its own 19s cycle rather than with the movement,
  //     because two motions sharing a period read as one loop.
  //   The pointer  moves the same light a little way toward the cursor, ±26px
  //     across and ±16px down, eased over 1.2s so it lags well behind the hand.
  //     The lag is the whole effect: something that tracked the pointer exactly
  //     would read as a cursor decoration, and this should read as the light in
  //     the room having a direction.
  //
  // Both are skipped under reduced motion and the pointer is skipped where there
  // isn't one, which leaves the two gradients exactly as the stylesheet draws
  // them — a composition, not a broken animation.
  function initHeroLight() {
    if (typeof gsap === 'undefined' || REDUCED) return;

    var b = document.querySelector('.hp-hero__glow-b');
    var lamp = document.querySelector('.hp-hero__lamp');
    if (!b || !lamp) return;

    gsap.to(b, {
      xPercent: 2.4,
      yPercent: -1.6,
      duration: 26,
      ease: 'sine.inOut',
      repeat: -1,
      yoyo: true
    });
    gsap.to(b, {
      opacity: 0.74,
      duration: 19,
      ease: 'sine.inOut',
      repeat: -1,
      yoyo: true
    });

    if (window.matchMedia('(hover: none)').matches) return;

    var setX = gsap.quickTo(lamp, 'x', { duration: 1.2, ease: 'power2.out' });
    var setY = gsap.quickTo(lamp, 'y', { duration: 1.2, ease: 'power2.out' });
    var queued = false, mx = 0, my = 0;

    function apply() {
      queued = false;
      // Offset from the centre of the window rather than from the hero, so the
      // light keeps answering the pointer while the visitor is reading something
      // further down the page. It costs two interpolations on a layer that is
      // usually off screen, and it means the light is never found parked at an
      // angle that has nothing to do with where the cursor is.
      setX((mx / window.innerWidth - 0.5) * 52);
      setY((my / window.innerHeight - 0.5) * 32);
    }

    window.addEventListener('mousemove', function(e) {
      mx = e.clientX;
      my = e.clientY;
      if (!queued) { queued = true; requestAnimationFrame(apply); }
    }, { passive: true });
  }

  // ---------- THE HERO'S EXIT ----------
  // The hero used to have no relationship to scroll at all: it played its
  // entrance, ran the cursor field, and then slid off the top like any static
  // block on the way to the wordmark. So the one screen every visitor is
  // guaranteed to see was the one screen with nothing authored about leaving it,
  // and the page's only piece of scroll-driven motion started after it.
  //
  // This puts the first screen of scroll on a scrubbed timeline, and the span it
  // is scrubbed over is exactly the hero's own height — 'top top' to
  // 'bottom top' — which is the same span the visitor spends getting rid of it.
  // That number is not chosen, it is inherited: the wordmark's own timeline
  // starts at its 'top top', which is the scroll position at which the hero's
  // bottom edge reaches the top of the screen, so the last frame of this is the
  // first frame of that and there is no seam to cover.
  //
  // What it does NOT do is touch the wordmark. Its motion, its scale values and
  // its 420vh of scroll cost are locked, and a handoff built by starting its rows
  // earlier would have spent that lock to save a join that closes on its own.
  // Everything here is on the hero's side of the join.
  //
  // Two ideas, and only two:
  //
  //   The block comes apart.  Each piece of copy carries a little extra upward
  //     travel on top of the scroll, and the higher up the composition it sits
  //     the more it gets — 120px for the greeting against 46px for the last
  //     sentence. The intervals the hero was so carefully composed with open up
  //     as it leaves, which is the difference between a composition departing
  //     and a screenshot sliding.
  //   Everything dissolves rather than sliding away.  Each piece fades out on
  //     its own window, in the same order, and is gone before it would have
  //     reached the top of the screen — so the hero ends as light going out
  //     rather than as a block of type being pushed off an edge.
  //     Not tuned to clear the nav pill, which was the first thing tried and is
  //     not available: the statement's top line reaches the pill after about 18%
  //     of this scroll, and a fade that finished by then would take the largest
  //     copy on the page away almost as soon as the wheel moved. It crosses at
  //     partial opacity instead, behind 28px of backdrop blur, which is the
  //     thing that blur is there for.
  //
  // Transforms and opacity only, nothing that triggers layout, for the reason
  // the wordmark states at length: this is a main-thread write racing a
  // compositor-thread scroll inside a custom scroller, and the only version of
  // that which does not shake is the one where every write is a composited
  // property.
  function initHeroExit() {
    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
    // No exit under reduced motion, and nothing to add for it either: with this
    // off the hero simply scrolls, which is a correct way to leave a page and
    // was the only way it left until now. Unreachable in practice — the
    // entrance that calls this is itself behind the same check — and kept as the
    // statement of intent for whoever calls it next.
    if (REDUCED) return;

    var hero = document.getElementById('hp-hero');
    if (!hero) return;

    var greeting = hero.querySelector('.hp-hero__greeting');
    var aside = hero.querySelector('.hp-hero__aside');
    var inner = hero.querySelector('.hp-hero__statement-inner');
    var lower = hero.querySelector('.hp-hero__lower');
    var glow = hero.querySelector('.hp-hero__glow');
    var blocks = Array.prototype.slice.call(hero.querySelectorAll('.hp-hero__sentence'));
    if (!greeting || !aside || !inner || !lower || !glow || !blocks.length) return;

    // Half travel below 900px, where the copy block is most of the screen and
    // the same displacement reads as the headline being yanked rather than
    // drifting. A function rather than a value read once, because
    // invalidateOnRefresh re-evaluates function-based values on every refresh:
    // dragging a window across the breakpoint, or a phone collapsing its browser
    // chrome, re-derives the travel instead of keeping the figure it was built
    // with.
    function travel(px) {
      return function() { return window.innerWidth <= 900 ? px * 0.55 : px; };
    }

    // The statement recedes very slightly as it goes — 3.5%, which is not
    // legible as a size change and is legible as depth. From its left edge, not
    // its centre: every line in the hero is composed on one left axis, and a
    // scale about the centre walks the statement off that axis on the way out.
    // The blocks inside it carry their own y, which this scales along with
    // everything else; 74px arrives as 71px and the ranking is what matters,
    // not the figure.
    gsap.set(inner, { transformOrigin: '0% 50%' });

    var tl = gsap.timeline({
      // Linear for the travel. The extra displacement is a difference in rate
      // against a scroll the visitor is metering themselves, and any ease on it
      // is an opinion about how fast they are scrolling. The fades ease
      // individually below, where an ease is about the copy and not the gesture.
      defaults: { ease: 'none', force3D: true },
      scrollTrigger: {
        trigger: hero,
        start: 'top top',
        end: 'bottom top',
        invalidateOnRefresh: true,
        // No smoothing, for the reason the wordmark gives: interpolation inside
        // this scroller lets the thing drift on after the scroll has stopped.
        scrub: true
      }
    });

    tl
      // The greeting: most travel, first out. It is the smallest line in the
      // composition and the one whose job is finished soonest.
      .to(greeting, { y: travel(-120), duration: 1 }, 0)
      .to(greeting, { opacity: 0, duration: 0.44, ease: 'power1.in' }, 0)
      // Under the statement, so it leaves with the last sentence rather than
      // with the greeting: less travel, and a fade that starts a fraction
      // later, which is the same ranking the sentences already use.
      .to(aside, { y: travel(-28), duration: 1 }, 0)
      .to(aside, { opacity: 0, duration: 0.6, ease: 'power1.in' }, 0.06)
      .to(inner, { scale: 0.965, duration: 1 }, 0)
      // The closing band is the rule, the word and the arrow. It used to be
      // gone after the first fifth of this scroll, which read as the cue
      // vanishing the moment the wheel moved, while the sentences above were
      // still on their way out. It now fades on the same kind of run as the
      // statement, so this edge leaves with the copy rather than ahead of it.
      // Downward, against everything else: it is the bottom edge of the
      // composition and it stays behind rather than joining the exit.
      .to(lower, { y: travel(18), duration: 1 }, 0)
      .to(lower, { opacity: 0, duration: 0.58, ease: 'power1.in' }, 0)
      // The lights going down. The glow contracts toward its own focal point and
      // dims out over most of the range, so the page is already dark by the time
      // the wordmark's first row arrives on it — the mark is a title card, and it
      // lands better on black than on the back of the hero's own light.
      .to(glow, { scale: 0.8, duration: 1 }, 0)
      .to(glow, { opacity: 0, duration: 0.85, ease: 'power2.in' }, 0);

    // Per group rather than per hard-coded first and second, so the ranking is
    // a rule about position in the block and not a list that has to be rewritten
    // the next time the statement gains or loses a sentence. The top group gets
    // the most travel and the earliest fade, the last group the least and the
    // latest, and everything between is interpolated — a one-sentence statement
    // takes the top of both ranges and nothing has to change here.
    // A group is the blocks a seam separates. The first sentence is two blocks
    // split at the comma, and only the last sentence carries the blank line, so
    // the two clauses share a group and leave together. If they ranked
    // separately the comma hinge would open up on the way out.
    var groups = [];
    blocks.forEach(function(el) {
      var seam = parseFloat(getComputedStyle(el).marginTop) > 1;
      if (seam || !groups.length) groups.push([el]);
      else groups[groups.length - 1].push(el);
    });
    groups.forEach(function(group, i) {
      var t = groups.length > 1 ? i / (groups.length - 1) : 0;
      group.forEach(function(el) {
        tl.to(el, { y: travel(-74 + 28 * t), duration: 1 }, 0)
          .to(el, { opacity: 0, duration: 0.52 + 0.08 * t, ease: 'power1.in' }, 0);
      });
    });
  }

  // One reveal recipe for every section below the fold.
  function reveal(trigger, steps) {
    if (REDUCED || !trigger) return;
    var active = steps.filter(function(s) { return s.els && s.els.length; });
    if (!active.length) return;

    active.forEach(function(s) {
      gsap.set(s.els, { opacity: 0, y: s.y == null ? 30 : s.y });
    });

    ScrollTrigger.create({
      trigger: trigger,
      start: 'top 82%',
      once: true,
      onEnter: function() {
        var tl = gsap.timeline({ defaults: { ease: 'expo.out', force3D: true } });
        active.forEach(function(s) {
          tl.to(s.els, {
            opacity: 1,
            y: 0,
            duration: s.duration || 1.1,
            stagger: s.stagger || 0
          }, s.at || 0);
        });
      }
    });
  }

  // ---------- THE BUILD ----------
  // Card 01 assembled in front of the reader: lines, a grid, the wireframe,
  // some of its code, the screenshot, the card. One timeline, scrubbed over
  // the 360vh the section is taller than its stage, and the same two rules as
  // the carousel: nothing is pinned by script — the stage is position:sticky —
  // and no scroll frame writes anything that lays out. What is written is
  // transform and opacity, plus stroke-dasharray on the SVG lines (how a line
  // is drawn). The one image is clipped to its window once and unclipped
  // once; the clip is never tweened.
  //
  // Times below are fractions of the travel. Each state has a stretch where
  // nothing new starts, and each hands over to the next across three to five
  // hundredths, which is metic's rhythm and the reason it reads as building
  // rather than as a slideshow:
  //
  //   1  Lines         0.00–0.11   five hairlines across the screen
  //   2  A grid        0.11–0.24   the panels' columns and margins, their
  //                                outlines, the section boxes; the
  //                                hairlines trim
  //   3  Components    0.24–0.46   the wire unfolds in reading order
  //   4  Code          0.46–0.54   both panels fill, and a snippet
  //                                types in each
  //   5  The checkout  0.54–0.72   the screenshot resolves through the wire
  //   6  The card      0.72–0.93   the navy closes round the window, then
  //                                the sentence arrives
  //      hold          0.93–1.00   card 01 at rest, then the stage releases
  //
  // The states are not on the timeline and nothing on screen names them;
  // onUpdate turns progress into a state only to mark the change with a
  // sound. The ticks come from the same place: a list of the fractions at
  // which things land, and each frame asks which of them the progress
  // crossed since the last one, in either direction, never one per frame.
  function initBuildScene(root) {
    var section = document.getElementById('hp-build');
    if (!section) return;
    var stage = section.querySelector('.hp-build__stage');
    var card = section.querySelector('.hp-case');
    var img = card && card.querySelector('.hp-case__art');
    var wire = card && card.querySelector('.hp-build__wire');
    var codes = card ? card.querySelectorAll('.hp-build__code') : [];
    var navy = card && card.querySelector('.hp-build__navy');

    if (!stage || !card || !img || !wire || !guides || !navy) return;

    var regs = Array.prototype.slice.call(guides.querySelectorAll('.hb-reg'));
    var colsLayer = wire.querySelector('[data-layer="cols"]');
    var cols = colsLayer.querySelectorAll('rect');
    var outlines = Array.prototype.slice.call(wire.querySelectorAll('[data-layer="outlines"] path'));
    var boxes = wire.querySelector('[data-layer="boxes"]');
    var dims = wire.querySelector('[data-layer="dims"]');
    var dims2 = wire.querySelector('[data-layer="dims2"]');
    var ground = wire.querySelector('[data-layer="ground"]');
    var els = Array.prototype.slice.call(wire.querySelectorAll('.hb-el'));
    var bars = wire.querySelectorAll('.hb-el .hb-bar, .hb-el .hb-fill');
    var strokes = wire.querySelectorAll('.hb-el .hb-wire, .hb-el .hb-accent, .hb-el .hb-radio');
    var head = [card.querySelector('.hp-case__tags')]

    // The card's box is read from its computed size and the stage's, not from
    // getBoundingClientRect, because after the stage releases the card carries
    // the carousel's scale and a rect would measure the scaled box. These are
    // laid out on every refresh, before the triggers re-measure.
    //
    // Each line is a dash pattern "0 0 x 999999": a dash of x from the path's
    // start and then nothing. Drawing is x growing from 0 to the length;
    // trimming to the card is the pattern becoming "0 a b 999999", a gap to
    // the card's edge and a dash across it; retracting is that dash closing
    // on its own centre. Everything a line ever does is one property, and a
    // line whose tween has not yet been reached is "0 0 0 999999" — nothing —
    // whatever the window has done since.
    var LEN = [0, 0, 0, 0, 0];

    // right edge inward, open is nothing cut. The half-percent of air on the
    // open side is for the hairlines, which sit half outside the box they
    // outline; shut goes past 100% on the right for the same reason, so the
    // left edge's half-hairline is under the cut too and not left showing as
    // a dash. Both ends have the same shape of value, which the tween needs.
    var WIPE_SHUT = 'inset(-0.5% 101% -0.5% -0.5%)';

    // browser window in the file, which is the whole element on a desktop.
    // layoutGuides rewrites it when the element is a crop of the file.
    var windowClip = 'inset(36.52% 7.47% 0% 7.47% round 1.19% 1.19% 0 0)';
    // Which rectangle of the file the img is showing. object-fit: fill (the
    // desktop) shows all of it. object-fit: cover pinned to the bottom — the
    // phone — shows the lower part and cuts the flat band off the top, and
    // every coordinate below is in the file, so it has to be read through
    // that window or the wire, the code and the guides land on the band
    // that is no longer there.
    function sourceWindow(im) {

      // 3024 by 2708 grid, and the img's natural size is whichever srcset
      // rung loaded — a 1008px rendition would hand the viewBox a window
      // the drawing does not live in. Every rung is the same picture, so

      var nw = +im.getAttribute('width') || 3024;
      var nh = +im.getAttribute('height') || 2708;

      function align(token, edge) {
        if (!token) return edge;

        if (token === 'right' || token === 'bottom') return 1;
        if (token === 'center') return 0.5;
        if (token.indexOf('%') !== -1) return parseFloat(token) / 100;

      }
      return {
        x: (nw - sw) * align(pos[0], 0.5),

    // would include the deck's scale once the stage has let go.

      // deck's first parking line (see .hp-build__stage). The painted box,
      // not offsetTop. offsetTop is an integer and it ignores a transform, so
      // a guide laid out from it sits a few pixels below the line it is
      // naming once the card is on a fractional padding or a scaled layer.
      // The guides SVG's own box is the coordinate space the paths are in.

      var cr = card.getBoundingClientRect();
      var ir = img.getBoundingClientRect();

      if (gr.width > 1 && cr.width > 1 && ir.height > 1) {
        l = cr.left - gr.left;
        t = cr.top - gr.top;

        h = cr.height;

        w = parseFloat(cs.width);
        h = parseFloat(cs.height);

        t = card.offsetTop;

        ir = { height: img.offsetHeight };
      }
      var src = sourceWindow(img);
      wire.setAttribute('viewBox', [src.x, src.y, src.w, src.h].map(function(v) {
        return Math.round(v * 100) / 100;
      }).join(' '));
      if (codes.length && src.w && src.h) {
        // The gift card button, then the first product tile, each set a
        // little to the right of the control so the wire shows down its
        // left edge. File percentages, read through the crop the way the
        // wire's viewBox is.
        [{ x: 17.51, y: 79.6, w: 38.19 }, { x: 60.46, y: 56.43, w: 25.03 }].forEach(function(p, i) {
          var el = codes[i];
          if (!el) return;
          el.style.setProperty('--code-x', ((p.x / 100 * src.nw - src.x) / src.w * 100) + '%');

      var clipTop = (0.3652 * src.nh - src.y) / src.h * 100;
      var clipLeft = (0.0747 * src.nw - src.x) / src.w * 100;
      var clipRight = (src.x + src.w - 0.9253 * src.nw) / src.w * 100;
      var clipBottom = (src.y + src.h - src.nh) / src.h * 100;
      var clipRy = 1.19 * src.nh / src.h;

        clipRy.toFixed(2) + '% 0 0)';

      // Putting it back would crop a finished card on a resize.

      // up so the top one is the underside of the address bar. 1057 and 1256
      // are those edges in the file, the same pixels the wire draws. Read
      // from the wire's own transform, so the guide is that rule and not a
      // second line beside it.
      function guideY(fileY) {
        var wm = wire.getScreenCTM();
        var gm = guides.getScreenCTM();
        if (wm && gm) {
          var pt = wire.createSVGPoint();
          pt.x = 0;
          pt.y = fileY;
          var sp = pt.matrixTransform(wm);
          var gp = guides.createSVGPoint();
          gp.x = sp.x;
          gp.y = sp.y;
          return gp.matrixTransform(gm.inverse()).y;
        }

        return at.y + (fileY - src.y) / src.h * h;

      var yHead = guideY(1256);
      var yChrome = yPage;
      var xGut = l + w * 0.566;            // the gutter between its two columns
      // d, length, gap before the kept span, kept span

        ['M0 ' + yPage + 'H' + vw, vw, l, w],
        ['M' + l + ' 0V' + vh, vh, t, h],
        ['M' + (l + w) + ' ' + vh + 'V0', vh, vh - (t + h), h],
        ['M' + vw + ' ' + yHead + 'H0', vw, vw - (l + w), w],

      });

      // artwork's own pixel size, 3024 by 2708 — the one set of numbers that
      // is true of the file being drawn; the two dimensions on the wire are
      // in the design's units because the owner supplied them. These went
      // for a while as noise and came back at her asking: a frame with its
      // corners labelled is what reads as a frame. They used to hang off a
      // registration cross at the corner; the crosses went at her asking
      // too, and the labels sit just off the corner the guides already draw.
      var corners = [
        [l, t, 'end', -8, -8, 'x 0 · y 0'],
        [l + w, t, 'start', 8, -8, 'x 3024 · y 0'],

        [l + w, t + h, 'start', 8, 16, 'x 3024 · y 2708']

        var c = corners[i];
        var tx = g.querySelector('.hb-label');
        tx.setAttribute('x', c[0] + c[3]);
        tx.setAttribute('y', c[1] + c[4]);
        tx.setAttribute('text-anchor', c[2]);
        tx.textContent = c[5];

    }
    function dashNone() { return '0 0 0 ' + FAR; }
    function dashFull(i) { return function() { return '0 0 ' + LEN[i] + ' ' + FAR; }; }
    function dashTrim(i) { return function() { return '0 ' + TRIM[i][0] + ' ' + TRIM[i][1] + ' ' + FAR; }; }

    // ---- the state everything starts from ----
    // Set here, not in the stylesheet, so that a page whose timeline never
    // gets built shows the card. Everything hidden below is something the
    // timeline is about to show.
    layoutGuides();
    gsap.set(lines, { strokeDasharray: dashNone() });
    gsap.set(regs, { opacity: 0 });
    gsap.set(cols, { scaleY: 0, transformOrigin: '50% 0%' });
    gsap.set(outlines, { strokeDasharray: dashNone() });
    gsap.set([boxes, dims, dims2, ground], { opacity: 0 });
    els.forEach(function(el) {
      if (el.getAttribute('data-unfold') === 'fade') gsap.set(el, { autoAlpha: 0 });

    });

    // side of it cut away, the window's own top corners kept — for the whole
    // build, and unclipped in one frame at the end; the clip is never tweened.

    gsap.set(navy, { opacity: 0 });
    gsap.set(head, { opacity: 0, y: 24 });

    // ---- the timeline ----
    var landings = [];
    function land(f) { landings.push(f); }
    var STATES = [0, 0.11, 0.24, 0.46, 0.54, 0.72];
    var state = 0;
    var prev = -1;
    var FOUND_AT = 0.63;

    // ahead of the drawing by up to the catch-up time, and a tick for a line
    // that has not been drawn yet is just a wrong noise.
    function onUpdate() {

      var s = 1;
      for (var i = 1; i < STATES.length; i++) if (p >= STATES[i]) s = i + 1;
      if (s !== state) {
        var first = state === 0;
        state = s;
        if (!first) SOUND.play('chapter');
      }
      // The cursor's arrow is the pointer for a finished card. 0.90 is the
      // frame the image's clip drops and the card is the image alone, the
      // same thing every other card already is. Before that the drawing is
      // still a drawing, and the dot stays a dot. Flipped here, on the
      // timeline rather than the scroll, because the scrub lags the wheel
      // and the thing on screen is what the pointer should answer to.
      var developed = p >= 0.90;

    // the timeline is the scroll position, frame for frame, because what is
    // moving is the page itself. Here what is moving is a drawing, and a
    // drawing has a pace: flicked through in a single gesture it is five
    // states in a quarter of a second and reads as a glitch. With a catch-up
    // time the trigger still reads the scroll on every frame but the timeline
    // follows it over that long, so the fastest the build can play is the
    // whole sequence in about two seconds, in front of you, with the

    // never seen. The scroll itself is untouched: nothing here listens to the

    // boxes and the measurements fade in; the hairlines give up the parts of
    // themselves outside the card.

    });

    tl.to(dims, { opacity: 1, duration: 0.03 }, 0.19);
    lines.forEach(function(ln, i) {
      tl.fromTo(ln, { strokeDasharray: dashFull(i) }, { strokeDasharray: dashTrim(i), duration: 0.05 }, 0.18);

    // the page's contents open from their left (see group()), in reading
    // order; the section boxes hand over to the solid panels; the page
    // ground fills; the columns fall back.
    //
    // The wipe is a clip-path, animated — a paint property, and the one
    // other place this build steps outside transform and opacity, with the
    // image's clip. It is allowed here for the same reason: the groups are

    // drawn again a beat later, which the owner saw as the wire glitching

    var secs = boxes.querySelectorAll('.hb-sec');
