<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abbie Truman — Local Preview</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

<style>
  html.hp-active, html.hp-active body {
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    height: 100vh !important;
    background: #0a0a0c !important;
    color: #f5f5f5 !important;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .hp-root {
    /* ---------- TYPE SYSTEM ----------
       Two families, no third. One governing rule, applied to every element on
       this page:

         DISPLAY  → Manrope. Every headline and every word set above ~28px:
                    the hero statement, the wordmark, case titles, section
                    ledes, the footer line. 800 for short headlines, 700 for
                    multi-line statements so long runs don't go blobby.
         BODY/UI  → Inter. Every sentence you actually read, plus all labels,
                    eyebrows, tags, nav and buttons. Where a sentence needs a
                    word lifted out of it, that is Inter 500 in full white.
                    The hero's support paragraph deliberately has none: it is
                    one flat grey from end to end.

       There is no serif and no accent face. Instrument Serif italic used to
       carry one phrase per section; the sections that held those phrases were
       deleted or reset one at a time until the footer's "talk." was the last
       one on the page, and that word is now Manrope too. The family has been
       dropped from the Google Fonts request as well as from the stylesheet —
       an unused font file is a real download, not a spare part. */
    --ff-display: 'Manrope', 'Inter', -apple-system, sans-serif;
    --ff-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

    --bg: #0a0a0c;
    --ink: #ffffff;
    --ink-1: rgba(255,255,255,0.74);
    --ink-2: rgba(255,255,255,0.52);
    --ink-3: rgba(255,255,255,0.40);
    --rule: rgba(255,255,255,0.10);

    --pad-x: clamp(28px, 6vw, 110px);
    --shell: 1560px;

    position: fixed;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--bg);
    z-index: 999999;
    font-family: var(--ff-body);
  }
  .hp-root * { font-family: inherit; box-sizing: border-box; }

  /* ---------- Shared primitives ---------- */
  .hp-eyebrow {
    display: block;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
  }
  .hp-eyebrow--rule {
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .hp-eyebrow--rule::before {
    content: '';
    width: 28px;
    height: 1px;
    background: rgba(255,255,255,0.3);
  }

  /* ---------- NAV (floating pill) ---------- */
  .hp-nav {
    position: fixed;
    top: 28px;
    left: 50%;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 14px 12px 16px;
    background: rgba(18,18,22,0.55);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 999px;
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.07),
      0 32px 80px -16px rgba(0,0,0,0.55),
      0 6px 24px rgba(0,0,0,0.28);
    opacity: 0;
    transform: translate(-50%, -16px);
    transition: opacity 0.9s cubic-bezier(0.32,0.72,0,1), transform 0.9s cubic-bezier(0.32,0.72,0,1);
  }
  .hp-nav.is-ready { opacity: 1; transform: translate(-50%, 0); }

  .hp-nav__brand {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-right: 24px;
    border-right: 1px solid rgba(255,255,255,0.09);
  }
  .hp-nav__avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(255,255,255,0.16);
    display: block;
  }
  .hp-nav__name {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1.2;
    color: #fff;
    white-space: nowrap;
  }

  .hp-nav__links {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .hp-nav__link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 44px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
    border-radius: 999px;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .hp-nav__link:hover { background: rgba(255,255,255,0.06); }
  .hp-nav__arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.55);
    transition: color 0.25s ease, transform 0.25s cubic-bezier(0.32,0.72,0,1);
  }
  .hp-nav__link:hover .hp-nav__arrow { color: #fff; transform: translate(3px, -3px); }
  .hp-nav__arrow svg { width: 16px; height: 16px; display: block; }

  /* ---------- HERO ----------
     All three pieces of copy are one block: the greeting reads into the
     statement, the statement is the largest thing on the page, and the support
     paragraph reads back out of it. The intervals inside that block are much
     smaller than the intervals around it, which is what makes it read as one
     thought rather than three stacked elements.
     The rule used to sit between the statement and the support paragraph,
     which cut the copy in half. It now sits below all of it and separates only
     the scroll cue, so it still gives the composition a second horizontal edge
     to close on — the cue is too small to hold the bottom of a full-height
     section by itself — without splitting anything anyone reads. */
  .hp-hero {
    position: relative;
    min-height: 100vh;
    max-width: var(--shell);
    margin: 0 auto;
    padding: clamp(112px, 13vh, 150px) var(--pad-x) clamp(36px, 5vh, 64px);
    display: grid;
    /* Four tracks, two of them empty, so spare height is *divided* rather
       than pooled. Rows 1 and 3 are the clearance above the copy block and the
       open field below it; splitting the slack 1.55 : 1 keeps those two
       intervals visibly unequal, which is what stops the copy reading as
       something floating between two identical gaps — the measured failure
       that put the rule here in the first place. The minmax() floor on row 3
       guarantees the copy never crowds the rule, and both spacer tracks
       collapse to nothing on short viewports where there is no slack to divide
       in the first place.
       The floor is set for body copy rather than display type: the support
       paragraph now ends the block, and a 16-21px line needs more clearance
       above a hairline than a 74px glyph does to avoid looking snagged on it. */
    grid-template-rows: 1.55fr auto minmax(clamp(48px, 7vh, 96px), 1fr) auto;
    gap: 0;
  }
  .hp-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 62% 52% at 10% 22%, rgba(94,116,178,0.13) 0%, transparent 68%);
  }
  /* The copy block. `gap` is the greeting-to-statement interval, deliberately
     the tightest one in the hero so the greeting reads as a lead-in rather than
     a separate line of text. */
  .hp-hero__main {
    grid-row: 2;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 2.2vh, 28px);
  }
  .hp-hero__greeting {
    margin: 0;
    font-size: clamp(17px, 1.5vw, 24px);
    line-height: 1.3;
    letter-spacing: -0.01em;
    font-weight: 500;
    color: var(--ink-2);
  }
  .hp-hero__greeting strong { color: var(--ink); font-weight: 500; }

  .hp-hero__statement {
    margin: 0;
    max-width: 30ch;
    font-family: var(--ff-display);
    font-weight: 700;
    /* One curve from phone to desktop. A pure-vw size needed a separate mobile
       override, and that override capped higher than the desktop curve between
       ~750px and ~1150px, so the statement got *smaller* as the viewport grew
       past 900px. This is pinned to the established 390px and 1920px sizes and
       interpolates everything between. */
    font-size: clamp(30px, 24.7px + 2.57vw, 74px);
    line-height: 1.03;
    letter-spacing: -0.038em;
    color: var(--ink);
  }
  /* Words stay in nowrap wrappers so a multi-line heading breaks between
     words, not between letters, once every glyph is its own inline-block. */
  .hp-hero__word { display: inline-block; white-space: nowrap; }
  /* Same mechanism one level up: a run of words that must not be split from
     each other, so the statement can never end on a single word. */
  .hp-hero__keep { white-space: nowrap; }
  .hp-hero__char { display: inline-block; transform: translateZ(0); }

  /* Body measure, so it sets as a paragraph under the statement rather than
     running the full width of the display type above it. The step down from
     the statement is larger than the greeting's step up into it — display type
     dropping to 16-21px body copy needs the optical separation — but it is
     still a fraction of the open field below, so the paragraph belongs to the
     copy above it and not to the rule beneath.
     One flat tone all the way through, and it is the body grey rather than
     white: `--ink-1` on `--bg` measures 10.8:1, so the whole paragraph clears
     WCAG AA with room to spare at every size the clamp produces. */
  .hp-hero__support {
    margin: clamp(10px, 1.4vh, 18px) 0 0;
    max-width: 46ch;
    font-size: clamp(16px, 1.3vw, 21px);
    line-height: 1.5;
    letter-spacing: -0.011em;
    color: var(--ink-1);
  }
  /* The closing band: the hairline and the cue under it, and nothing else.
     The cue sits on the same left axis as the copy, so the whole hero reads
     down one column — greeting, statement, paragraph, rule, cue — instead of
     the eye being thrown to the opposite corner at the end of it. */
  .hp-hero__lower {
    grid-row: 4;
    position: relative;
    display: flex;
    align-items: flex-end;
    padding-top: clamp(20px, 2.8vh, 34px);
    border-top: 1px solid var(--rule);
  }

  /* Scroll cue. Purely typographic — a tracked-out label and an arrow, no
     container. The ring it used to sit in was the only circle anywhere on the
     page and it read as a button the cue is not. Weight now comes from the
     type: a heavier, larger, brighter label and a bigger arrow, so the corner
     is still held down and the bottom band keeps its second anchor. */
  .hp-hero__cue {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: clamp(11px, 0.95vw, 16px);
    /* No ring means no 44px box; the tap target has to be declared. */
    min-height: 44px;
    padding: 0;
    background: none;
    border: 0;
    font-family: var(--ff-body);
    font-size: clamp(12px, 0.85vw, 14px);
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-2);
    cursor: pointer;
    transition: color 0.3s ease;
  }
  .hp-hero__cue:hover { color: var(--ink); }
  .hp-hero__cue-arrow {
    display: block;
    width: clamp(19px, 1.55vw, 25px);
    height: clamp(19px, 1.55vw, 25px);
    color: var(--ink);
    /* Constant velocity, symmetric fade. The old loop eased the whole cycle,
       which made the arrow crawl where it was invisible and dart where it was
       not — that was the "weird". Linear timing plus fades of equal length at
       both ends gives one calm continuous drift, and because the arrow is
       fully transparent at both extremes the wrap point cannot be seen. */
    animation: hp-cue-drift 3.2s linear infinite;
  }
  .hp-hero__cue-arrow svg { width: 100%; height: 100%; display: block; }
  @keyframes hp-cue-drift {
    0%   { transform: translateY(-60%); opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(60%); opacity: 0; }
  }

  /* ---------- WORDMARK (3 rows converge → scale down) ----------
     Motion, scale values and scroll cost are locked; only the mechanism has
     changed. The section used to be 100vh and was held in place by GSAP
     writing a transform to it on every scroll update. Inside a custom
     overflow-y:auto scroller that transform is a main-thread write racing a
     compositor-thread scroll, which is what made it shake.

     Now the section is simply tall — 100vh of stage plus the 320vh the
     animation is scrubbed over, matching the old pin distance exactly — and
     the stage inside it is position:sticky. The compositor holds the stage
     still on its own, with no JS in the loop, and GSAP is left doing the one
     thing it is good at here: mapping scroll position onto the timeline. */
  .hp-wordmark {
    position: relative;
    width: 100%;
    height: 420vh;
    background: #0a0a0c;
  }
  .hp-wordmark__stage {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Has to live on the stage, not the section: an overflow other than
       visible on an ancestor would make that ancestor the sticky element's
       scrollport and kill the stick entirely. */
    overflow: hidden;
    background: #0a0a0c;
  }
  /* Reduced motion gets the mark as a static composition, so the section
     costs one screen of scroll instead of four with nothing happening. */
  .hp-wordmark--static { height: 100vh; }
  .hp-wordmark__inner {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* Promote to its own compositing layer so the scale-down is GPU
       interpolated rather than re-rasterising glyphs every frame. */
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
  }
  .hp-wordmark__row {
    position: relative;
    width: 100%;
    text-align: center;
    font-family: var(--ff-display);
    font-weight: 800;
    /* "Selected Work" sets ~6.5x its own font-size wide and must not be
       clipped, so the vw term is what keeps it inside the viewport: 13.5vw
       fills ~87% of the width. The vh term only engages on genuinely short
       viewports (landscape phones), where three rows at the vw size would
       otherwise be taller than the section and get sliced top and bottom.
       There is deliberately no px floor — a fixed floor overflows narrow
       screens, which is what clipped the mark below ~470px. */
    font-size: min(13.5vw, 28vh, 210px);
    line-height: 1;
    letter-spacing: -0.05em;
    color: #fff;
    white-space: nowrap;
    background: #0a0a0c;
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
  }
  /* Middle row sits above the outer two so they slide in behind it. */
  .hp-wordmark__row:nth-child(2) { z-index: 2; }

  /* ---------- CASE STUDY CARDS ----------
     Each card is one image the owner supplied, with three pieces of text laid
     into the empty area she left at the top of it.

     Nothing here draws a card any more. The colour, the rounded corners, the
     browser window and its chrome, the phone composition and every shadow are
     baked into her artwork, so the only work left is to place her image and put
     the tags, the sentence and the arrow back where she had them in the
     composite. Anything this stylesheet drew over that would be a second
     designer's opinion arriving uninvited, which is what the previous version
     of this section had become.

     The cards scroll normally. There is no pin and no sticky stack: the card
     nearest the middle of the screen is at full size and the others sit
     smaller. That is a scroll-linked transform on an element that is not trying
     to hold still, and the distinction is the whole reason it is safe here. The
     wordmark shook for months because JS wrote a transform to keep something
     stationary inside this compositor-scrolled container, where a main-thread
     write races a compositor-thread scroll; on a stationary element that race
     is visible as jitter, on a scale it is not. */
  .hp-cases {
    /* The card fills the shell again. Nothing constrains it from the height
       any more: the width cap that used to live here existed only so three
       cards could stack inside one viewport, and there is no stack. */
    --card-w-px: min(
      calc(min(100vw, var(--shell)) - 2 * var(--pad-x)),
      1120px
    );
    --card-w: min(100%, 1120px);
    /* 56/1760 of the card, taken from --card-w-px rather than in cqw because
       this applies to the query container itself, where container units resolve
       against an ancestor container instead of against the element.
       It has a second job now. Her artwork's corners are rounded against black
       rather than against transparency, so the card has to clip them or three
       near-black wedges sit on the page's #0a0a0c. Her baked radius measures
       30-32px of 1024 (0.030 of the width) and this is 0.0318, so the clip
       lands just outside her curve and no black survives at the corner. */
    --card-r: max(16px, calc(var(--card-w-px) * 0.031818));
    --card-gap: clamp(26px, 6.5vh, 78px);
    /* Overlay geometry, declared here so the card and its descendants share one
       source for the description's legibility floor. */
    --sp-desc-floor: 19px;
    --sp-desc-ratio: 0.03636;    /* 64 / 1760 */

    max-width: var(--shell);
    margin: 0 auto;
    /* Top padding clears the fixed nav pill, which is 106px deep at desktop, 82
       at tablet and 72 on a phone, so the first card does not arrive already
       underneath it. */
    padding: clamp(80px, 12vh, 132px) var(--pad-x) clamp(24px, 6vh, 80px);
  }

  .hp-case {
    /* The card is the containment context for its own contents, so every value
       in the overlay is a share of the card rather than a pixel size that only
       happens to be right at the 1760px reference width. 1cqw is 1% of the
       card, so a spec value converts as value / 17.6. Container units are used
       on the card's DESCENDANTS only; on the query container itself they
       resolve against an ancestor container, which is why the radius above
       comes from --card-w-px instead. */
    container-type: inline-size;
    position: relative;
    width: var(--card-w);
    margin: 0 auto var(--card-gap);
    border-radius: var(--card-r);
    overflow: hidden;
    /* The carousel scales this element, so it gets its own compositing layer
       and the scale is interpolated rather than re-rasterising the artwork
       every frame. */
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
  }
  .hp-case:last-child { margin-bottom: 0; }

  /* Her artwork, whole and unaltered, at its own aspect. width and height are
     on the tag too, so the box is reserved at the right shape before the file
     arrives and a lazily-loaded card further down cannot shift the page when it
     lands. */
  .hp-case__art {
    display: block;
    width: 100%;
    height: auto;
  }

  /* One link over the whole card, so the hit area is the artwork and not just
     the words on it. The accessible name comes from aria-label rather than from
     the contents, which would otherwise read out as one long run.

     The overlay geometry, once, as shares of the card. Every number is the
     Figma value at the 1760px reference divided by 17.6, which is also what her
     composite measures: its cards are 330px wide with the chip row starting
     24px in, and 24/330 is 7.27% against this 7.386%.

     The max() floors are what keep the card usable on a phone: a 346px-wide
     card would otherwise set the description at 12.6px and the chip border at
     0.5px. Above roughly a 520px card the proportions govern and the floors
     never engage.

     Where a value is a share of TYPE rather than of the card it is written in
     em, so it survives the floors intact: the chip's 12/24px padding is 0.6em
     and 1.2em of its own 20px label, and its border is 0.125em of the same.
     Those ratios hold exactly at every size, floored or not, which px or cqw
     could not do. */
  .hp-case__link {
    --sp-pad: max(22px, 7.386cqw);       /* 130px */
    --sp-gap: max(18px, 6.818cqw);       /* 120px, text column -> arrow */
    --sp-headgap: max(14px, 2.727cqw);   /* 48px, tags -> description */
    /* Written from the properties the wrapper declares rather than as literals,
       so the floor is stated in one place. 0.03636 * 100cqw is 3.636cqw, the
       spec's 64/1760. */
    --sp-desc: max(var(--sp-desc-floor), calc(var(--sp-desc-ratio) * 100cqw));
    --sp-tag: max(12px, 1.136cqw);       /* 20px */
    --sp-arrow: max(26px, 4.091cqw);     /* 72px */
    --sp-textcol: 74.318cqw;             /* 1308px */

    display: block;
    color: var(--card-ink);
    text-decoration: none;
  }
  /* Inset so the ring is not clipped away by the card's own overflow:hidden,
     and in the card's ink so it stays visible on the pale card. */
  .hp-case__link:focus-visible {
    outline: 3px solid var(--card-ink);
    outline-offset: -5px;
  }

  /* The head is a row: the text column on the left, the arrow held at the top
     right, both sitting on the flat colour she left clear.
     Absolutely positioned, so it lies in the cleared band without taking part
     in the card's height — the card is exactly as tall as her artwork. Its
     inset is --sp-pad on three sides, which is the spec's 130/1760 and also
     what her composite measures: 24px in from the edge of a 330px card, or
     7.27% against this 7.386%. */
  .hp-case__head {
    position: absolute;
    z-index: 2;
    top: var(--sp-pad);
    left: var(--sp-pad);
    right: var(--sp-pad);
    display: flex;
    align-items: flex-start;
    gap: var(--sp-gap);
  }
  .hp-case__head-text {
    flex: 1 1 auto;
    min-width: 0;
    max-width: var(--sp-textcol);
    display: flex;
    flex-direction: column;
    gap: var(--sp-headgap);
  }

  /* The card is a link to the case study and nothing else says so, now that
     there is no visible title. The arrow used to leave the frame along its own
     diagonal with a second copy following it in from the opposite corner; the
     owner found that odd to watch and asked for it to just move up a little on
     hover, so it does exactly that and nothing else.
     One glyph, one property, one short move. The distance is a share of the
     arrow with a small floor, so it stays proportionate on a 72px arrow and
     stays perceptible on a floored 26px one. */
  .hp-case__arrow {
    flex: 0 0 auto;
    width: var(--sp-arrow);
    height: var(--sp-arrow);
    color: var(--card-ink);
    transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
  }
  .hp-case__arrow svg { width: 100%; height: 100%; display: block; }
  /* The whole card is the link, so hovering anywhere on it moves the arrow, and
     keyboard focus gets the same feedback as the pointer. */
  .hp-case__link:hover .hp-case__arrow,
  .hp-case__link:focus-visible .hp-case__arrow {
    transform: translateY(calc(-1 * max(4px, 0.34cqw)));
  }

  /* Real heading, kept out of the picture. The reference carries the project
     name only in the bold phrase of the sentence, but the document outline,
     search engines and heading navigation all still need an h2. */
  .hp-case__title {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* Outlined chips, replacing the solid per-card pills. The font-size is set
     on the row so the chips' own padding, gap and border can all be em and
     therefore hold their ratio to the label at any size. */
  .hp-case__tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8em;                       /* 16px against a 20px label */
    margin: 0;
    font-size: var(--sp-tag);
  }
  .hp-case__tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.6em 1.2em;             /* 12px / 24px */
    border: max(1.25px, 0.125em) solid var(--card-ink);   /* 2.5px */
    border-radius: 99999px;
    background: transparent;
    color: var(--card-ink);
    font-family: var(--ff-body);
    font-size: 1em;
    font-weight: 500;
    line-height: 1.2;                 /* 24px against 20px */
    letter-spacing: -0.004em;
    text-align: center;
    white-space: nowrap;
  }

  /* With no visible title this sentence IS the card's headline. The spec sets
     it at 400 rather than the 700 it carried before, so it reads considerably
     lighter — that is the spec's intent, not a regression.
     Inter, not Manrope: the spec asks for 'Helvetica Neue', which is not loaded
     here and is not dependable off macOS. Inter is the neo-grotesque already on
     the page and the closest thing to what the spec draws. Manrope at 400 and
     this size would not match it — its geometry is much rounder. */
  .hp-case__desc {
    margin: 0;
    /* No measure of its own: the sentence fills the text column. The old
       16.52em (the spec's 1057px against a 64px size) is 60% of the card, and
       measuring her composite shows her own longest line running to 74.5% —
       the full width of the column. That difference is not cosmetic: at 60%
       both British Cycling and Sofa to Saddle wrap to four lines where her
       artwork has three, and the fourth line is what pushed the text out of
       the area she cleared for it and onto her mockup. */
    font-family: var(--ff-body);
    font-size: var(--sp-desc);
    line-height: 1.1875;              /* 76 / 64 */
    letter-spacing: -0.004em;
    font-weight: 400;
    color: var(--card-ink);
  }
  /* The project name stays lifted out of the sentence, as in the spec's own
     screenshot. Against a 400 run, 600 is the step that reads as emphasis
     without turning the phrase into a different voice. */
  .hp-case__desc strong { font-weight: 600; color: inherit; }

  /* ---------- FOOTER ---------- */
  .hp-footer {
    /* The footer's own gutter, so the two rules can align to the content
       column without restating the value. It is --pad-x everywhere except the
       phone band, which sets its own tighter gutter. */
    --foot-x: var(--pad-x);
    min-height: 86vh;
    padding: clamp(80px, 12vh, 160px) var(--foot-x) clamp(32px, 4vh, 52px);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--bg);
    max-width: var(--shell);
    margin: 0 auto;
  }
  /* The rule that opens the footer. It was the element's own border-top, which
     put it edge to edge across the viewport and made it a division of the
     window rather than of the page. It is the content column instead: one
     gutter in on each side, so it begins and ends where the eyebrow, the
     headline, the buttons and the copyright row do.
     It was tried three gutters short on the right, and it was wrong — a line
     that stops inside the row it heads reads as having fallen short of it,
     not as having been placed. The column is the page's own measure and it is
     not the window's: at the top of the range the footer is capped at --shell
     and centred, so the rule is 70% of a 1920 screen with 290px of page either
     side of it, and below that cap it is the gutter that holds it off the
     edge.
     Absolutely positioned rather than a flex child: the footer is a centred
     flex column, so a real element would take part in the distribution and
     move everything under it. */
  .hp-footer::before {
    content: '';
    position: absolute;
    top: 0;
    left: var(--foot-x);
    right: var(--foot-x);
    height: 1px;
    background: var(--rule);
  }
  .hp-footer__title {
    margin: clamp(22px, 3vh, 40px) 0 0;
    font-family: var(--ff-display);
    font-size: clamp(52px, 8.4vw, 148px);
    line-height: 0.92;
    letter-spacing: -0.048em;
    font-weight: 800;
    color: var(--ink);
    max-width: 12ch;
  }
  /* The lede is the only thing between the headline and the buttons, so it
     carries the interval on both sides itself. It used to sit in the left
     column of a two-column band with a Based / Open to list beside it; the
     list was removed as duplication — the sentence already says both — and a
     grid with one item in it is not structure, so the wrapper went with it. */
  .hp-footer__lede {
    margin: clamp(40px, 6vh, 80px) 0 clamp(36px, 5vh, 60px);
    /* 50ch, up from 40ch, on the owner's instruction: at 40ch these 163
       characters set in four lines from 901px up and she wants three. The
       measure is the only thing widened — the size curve is untouched, because
       shrinking the type to make the count is the one way of hitting it that
       makes the paragraph worse.
       50ch is where three lines starts, and it is not overshot on purpose: it
       sets ~63/65/35 characters, and the top of a comfortable measure for body
       copy is around 75. Anything wider buys nothing — the line count cannot go
       below three at this length — and costs the reader the return sweep. The
       measure is in ch, so it tracks the font-size curve and the count holds at
       every desktop width rather than at the one it was tuned on. */
    max-width: 50ch;
    font-size: clamp(17px, 1.35vw, 22px);
    line-height: 1.5;
    letter-spacing: -0.011em;
    color: var(--ink-1);
  }
  .hp-footer__lede strong { color: var(--ink); font-weight: 500; }
  .hp-footer__ctas {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .hp-footer__cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    padding: 18px 24px;
    background: #fff;
    color: #0a0a0c;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.005em;
    text-decoration: none;
    transition: transform 0.4s cubic-bezier(0.32,0.72,0,1);
  }
  .hp-footer__cta.is-ghost {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .hp-footer__cta:hover { transform: translateY(-3px); }
  .hp-footer__cta-arrow { display: inline-flex; align-items: center; }
  .hp-footer__cta-arrow svg { width: 16px; height: 16px; display: block; }

  /* The bar closing the footer, with its hairline back above it at the owner's
     request. The interval is the one it had before the rule was briefly
     removed: 56-110px of margin above the line and 20-28px between the line
     and the copyright, roughly 4:1. While there was no rule the margin was
     raised to 88-160px to stand in for it; leaving it there now would have the
     line floating in the middle of a void of its own instead of closing the
     button group and opening the fine print. */
  .hp-footer__base {
    /* One value, used twice: it is the gap under the rule, and the distance
       the rule has to travel back up to sit on the bar's top edge. */
    --base-gap: clamp(20px, 2.4vw, 28px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    /* The bar is widened to the footer's full width and given the gutter back
       as padding, so its content sits in the same column it always did. The
       reason is the rule below: its insets are measured from whatever box it
       is positioned in, and both rules have to be measured from the same one
       or they cannot come out the same length. From a bar the width of the
       column, a gutter of inset would put the line a gutter inside the column
       rather than on it.
       It also makes that immune to the reveal: GSAP puts a transform on this
       bar, which silently turns it into the containing block for the line, so
       the line would otherwise be one length before the footer animates in and
       another afterwards. */
    margin-left: calc(-1 * var(--foot-x));
    margin-right: calc(-1 * var(--foot-x));
    margin-top: clamp(56px, 9vh, 110px);
    padding: var(--base-gap) var(--foot-x) 0;
    font-size: 13px;
    letter-spacing: -0.003em;
    color: var(--ink-3);
  }
  /* The same geometry as the rule at the top of the footer, in the same terms:
     the content column, a gutter in on each side. The two are the only
     horizontal lines here and they sit 480-740px apart, so they have to be
     coextensive or one of them reads as a mistake.
     Spanning the column is what makes this one a bracket rather than a lid:
     the copyright starts exactly under its left end and Back to top finishes
     exactly under its right, so the line closes over the row instead of
     stopping somewhere inside it.
     Vertically it has no `top` of its own — that would be measured from the
     top of the footer, hundreds of pixels away and dependent on how the copy
     above it wrapped. It takes its static position instead, which for an
     absolutely positioned child of a flex container is where it would sit as
     the only flex item: align-self pins that to the start rather than the
     centre the bar aligns its real items on, landing the line on the top of
     the bar's content, and the translate lifts it back over the padding onto
     the bar's edge. A transform, not a negative margin: margins are dropped on
     an absolutely positioned box that is taking its static position. */
  .hp-footer__base::before {
    content: '';
    position: absolute;
    align-self: flex-start;
    transform: translateY(calc(-1 * var(--base-gap)));
    left: var(--foot-x);
    right: var(--foot-x);
    height: 1px;
    background: var(--rule);
  }
  .hp-footer__top {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 0;
    background: none;
    border: 0;
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    transition: color 0.25s ease;
  }
  .hp-footer__top:hover { color: var(--ink); }
  .hp-footer__top svg { width: 14px; height: 14px; display: block; }

  /* ---------- Responsive ----------
     Four width bands plus a small-phone trim:

       >  1100      desktop — the composition every other band steps down from
       901 – 1100   narrow desktop / landscape tablet: the split case stacks
       601 –  900   tablet portrait: desktop structure at tablet scale
       401 –  600   phone
       <=   400     small phone (nav only)

     601–900 previously inherited the phone rules, so a 768px iPad was styled
     as a 390px phone: phone gutters, phone type, a single-column approach grid
     and two of the four device shots. It is now its own band.

     Anything that can be one continuous curve — the hero statement, the
     wordmark, the device row — is handled with clamp()/min() in the base rules
     rather than restated per band, so there are no size jumps at the seams. */
  /* Shared by tablet and phone. */
  @media (max-width: 900px) {
    /* Fills ~94% of the width instead of ~104%, which is what clipped the
       mark at every width below 900px. */
    .hp-wordmark__row { font-size: min(14.5vw, 28vh, 150px); }
  }

  /* ---------- Tablet portrait ---------- */
  @media (min-width: 601px) and (max-width: 900px) {
    .hp-nav { top: 20px; gap: 16px; padding: 8px 10px 8px 12px; }
    .hp-nav__brand { padding-right: 16px; gap: 12px; }
    .hp-nav__avatar { width: 44px; height: 44px; }
    .hp-nav__name { font-size: 16px; }
    .hp-nav__link { padding: 12px 14px; font-size: 14px; gap: 6px; }
    .hp-nav__arrow svg { width: 14px; height: 14px; }

    .hp-hero { padding: clamp(112px, 14vh, 164px) var(--pad-x) clamp(32px, 4.5vh, 52px); }
    .hp-hero__statement { max-width: 26ch; }

    /* The nav pill is shallower here, so the cards can start higher. */
    .hp-cases { padding-top: clamp(64px, 10vh, 104px); }
    /* No card type overrides in this band: the overlay scales itself from the
       card's own width, so a tablet gets the same proportions as a desktop
       rather than a separately tuned size that has to be kept in step. */

    .hp-footer { min-height: 0; }
    .hp-footer__title { font-size: clamp(60px, 10vw, 92px); }
    /* The 56ch override is gone: the base measure is now 50ch, which is wider
       than the 40ch this band existed to escape and narrower than the 56ch it
       used. At 56ch this band was already setting three lines, but as 66/78/17
       — a 78-character line and a three-word widow. The same copy at 50ch sets
       63/65/35 here, so the band inherits both a better rag and one fewer rule
       to keep in step with the desktop. */
  }

  /* ---------- Phone ---------- */
  @media (max-width: 600px) {
    .hp-nav {
      top: 14px;
      gap: 10px;
      padding: 6px 6px 6px 10px;
      max-width: calc(100vw - 24px);
    }
    .hp-nav__brand { padding-right: 12px; gap: 10px; }
    .hp-nav__avatar { width: 36px; height: 36px; }
    .hp-nav__name { font-size: 14px; }
    .hp-nav__links { gap: 2px; }
    /* Labels stay. Hiding them left two identical arrow glyphs with no way to
       tell CV from LinkedIn — the arrow is the decoration, not the label. */
    .hp-nav__link {
      min-width: 44px;
      padding: 11px 12px;
      font-size: 13px;
      gap: 0;
    }
    .hp-nav__arrow { display: none; }

    /* Tighter spacer floors than the desktop rhythm: on a phone the hero is
       close to content-height already, and a generous minimum open field is
       what pushes the cue off the bottom of a small screen. */
    .hp-hero {
      padding: 94px 22px 30px;
      grid-template-rows: 1.5fr auto minmax(24px, 1fr) auto;
    }
    .hp-hero__main { gap: 14px; }
    .hp-hero__greeting { font-size: 15px; }
    /* Size comes from the base clamp; this only tightens the setting. */
    .hp-hero__statement {
      max-width: none;
      line-height: 1.06;
      letter-spacing: -0.032em;
    }
    /* The cue takes the full width so it still reads as the thing holding the
       bottom of the hero rather than a label tucked into a corner. */
    .hp-hero__lower { align-items: stretch; padding-top: 20px; }
    .hp-hero__support {
      margin-top: 16px;
      font-size: 16px;
      line-height: 1.5;
    }
    .hp-hero__cue { justify-content: space-between; width: 100%; }

    .hp-cases {
      /* The description is the whole measure on a phone, so its floor can come
         down a little and still leave it the largest thing on the card. */
      --sp-desc-floor: 17.5px;
      /* A phone card is nearly the full width of the screen, so the same 0.9
         that reads clearly on a desktop is barely a change here — there is no
         surrounding space for the difference to show against. A wider range
         gives the carousel something to say at this size. */
      --card-scale-min: 0.86;
      padding-top: clamp(56px, 9vh, 92px);
      padding-bottom: 64px;
    }
    /* ---- The text comes out of her cleared band on a phone ----
       Her artwork clears the top 35% of the card for the overlay, which is a
       fixed share, so on a 264px-wide card that band is 82px tall. The overlay
       at its proportional size would fit in 69px of it — but at that size the
       description is 9.6px and the chip labels are 3px, which is not type, it
       is texture. The legibility floors exist for exactly that reason, and with
       them the block is 172px: twice the band.

       There is no width that resolves that, so the text stops sharing the
       card's top with the artwork and sits above it instead. The card takes the
       colour she cleared, the head goes back into the flow, and her image
       follows underneath at its own aspect, untouched. Because the top of every
       one of her images is that same flat colour, the join is invisible: what
       the phone shows is her card with a taller clear band, not a different
       composition.

       The artwork is then pulled up by its own cleared band, less one --sp-gap
       to leave the spec's interval between the sentence and the mockup. Two
       reasons, and the second is the one that matters:

         Without it that band becomes dead space. It is 31-37% of the card's
         width of empty colour sitting between the text and the mockup, on top
         of the text's own padding — measured 155px of nothing on a 334px card.

         Her corners are rounded against black rather than against
         transparency, so once the image is not at the top of the card its top
         two corners would show as black notches partway down it. The crop is
         many times the 3% corner radius, so they go with the band.

       Nothing of hers is lost either way: every pixel removed is the flat
       colour the card is already painted in. --art-crop is per card, measured
       from each file, because the three bands are not the same depth. */
    .hp-case { background: var(--card-bg); }
    .hp-case__head {
      position: static;
      display: block;
      padding: var(--sp-pad) var(--sp-pad) 0;
    }
    /* object-fit rather than a negative margin. A negative margin does not crop
       an image, it moves the whole thing up — including the part that is
       supposed to be gone — and since that part is opaque flat colour it lands
       on top of the sentence and paints it out. Giving the box the height the
       cropped image should have and letting cover trim it from the top is the
       only one of the two that actually removes anything. */
    .hp-case__art {
      height: calc((var(--art-ar) - var(--art-crop)) * 100cqw + var(--sp-gap));
      object-fit: cover;
      object-position: center bottom;
    }
    /* The arrow comes out of the flow and sits over the top-right corner
       instead of holding a column open. In the spec's proportions it costs 72
       of 1500 and the sentence never notices; at a 264px card the floored arrow
       plus the gap was taking 44px of a 214px measure, which put the Boots
       sentence on seven lines. The tag row keeps clear of it. */
    .hp-case__head-text { max-width: 100%; }
    .hp-case__arrow {
      position: absolute;
      top: var(--sp-pad);
      right: var(--sp-pad);
    }
    .hp-case__tags { padding-right: calc(var(--sp-arrow) + 8px); }
    /* Stays max() against the proportional value: a floor must never end up
       capping, which is what a bare px would do at the top of this band. */
    .hp-case__link { --sp-arrow: max(24px, 4.091cqw); }

    /* The phone gutter is 22px, not the 28px --pad-x floors at, so the top
       rule has to be told about it or it would start 6px inside the column it
       is meant to align with. Same padding as before, named once. */
    .hp-footer { --foot-x: 22px; min-height: 0; padding: 76px var(--foot-x) 28px; }
    .hp-footer__title { font-size: clamp(46px, 13vw, 76px); }
    /* Left at 52ch against a 16.5px body: on a phone the viewport is the
       measure long before any ch value is, so this only binds from about 585px
       up. Three lines is not physically available below that at a legible
       size, and the instruction is explicitly not to shrink the type to buy
       it, so the copy wraps to whatever the width allows. */
    .hp-footer__lede { margin: 32px 0 30px; max-width: 52ch; font-size: 16.5px; }
    .hp-footer__cta { padding: 15px 20px; font-size: 14px; }
    /* The rule is back here too, so the margin goes back to what it was when
       it last had one to sit above. --base-gap is inherited from the base
       rule, which floors at 20px — right for a 12px bar. */
    .hp-footer__base { margin-top: 46px; font-size: 12px; }
  }
  /* ---------- Short portrait phones: no scroll cue ----------
     Measured, not assumed. The hero's copy block is a fixed content height at
     a given width, and the cue sits under it, so whether the cue clears the
     fold is a question about height. Sweeping the height at each phone width
     puts the cue's bottom edge at:

       320 wide   714px      390 wide   643px      430 wide   630px

     Below those heights the cue was rendering below the fold — present,
     focusable, and invisible, which is worse than absent. 670px is under all
     three of the heights that have room (390x844, 430x932, 393x852 and every
     other current phone keep their cue) and over the heights that do not, and
     it catches the 320x568 case that prompted this. The owner's decision is
     to keep the whole copy at that size and lose the cue rather than shrink
     the type to fit both.

     The width bound is not a second opinion about which screens are small; it
     is there because landscape phones at 601px and up already have their own
     rule below, which moves the cue out of the flow into the empty space
     beside the paragraph rather than removing it.

     display:none, not opacity or visibility: the cue is a button and a link to
     the wordmark, so hiding it has to take it out of the accessibility tree
     and out of the tab order too. It also takes the hairline with it, which is
     the right outcome — the rule exists to give the composition a second
     horizontal edge to close on, and with nothing under it to close on it is
     a line ruled across the bottom of the copy for no reason. What is left is
     the copy block in the grid it already sits in, upper-middle with the open
     field below it, which is what the hero reads as above the fold anyway. */
  @media (max-width: 600px) and (max-height: 670px) {
    .hp-hero__lower { display: none; }
  }

  /* Landscape phones. Height is the scarce dimension and width is the
     plentiful one, so the copy trades one for the other: the statement comes
     off the desktop curve and the support paragraph spends the extra width,
     which keeps both to three lines instead of four.
     Even then there is no room to stack a closing band under the copy — the
     copy block is most of a 390px-tall viewport on its own, and the cue would
     land below the fold, which is the one thing it must never do. So there is
     no void here to anchor and nothing for a rule to close: the copy IS the
     composition, and the cue becomes a corner marker in the space to the right
     of the paragraph that the short measure leaves empty anyway. */
  @media (max-height: 560px) and (min-width: 601px) {
    .hp-hero {
      min-height: 0;
      padding-top: 92px;
      padding-bottom: 24px;
      grid-template-rows: 0fr auto minmax(20px, 1fr) auto;
    }
    .hp-hero__main { gap: 10px; }
    .hp-hero__statement { font-size: clamp(30px, 4.3vw, 46px); }
    .hp-hero__support { margin-top: 10px; max-width: 62ch; }
    .hp-hero__lower {
      position: absolute;
      right: var(--pad-x);
      bottom: 0;
      padding-top: 0;
      border-top: 0;
    }
  }

  /* ---------- Short viewports ----------
     A landscape phone shows about a third of a card at a time, so a card at the
     centre of the screen is most of what is on screen and the two either side
     are barely in it. Scaling on top of that reads as the page breathing rather
     than as a carousel, so the range comes right in and the gap closes up. */
  @media (max-height: 500px) {
    .hp-cases { --card-gap: 22px; --card-scale-min: 0.96; }
  }

  @media (max-width: 400px) {
    .hp-nav { gap: 8px; padding: 6px 5px 6px 8px; }
    .hp-nav__brand { padding-right: 9px; gap: 8px; }
    .hp-nav__name { font-size: 13px; }
    .hp-nav__link { padding: 11px 9px; font-size: 12.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hp-nav { transition-duration: 0.01ms; }
    .hp-footer__cta,
    .hp-nav__arrow { transition-duration: 0.01ms; }

    /* The carousel is scroll-coupled movement, so it is dropped rather than
       merely slowed: every card sits at its natural size, with no scale written
       to it by anything. The JS that drives it does not run at all under
       reduced motion, and this is the belt to that pair of braces — it also
       clears the translateZ(0) promotion, which is only there to give the scale
       a compositing layer it no longer needs. */
    .hp-case {
      transform: none;
      will-change: auto;
      transition: none;
    }
    /* The arrow's hover move is movement for its own sake, so it goes entirely
       rather than being sped up. What is left is exactly what a touch device
       with no hover shows, so the state that has to read correctly on its own
       is the one being tested here. */
    .hp-case__arrow { transition: none; }
    .hp-case__link:hover .hp-case__arrow,
    .hp-case__link:focus-visible .hp-case__arrow { transform: none; }
    /* No loop, but the arrow still has to be visible and legible — the
       keyframes start and end at opacity 0. */
    .hp-hero__cue-arrow {
      animation: none;
      transform: none;
      opacity: 1;
    }
  }
</style>

<script>
(function() {
  var VERSION = 'v55';
  console.log('HP ' + VERSION + ' loading...');
  document.documentElement.classList.add('hp-active');

  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var ARROW_NE = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 17L17 7M8 7h9v9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ARROW_UP = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ARROW_DOWN = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5v14M19 12l-7 7-7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  // Same glyph as the nav's, drawn for size: at 72px a stroke of 2 in a 24 box

    var container = document.createElement('span');

      span.className = className;

      Array.prototype.slice.call(node.childNodes).forEach(function(child) {

            for (var i = 0; i < part.length; i++) host.appendChild(charSpan(part.charAt(i)));

  // without needing scroll. Deliberately a different gesture from the wordmark.
  function initHeroCursorField() {
    if (typeof gsap === 'undefined' || REDUCED) return;
    if (window.matchMedia('(hover: none)').matches) return;

    var chars = Array.prototype.slice.call(document.querySelectorAll('.hp-hero__char'));
    var hero = document.getElementById('hp-hero');
    if (!chars.length || !hero) return;

    var RADIUS = 165;
    var LIFT = 16;

    var items = chars.map(function(el) {
      return {
        el: el,
        setY: gsap.quickTo(el, 'y', { duration: 0.55, ease: 'power3' }),
        setScale: gsap.quickTo(el, 'scale', { duration: 0.55, ease: 'power3' }),
        cx: 0,
        cy: 0,
        last: 0

      items.forEach(function(it) {
        var r = it.el.getBoundingClientRect();
        it.cx = r.left + r.width / 2;
        it.cy = r.top + r.height / 2;
      });
    }
    measure();

    var mx = -9999, my = -9999, queued = false;

    function apply() {
      queued = false;
      items.forEach(function(it) {
        var dx = mx - it.cx;
        var dy = my - it.cy;
        var falloff = 0;
        // Cheap reject before the sqrt — most glyphs are out of range on a
        // statement this long, and there are well over a hundred of them.

            // Ease the falloff so the effect has a soft shoulder, not a cone.

        if (falloff === 0 && it.last === 0) return;
        it.last = falloff;
        it.setY(-LIFT * falloff);
        it.setScale(1 + 0.06 * falloff);
      });

      mx = e.clientX;
      my = e.clientY;
      if (!queued) { queued = true; requestAnimationFrame(apply); }
    }, { passive: true });

    hero.addEventListener('mouseleave', function() {
      mx = my = -9999;
      apply();
    });

    function scheduleMeasure() {
      clearTimeout(remeasure);
      remeasure = setTimeout(measure, 150);
    }

    if (root) root.addEventListener('scroll', scheduleMeasure, { passive: true });

        gsap.set(outer, { xPercent: 100, yPercent: 0 });
        gsap.set(rows[1], { xPercent: -100 });
        gsap.set(inner, { scale: 1 });

        gsap.timeline({
          defaults: { force3D: true },
          scrollTrigger: {
            trigger: wordmark,
            start: 'top top',
            end: 'bottom bottom',
            invalidateOnRefresh: true,
            // No smoothing. Interpolation only made sense as compensation for
            // a pin that was already lagging; with the pin off the main
            // thread it just adds its own lag and lets the mark drift on
            // after the scroll has stopped.
            scrub: true
          }
        })
          // 1 — rows slide in from alternating sides
          .to(outer,   { xPercent: 0, duration: 1, ease: 'none' }, 0)
          .to(rows[1], { xPercent: 0, duration: 1, ease: 'none' }, 0)
          // 2 — outer rows converge behind the middle row
          .to(rows[0], { yPercent: 100,  duration: 1, ease: 'power1.inOut' }, 1.15)
          .to(rows[2], { yPercent: -100, duration: 1, ease: 'power1.inOut' }, 1.15)
          // 3 — the collapsed mark shrinks away
          .to(inner, {
            scale: window.innerWidth <= 900 ? 0.34 : 0.2,
            duration: 1.2,
            ease: 'power2.inOut'
          }, 2.35);
      }
    }

    // ---------- CASE CARDS: the carousel ----------
    // The card nearest the middle of the screen is at full size and the ones
    // above and below it sit smaller, so scrolling the section reads as moving
    // through a set rather than down a list.
    //
    // Two rules govern how this is allowed to be built, and they come from the
    // wordmark's long-standing shake:
    //
    //   1. Nothing is pinned. This scales a card that is scrolling normally.
    //      The shake happened because a transform was being written on the main
    //      thread to hold an element STILL against a compositor-thread scroll,
    //      and any lag in that race shows up as jitter. A scale on a moving
    //      element has no such reference to disagree with.
    //   2. transform only. No width, no height, no top, no margin — nothing
    //      that would put the card back through layout on a scroll frame.
    //
    // The timeline runs from the card entering the bottom of the viewport to it
    // leaving the top, so its midpoint is exactly the moment the card's centre
    // passes the viewport's centre. That is the "distance from centre" the
    // effect is described by, expressed as scroll progress rather than measured
    // per frame in JS.
    var cards = Array.prototype.slice.call(document.querySelectorAll('.hp-case'));
    var casesEl = document.getElementById('hp-cases');
    // Owned by the stylesheet, so the value that ships and the value that is
    // audited are the same value, and so the phone band can widen the range
    // without JS knowing which band it is in.
    var scaleMin = casesEl
      ? parseFloat(getComputedStyle(casesEl).getPropertyValue('--card-scale-min'))
      : 0.9;
    if (!(scaleMin > 0) || scaleMin > 1) scaleMin = 0.9;

    cards.forEach(function(card) {
      // One-shot entrance for the text. once:true, so it costs nothing per
      // scroll frame. The artwork is not faded in separately any more — it is
      // the card, and fading the card in under a carousel that is already
      // scaling it is two effects arguing.
      reveal(card, [
        { els: [card.querySelector('.hp-case__head')], y: 24, duration: 0.9 }
      ]);

      if (REDUCED) return;

      // Eased at both ends rather than linear, so the card is close to full
      // size for the whole time it is the one you are looking at and does its
      // growing while it is still arriving. A linear ramp makes the size change
      // constantly under the cursor, which reads as drift.
      gsap.timeline({
        defaults: { force3D: true },
        scrollTrigger: {
          trigger: card,
          start: 'top bottom',
          end: 'bottom top',
          invalidateOnRefresh: true,
          scrub: true
        }
      })
        .fromTo(card,
          { scale: scaleMin },
          { scale: 1, duration: 1, ease: 'power2.out' }, 0)
        .to(card, { scale: scaleMin, duration: 1, ease: 'power2.in' }, 1);
    });

    // ---------- FOOTER ----------
    var footer = document.getElementById('hp-footer');
    if (footer) {
      reveal(footer, [
        { els: footer.querySelectorAll('.hp-eyebrow--rule, .hp-footer__title'), y: 30, stagger: 0.1 },
        { els: footer.querySelectorAll('.hp-footer__lede, .hp-footer__ctas, .hp-footer__base'), y: 24, stagger: 0.09, at: 0.3 }
      ]);
    }

    ScrollTrigger.refresh();

    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() { ScrollTrigger.refresh(); }, 180);
    });
  }

  function init() {
    try {
      build();
      revealNav();
      initBackToTop();
      initCue();
      initHero();          // starts the cursor field once the entrance lands
      initScrollScenes();

      // Webfont metrics change where the description wraps, which changes how
      // tall a card's text block is; the carousel's start and end are measured
      // from the card, so the triggers have to be recomputed once the fonts are
      // in. Nothing is re-measured by hand any more — the card takes its height
      // from the artwork's own aspect, which does not depend on the fonts.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() {
          if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh();
        });
      }
      console.log('HP ' + VERSION + ' ready');
    } catch (err) {
      console.error('HP ' + VERSION + ' error:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
