<style>
  html.hp-active, html.hp-active body {
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    height: 100vh !important;
    background: #0a0a0c !important;
    color: #f5f5f5 !important;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .hp-root {
    /* ---------- TYPE SYSTEM ----------
       Two families, no third. One governing rule, applied to every element on
       this page:

         DISPLAY  → Manrope. Every headline and every word set above ~28px:
                    the hero statement, the wordmark, case titles, section
                    ledes, the footer line. 800 for short headlines, 700 for
                    multi-line statements so long runs don't go blobby.
                    The hero statement is the exception and takes 500: it is
                    the longest run of display type on the page, and at four
                    sentences the weight that stops a headline going blobby is
                    itself the thing making it a wall. Nothing else varies
                    inside it — one weight, one size, one colour — because the
                    blank line at hp-hero__sentence does the separating.
         BODY/UI  → Inter. Every sentence you actually read, plus all labels,
                    eyebrows, tags, nav and buttons. Where a sentence needs a
                    word lifted out of it, that is Inter 500 in full white.

       There is no serif and no accent face. Instrument Serif italic used to
       carry one phrase per section; the sections that held those phrases were
       deleted or reset one at a time until the footer's "talk." was the last
       one on the page, and that word is now Manrope too. The family has been
       dropped from the Google Fonts request as well as from the stylesheet —
       an unused font file is a real download, not a spare part. */
    --ff-display: 'Manrope', 'Inter', -apple-system, sans-serif;
    --ff-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

    --bg: #0a0a0c;
    --ink: #ffffff;
    --ink-1: rgba(255,255,255,0.74);
    --ink-2: rgba(255,255,255,0.52);
    --ink-3: rgba(255,255,255,0.40);
    --rule: rgba(255,255,255,0.10);

    --pad-x: clamp(28px, 6vw, 110px);
    --shell: 1560px;

    position: fixed;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--bg);
    z-index: 999999;
    font-family: var(--ff-body);
  }
  .hp-root * { font-family: inherit; box-sizing: border-box; }

  /* ---------- Shared primitives ---------- */
  .hp-eyebrow {
    display: block;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
  }
  .hp-eyebrow--rule {
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .hp-eyebrow--rule::before {
    content: '';
    width: 28px;
    height: 1px;
    background: rgba(255,255,255,0.3);
  }

  /* ---------- NAV (floating pill) ----------
     Content-width and centred at every width: no width is set anywhere, so the
     pill is only ever as long as the brand and the links inside it. The phone
     block's max-width is a guard against the screen edges, not a width.

     It should not be stretched to the page's column at any breakpoint. A pill
     wide enough to push the two groups to opposite ends leaves the brand divider
     stranded after her name, separating a group from a few hundred pixels of
     nothing, and the two ends stop reading as a pair. Hugging is what keeps the
     divider doing its job. */
  .hp-nav {
    position: fixed;
    top: 28px;
    left: 50%;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 24px;
    /* Left padding equals the vertical padding, which is what makes the space
       around the avatar even rather than merely equal-looking in the stylesheet.
       The pill's ends are fully round, so the end cap's radius is half the height,
       which is the avatar's radius plus this padding. The avatar is therefore
       concentric with the cap only when the left padding matches the vertical one,
       and then the gap is the same at the far left as it is above and below.

       At 12px vertical against 16px left it was not: 13px over and under, 17px at
       the extreme left, and because the cap curves away between the two the gap
       visibly pinched at the avatar's upper-left shoulder. Both are 15px now, so
       the surround is a constant 16px around the whole end.

       15 against a 46px avatar, down from 18 against 52: the pill was 90px deep
       and read as a bar rather than as something floating over the page. The two
       numbers move together or not at all — dropping the padding alone would
       leave the avatar 3px off the centre of the round end.

       This only holds while the avatar is the tallest thing in the row. Below
       900px the link's 44px tap-target floor is taller than the avatar, so it is
       centred in the row and the left padding has to carry that offset too; see
       those blocks. */
    padding: 15px 11px 15px 15px;
    background: rgba(18,18,22,0.55);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 999px;
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.07),
      0 32px 80px -16px rgba(0,0,0,0.55),
      0 6px 24px rgba(0,0,0,0.28);
    opacity: 0;
    transform: translate(-50%, -16px);
    transition: opacity 0.9s cubic-bezier(0.32,0.72,0,1), transform 0.9s cubic-bezier(0.32,0.72,0,1);
  }
  .hp-nav.is-ready { opacity: 1; transform: translate(-50%, 0); }

  .hp-nav__brand {
    display: flex;
    align-items: center;
    gap: 14px;
    /* Closes the brand group, and sits the same distance from her name as it does
       from `CV`. That distance is not one value: on the name's side it is this
       padding, but on the label's side it is the pill's gap plus the link's own
       left padding, 24 + 18 here. Setting the padding to 24 made the two inputs
       look equal in the stylesheet while the line sat 18px off centre between the
       two words, which is why this is 42 and why it is derived rather than
       matched by eye. Both inputs step down with the pill, so there is a value
       per breakpoint; if either moves, this moves with it.

       It also costs the two arrows room on a phone — this padding plus the rule
       itself — which is why the width the arrows are dropped at is measured with
       it in place, not without. */
    padding-right: 42px;
    border-right: 1px solid rgba(255,255,255,0.09);
  }
  .hp-nav__avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(255,255,255,0.16);
    display: block;
  }
  .hp-nav__name {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1.2;
    color: #fff;
    white-space: nowrap;
  }

  .hp-nav__links {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .hp-nav__link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 44px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
    border-radius: 999px;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .hp-nav__link:hover { background: rgba(255,255,255,0.06); }
  .hp-nav__arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.55);
    transition: color 0.25s ease, transform 0.25s cubic-bezier(0.32,0.72,0,1);
  }
  .hp-nav__link:hover .hp-nav__arrow { color: #fff; transform: translate(3px, -3px); }
  .hp-nav__arrow svg { width: 16px; height: 16px; display: block; }

  /* ---------- HERO ----------
     All three pieces of copy are one block: the greeting reads into the
     statement, the statement is the largest thing on the page, and the support
     paragraph reads back out of it. The intervals inside that block are much
     smaller than the intervals around it, which is what makes it read as one
     thought rather than three stacked elements.
     The rule used to sit between the statement and the support paragraph,
     which cut the copy in half. It now sits below all of it and separates only
     the scroll cue, so it still gives the composition a second horizontal edge
     to close on — the cue is too small to hold the bottom of a full-height
     section by itself — without splitting anything anyone reads. */
  .hp-hero {
    /* The hero's body size. The greeting and the scroll cue are the only two
       pieces of non-display type left in here, and the owner's instruction is
       that they read as one size — so it is declared once and they both take it,
       rather than each carrying a curve of its own that has to be kept in step
       by hand. That is what had gone wrong: the cue ran clamp(12px, 0.85vw,
       14px) against copy at clamp(16px, 1.3vw, 21px), which measured 12.24px
       against 18.72px at 1440.
       The curve is the greeting's own, unchanged. */
    --hero-body: clamp(17px, 1.5vw, 24px);
    position: relative;
    min-height: 100vh;
    max-width: var(--shell);
    margin: 0 auto;
    padding: clamp(112px, 13vh, 150px) var(--pad-x) clamp(36px, 5vh, 64px);
    display: grid;
    /* Four tracks, two of them empty, so spare height is *divided* rather
       than pooled. Rows 1 and 3 are the clearance above the copy block and the
       open field below it; splitting the slack 1.55 : 1 keeps those two
       intervals visibly unequal, which is what stops the copy reading as
       something floating between two identical gaps — the measured failure
       that put the rule here in the first place. The minmax() floor on row 3
       guarantees the copy never crowds the rule, and both spacer tracks
       collapse to nothing on short viewports where there is no slack to divide
       in the first place.
       The floor is generous for display type — the statement ends the block, and
       a 74px glyph needs less clearance above a hairline than body copy did — but
       it is kept as-is so the open field stays the hero's largest interval. */
    grid-template-rows: 1.55fr auto minmax(clamp(48px, 7vh, 96px), 1fr) auto;
    gap: 0;
  }
  /* Ambient glow. The copy is capped at --shell, but light in a room is not,
     and painting the haze inside that same box put a hard vertical edge down
     the page wherever the window was wider than the cap — the gradient still
     had a third of its strength left when it hit the hero's left edge, so it
     stopped dead rather than fading out.
     So the painted area is full-bleed while the geometry stays measured off
     the capped box. `at 10%` of a 100vw box would slide the light rightwards
     as the window grew and unstick it from the headline, so the focal point is
     given as an offset from the centre the hero is already aligned to instead:
     50% - 0.40 * measure is arithmetically the old 10% of the measure, and the
     50% is the element's own centre, so it tracks the copy rather than the
     window. Vertical stays in percentages — the box height is unchanged.
     Not position:fixed: this has to scroll with the hero inside .hp-root. */
  .hp-hero::before {
    /* The hero's own width. Reading it off the viewport is a few px out below
       the cap on platforms with classic scrollbars, which is nothing against a
       ~540px falloff, and above the cap — where the seam was — it is exact. */
    --glow-measure: min(100vw, var(--shell));
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 100vw;
    margin-left: -50vw;
    pointer-events: none;
    background: radial-gradient(
      ellipse calc(0.62 * var(--glow-measure)) 52%
      at calc(50% - 0.40 * var(--glow-measure)) 22%,
      rgba(94,116,178,0.13) 0%, transparent 68%);
  }
  /* The copy block. `gap` is the greeting-to-statement interval, deliberately
     the tightest one in the hero so the greeting reads as a lead-in rather than
     a separate line of text. */
  .hp-hero__main {
    grid-row: 2;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 2.2vh, 28px);
  }
  .hp-hero__greeting {
    margin: 0;
    font-size: var(--hero-body);
    line-height: 1.3;
    letter-spacing: -0.01em;
    font-weight: 500;
    color: var(--ink-2);
  }
  .hp-hero__greeting strong { color: var(--ink); font-weight: 500; }

  .hp-hero__statement {
    margin: 0;
    max-width: 30ch;
    font-family: var(--ff-display);
    /* 500, against 700-800 everywhere else the display face is used. Three
       sentences at 700 set a slab with no air in it — the weight that keeps a
       one-line headline from going blobby is what makes a six-line one heavy.
       At 500 the same copy reads as something said rather than announced, which
       is the register the sentences are written in. */
    font-weight: 500;
    /* One curve from phone to desktop. A pure-vw size needed a separate mobile
       override, and that override capped higher than the desktop curve between
       ~750px and ~1150px, so the statement got *smaller* as the viewport grew
       past 900px, so this interpolates a single line between the two ends.
       Both ends came down ~12% when the statement lost the support paragraph and
       grew to three sentences: 74px was set when this was one sentence of ~100
       characters, and the same size across 184 characters is six lines of
       display type filling the hero rather than a headline sitting in it.

       The 6.5vh term is a ceiling, not a second curve. Sized on width alone, a
       short wide window — 1280x720, a part-height browser on a 1080p monitor —
       got desktop-sized type with no room under it, and six lines plus a blank
       line pushed the scroll cue below the fold. min() takes whichever of the
       two is smaller, so height only ever binds when it is the scarce dimension:
       at 6.5vh a 1080-tall viewport asks for 70px and gets the 65px cap, while a
       720-tall one asks for 47px and gets it. On phones the width term is always
       the smaller of the two by a wide margin, so this never engages there and
       the type cannot jump when mobile browser chrome collapses and vh changes
       under it. */
    font-size: clamp(26px, min(21.7px + 2.25vw, 6.5vh), 65px);
    line-height: 1.03;
    letter-spacing: -0.038em;
    color: var(--ink);
  }
  /* Words stay in nowrap wrappers so a multi-line heading breaks between
     words, not between letters, once every glyph is its own inline-block. */
  .hp-hero__word { display: inline-block; white-space: nowrap; }
  /* Same mechanism one level up: a run of words that must not be split from
     each other, so the statement can never end on a single word. */
  .hp-hero__keep { white-space: nowrap; }
  .hp-hero__char { display: inline-block; transform: translateZ(0); }

  /* One sentence per block, which is the only way the four-beat structure of the
     statement survives the width sweep. Left to flow as one paragraph the
     sentence breaks land wherever the measure runs out: at 1920 and 1152 they
     happened to fall at line ends and the statement read as two stanzas, while
     at 1280-1680 the same copy set as `except the problems. I design, I lead,
     and I` — a new sentence starting three words from the end of a line, which
     is the one place a full stop cannot be seen. The copy is written as four
     escalating beats, so a visitor who never sees them has been served
     different writing to the one that was approved.
     Blocks, not <br>: a forced break is a decision about where a line ends,
     which is width-dependent and would need a value per breakpoint. This is a
     decision about where a sentence ends, which is width-independent, so it
     needs stating once. Within each block the text still wraps normally, and
     hp-hero__keep handles the phrases that must not come apart when it does. */
  .hp-hero__statement-inner,
  .hp-hero__sentence { display: block; }
  /* The blank line is the only device marking the seam, and it is enough. The
     setup was briefly set at --ink-1 against the last sentence's full white, and
     the objection to it is not that it was hard to see: it is that a true,
     specific sentence about where she has worked does not need apologising for
     by being dimmed. One colour, one weight, one size — the space says
     everything the contrast step was saying.
     It also leaves the statement with exactly one tone, which is what makes the
     greeting above it legible as a different kind of line. */
  .hp-hero__sentence:last-child {
    /* A full blank line, so the setup and the point read as two blocks rather
       than as one block with a wider gap in it. `lh` is exactly one line at any
       line-height, which matters because the phone override sets 1.06 against
       the desktop's 1.03; the em value above it is the fallback that gets within
       a pixel or two where `lh` is unsupported. */
    margin-top: 1.05em;
    margin-top: 1lh;
  }
  /* Balanced within each block, because a block per sentence fixes where the
     full stops land but not how the words inside them distribute. Greedy
     wrapping fills each line to the measure and hands the remainder to the last
     one, which is how a full line ends up sitting above a stub; balancing evens
     them instead.
     Safe here specifically because these blocks are short: the algorithm is
     capped at six lines per block in Chromium, and these set as two lines each
     at every width above the phone band and three on a phone, so it never
     silently stops applying. Where it is unsupported the hp-hero__keep
     runs still hold the phrases that must not come apart, which is the floor
     this is an improvement on rather than a dependency. */
  .hp-hero__sentence { text-wrap: balance; }

  /* The closing band: the hairline and the cue under it, and nothing else.
     The cue sits on the same left axis as the copy, so the whole hero reads
     down one column — greeting, statement, rule, cue — instead of the eye being
     thrown to the opposite corner at the end of it. */
  .hp-hero__lower {
    grid-row: 4;
    position: relative;
    display: flex;
    align-items: flex-end;
    padding-top: clamp(20px, 2.8vh, 34px);
    border-top: 1px solid var(--rule);
  }

  /* Scroll cue. Purely typographic — one word and an arrow, no container. The
     ring it used to sit in was the only circle anywhere on the page and it read
     as a button the cue is not.

     The label takes --hero-body rather than a smaller curve of its own, so it is
     the greeting's size exactly: 21.6px against 21.6px at 1440, 15px against
     15px on a phone. It was 12.24px at 1440, and the owner read that as the word
     being wrong rather than as a label.
     Matching the greeting is not just the nearest available number now that the
     support paragraph has gone — it is the better composition. The greeting and
     the cue are the two small lines that top and tail the statement, and at one
     size they read as a deliberate pair bracketing the display type instead of
     as two different afterthoughts.

     Same tone as well as same size, and the arrow is included in it: a grey word
     beside a white arrow is the icon-with-a-caption reading that the stem-weight
     matching below exists specifically to defeat, so the pair takes one colour
     and the arrow inherits it rather than declaring its own.
     --ink-2 rather than --ink because nothing here is a control any more — the
     click handler is gone — and full white on the one line in the hero that does
     nothing was the loudest thing at the bottom of the composition. At 0.52 over
     --bg it measures 5.65:1, so it clears WCAG AA for body text at every size
     the clamp produces, which is the floor that matters now that this is being
     read rather than pressed. */
  .hp-hero__cue {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    /* In em, like the arrow and the bob below: one size governs the whole pair,
       so the cue is resized by changing font-size and nothing else. */
    gap: 0.8em;
    /* 44px, and no longer as a tap target — nothing here is tappable. It is the
       height the closing band was composed against, so it stays as the band's
       measure rather than letting the row collapse to the cap height of one
       word and pull the hairline down onto the copy. */
    min-height: 44px;
    font-size: var(--hero-body);
    /* 600 against the greeting's 500. This no longer says `control`, because
       there is no control: it says this line is not more of the copy above it.
       It is now the only thing making that distinction — same size as the
       greeting, and now the same colour too — so it carries more than it did
       when the colour was helping. */
    font-weight: 600;
    /* Sentence case, on the owner's instruction: one capital and no shouting.
       The 0.01em of tracking that came down with the caps has gone with the size
       it was calibrated for — it was the residue that kept six letters at
       12-14px from setting tight, and at 16-21px the word needs no help. */
    color: var(--ink-2);
  }
  /* No cursor, no hover, no focus ring, because there is nothing to focus: this
     is a label on a <span aria-hidden>, not a button. The pointer cursor and the
     focus-visible outline both went with the click handler rather than being
     left to advertise an interaction that no longer exists — a pointer cursor
     over dead text is a worse lie than no affordance at all, and an outline on
     an element that cannot be reached by keyboard can never be drawn.
     The scroll it used to perform is not replaced. It duplicated the gesture the
     visitor is already making, and the section it jumped to is the very next
     thing on the page. */
  .hp-hero__cue-arrow {
    display: block;
    /* A share of the label, not a clamp of its own. The two independent clamps
       were only coincidentally in step: 1.55vw against 0.85vw made the arrow
       1.82x the label at 1440, while the 19px and 12px floors made it 1.58x on
       a phone.
       1.35 is the share at which the arrow's drawn line and the label's stems
       come out the same weight. The glyph is stroke-width 2 of a 24 viewBox, so
       its line is 2/24 of this number — 0.1125em — and Inter 600's stem is
       0.113em. Being a ratio it holds at every size the clamp produces: 2.43px
       against 2.44px at 1440, 1.69px against 1.70px on a phone.
       That is what makes the two read as one object instead of as an icon with a
       caption. Carried over whole at 1.82 the arrow's line is a third heavier
       than the word it belongs to, which is the imbalance that made the label
       look undersized in the first place — the arrow was doing the holding
       because the word was too small to. */
    --arrow: 1.35em;
    width: var(--arrow);
    height: var(--arrow);
    /* No colour of its own: the SVG strokes with currentColor, so it takes the
       label's --ink-2 by inheritance. Restating it here would be a second place
       to forget when the pair's colour changes — which it now has. */
    /* The bob: one arrow, always visible, floating up and down on a fixed
       vertical axis. It replaces a drift that travelled the arrow through a
       fade at each end and wrapped invisibly; that version was built to hide a
       loop the owner disliked, and what she has asked for instead has no loop
       to hide — the motion is its own return, so nothing fades and nothing
       wraps.
       Amplitude is a tenth of the arrow's own size, which is the difference
       between breathing and bouncing: 2.2-2.8px either way, so the arrow is
       never anywhere but where it belongs and the movement is only ever visible
       as movement. Written off --arrow rather than restated as its own clamp, so
       the tenth stays a tenth if the pair is ever resized again.
       Eased at both ends, 2.8s per round trip — the pace of a slow breath, and
       slow enough not to compete with the copy above it. */
    --bob: calc(var(--arrow) / 10);
    animation: hp-cue-bob 2.8s ease-in-out infinite;
  }
  .hp-hero__cue-arrow svg { width: 100%; height: 100%; display: block; }
  @keyframes hp-cue-bob {
    0%, 100% { transform: translateY(calc(-1 * var(--bob))); }
    50%      { transform: translateY(var(--bob)); }
  }

  /* ---------- WORDMARK (3 rows converge → scale down) ----------
     Motion, scale values and scroll cost are locked; only the mechanism has
     changed. The section used to be 100vh and was held in place by GSAP
     writing a transform to it on every scroll update. Inside a custom
     overflow-y:auto scroller that transform is a main-thread write racing a
     compositor-thread scroll, which is what made it shake.

     Now the section is simply tall — 100vh of stage plus the 320vh the
     animation is scrubbed over, matching the old pin distance exactly — and
     the stage inside it is position:sticky. The compositor holds the stage
     still on its own, with no JS in the loop, and GSAP is left doing the one
     thing it is good at here: mapping scroll position onto the timeline. */
  .hp-wordmark {
    position: relative;
    width: 100%;
    height: 420vh;
    background: #0a0a0c;
  }
  .hp-wordmark__stage {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Has to live on the stage, not the section: an overflow other than
       visible on an ancestor would make that ancestor the sticky element's
       scrollport and kill the stick entirely. */
    overflow: hidden;
    background: #0a0a0c;
  }
  /* Reduced motion gets the mark as a static composition, so the section
     costs one screen of scroll instead of four with nothing happening. */
  .hp-wordmark--static { height: 100vh; }
  .hp-wordmark__inner {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* Promote to its own compositing layer so the scale-down is GPU
       interpolated rather than re-rasterising glyphs every frame. */
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
  }
  .hp-wordmark__row {
    position: relative;
    width: 100%;
    text-align: center;
    font-family: var(--ff-display);
    font-weight: 800;
    /* "Selected Work" sets ~6.5x its own font-size wide and must not be
       clipped, so the vw term is what keeps it inside the viewport: 13.5vw
       fills ~87% of the width. The vh term only engages on genuinely short
       viewports (landscape phones), where three rows at the vw size would
       otherwise be taller than the section and get sliced top and bottom.
       There is deliberately no px floor — a fixed floor overflows narrow
       screens, which is what clipped the mark below ~470px. */
    font-size: min(13.5vw, 28vh, 210px);
    /* Optically centred glyphs in a row box that is still exactly one em tall.
       Both halves of that matter.
       Manrope's ascent and descent do not straddle the em evenly, and "Selected
       Work" has nothing below the baseline but the overshoot of its round
       letters, so at line-height:1 the row's box carries 0.148em of empty space
       above the glyphs and 0.102em below them: measured, 28.8px against 19.8px
       at the 194px desktop size. The glyphs therefore sit 4.5px low in their
       own box, which is what makes the middle row read as hanging below centre
       between its neighbours — the boxes are the page's own black, so the only
       thing the eye can measure is where the ink sits inside them.
       Half of that difference, 0.0232em, is taken out of the line-height, which
       moves the baseline up by exactly that much and leaves 0.125em of space
       top and bottom. `height` then puts the em back, because the row's own
       height is the distance GSAP moves it: the convergence is yPercent 100,
       a percentage of this element, and it has to land each outer row exactly
       on the middle one. Trimming the box instead — text-box-trim, which this
       Chrome does support — cannot be used for that reason: it changes the
       height it is trimming, and the pitch and the travel are the same number.
       Not a transform either, for the same reason: GSAP owns that. */
    height: 1em;
    line-height: 0.9535;
    letter-spacing: -0.05em;
    color: #fff;
    white-space: nowrap;
    background: #0a0a0c;
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
  }
  /* Middle row sits above the outer two so they slide in behind it. */
  .hp-wordmark__row:nth-child(2) { z-index: 2; }

  /* ---------- WHERE YOU ARE IN THE SET ----------
     An index of the work, held still in the left quarter while the cards move
     past it. It exists because the carousel says "there is a set here" and then
     leaves you to guess how big the set is: three cards look the same as thirty
     until you have scrolled to the end of them.

     Numerals only, down the right. It carried the project names too, and they
     were the reason it could have a quarter of the page — but they were also
     the third place the same five words appeared, after the card's own heading
     and the page each one opens. Read down the column and it was an index of a
     set you were already looking at. What is left is the part the cards
     genuinely cannot say: how many there are, and which one this is.

     On the right rather than the left, and set flush to the page's own right
     margin, so it reads as a note in the margin of the work rather than as a
     column the work is indented from. That is also what let the column give up
     everything it was holding: on the left it was the thing you met first and
     had to look like it deserved the space, and in the margin it can be 24px
     of type and nothing else.

     No separators, no ends: five numerals at two sizes, and the lit one is
     where you are. Everything else was furniture, and every rule that came out
     made the remaining ones look more deliberate until there were none left.

     aria-hidden, and it has to be. It changes as you scroll, and a live index
     that announces itself every time a card passes the middle of the screen is
     noise over the top of the headings that carry the same names properly. */
  .hp-count {
    grid-column: 2;
    position: sticky;
    /* The list is centred on the card it is labelling rather than parked near
       the top, because with five rows it is tall enough that a top-aligned
       block would sit against the card's heading and read as part of it.

       vh and not 50%. A percentage inset on a sticky box resolves against its
       containing block, which here is the whole card stack — three cards deep,
       so 50% is roughly 1300px and the rail would stick somewhere below the
       fold and never be seen. The translate is what does the centring: the
       inset puts its top edge on the middle of the screen, and the transform
       pulls it back up by half its own height, whatever that turns out to be
       once there are five rows in it. */
    top: 50vh;
    transform: translateY(-50%);
    /* Nothing here navigates. It reports where you are, and a pointer cursor
       over it would promise a jump it does not make. */
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1);
  }
  .hp-count.is-on { opacity: 1; }

  .hp-count__list {
    display: flex;
    flex-direction: column;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  /* The line box is a fixed 22px rather than a multiple of the type, so the
     numeral inside it can change size without the rows below it moving. A
     unitless line-height would be recomputed against the lit row's larger
     font-size and push the rest of the column down every time the current card
     changed, which is a list rearranging itself to report that nothing about it
     has changed. */
  .hp-count__row {
    line-height: 22px;
    padding: 11px 0;
    /* Flush right, so the column has a clean edge against the page margin and
       the lit numeral grows leftwards into the empty space rather than pushing
       that edge around as it changes size. */
    text-align: right;
    color: var(--ink-3);
    transition: color 0.5s cubic-bezier(0.16,1,0.3,1);
  }
  .hp-count__row.is-now { color: var(--ink); }

  /* The lit numeral grows, which is what the name used to do. Brightness alone
     was enough when it was lighting a word; on two digits it is a difference
     you have to be looking for, and this rail is meant to be read out of the
     corner of the eye.

     font-size is not composited, so this is a paint on five two-character
     strings and nothing else. A transform would be cheaper and would scale the
     stroke weight along with the glyph, which at this size reads as the numeral
     getting bolder rather than larger. */
  .hp-count__n {
    display: block;
    font-family: var(--ff-display);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    /* Tabular, so 01 and 11 are the same width and the column keeps one edge. */
    font-variant-numeric: tabular-nums;
    opacity: 0.6;
    transition: font-size 0.5s cubic-bezier(0.16,1,0.3,1),
                opacity 0.5s cubic-bezier(0.16,1,0.3,1);
  }
  .hp-count__row.is-now .hp-count__n {
    font-size: 18px;
    opacity: 1;
  }

  /* ---------- CASE STUDY CARDS ----------
     Each card is one image the owner supplied, with three pieces of text laid
     into the empty area she left at the top of it.

     Nothing here draws a card any more. The colour, the rounded corners, the
     browser window and its chrome, the phone composition and every shadow are
     baked into her artwork, so the only work left is to place her image and put
     the tags, the sentence and the arrow back where she had them in the
     composite. Anything this stylesheet drew over that would be a second
     designer's opinion arriving uninvited, which is what the previous version
     of this section had become.

     The cards scroll normally. There is no pin and no sticky stack: the card
     nearest the middle of the screen is at full size and the others sit
     smaller. That is a scroll-linked transform on an element that is not trying
     to hold still, and the distinction is the whole reason it is safe here. The
     wordmark shook for months because JS wrote a transform to keep something
     stationary inside this compositor-scrolled container, where a main-thread
     write races a compositor-thread scroll; on a stationary element that race
     is visible as jitter, on a scale it is not. */
  .hp-cases {
    /* The card fills the shell again. Nothing constrains it from the height
       any more: the width cap that used to live here existed only so three
       cards could stack inside one viewport, and there is no stack. */
    /* The section is two columns from 901px up: the cards, then the index that
       counts them, down the right-hand side. Named here because three separate
       things need the same arithmetic — the grid, the card's own width cap and
       the corner radius — and a card that disagreed with the column it sits in
       would be a scrollbar.

       The index column is as narrow as five two-digit numerals need, where it
       used to be a quarter of the page. A quarter was the right size for a rail
       carrying five project names; carrying numerals, it was holding back 250px
       of the card to set 24px of type. Everything it gives up goes to the
       artwork, which is now at its 1120px cap on any desktop rather than 200px
       short of it. */
    --content-w: calc(min(100vw, var(--shell)) - 2 * var(--pad-x));
    /* Written against --content-w rather than as a 4.5% column, so this and the
       card width below are the same expression rather than two that have to be
       kept saying the same thing. A percentage would be the shorter way to say
       it in the grid and could not be reused here, because a percentage inside
       --card-w-px would resolve against whatever property it eventually lands
       in — and it lands in a corner radius. */
    --rail-w: clamp(44px, calc(0.045 * var(--content-w)), 72px);
    --rail-gap: clamp(28px, 3.4vw, 64px);
    /* What the grid leaves for the cards: everything but the index and the gap.
       --card-w below reaches the same number through 100%, but the radius needs
       it as a length rather than as a share of a box it is not inside. */
    --card-w-px: min(
      calc(var(--content-w) - var(--rail-w) - var(--rail-gap)),
      1120px
    );
    --card-w: min(100%, 1120px);
    /* Taken from --card-w-px rather than in cqw because this applies to the
       query container itself, where container units resolve against an ancestor
       container instead of against the element.

       This does not set the corner the visitor sees. The artwork's own corner
       does, because border-radius here is a clip and a clip can only round a
       corner further than the picture already is. What this has to do is stay
       just outside the baked curve, or the wedge of black the WebP flatten
       leaves outside it survives and sits on the page's #0a0a0c.

       Both numbers came down together: build-case-images.py now re-cuts the
       corner at 0.0179 of the width, measured at the midpoint of the curve,
       where it used to arrive at 0.0281. This is 0.02, which keeps the same
       12% margin over the artwork that the old pair had.

       The floor is 12px rather than 16. On a phone the top corners are the
       clip's alone, because the crop takes the artwork's away, so the floor is
       the corner on the one screen where the proportional term never governs —
       and 16px was the roundest part of the page at the width where the card
       is smallest. */
    --card-r: max(12px, calc(var(--card-w-px) * 0.02));
    --card-gap: clamp(26px, 6.5vh, 78px);
    /* The two ends of the carousel, declared here so the value that ships and
       the value the audit reads are the same one, and so a breakpoint can widen
       the range without the script knowing which band it is in. The base was
       only ever a fallback inside the script before, which meant the desktop
       figure was the one number in this effect that could not be found by
       looking at the stylesheet.

       Both are further from 1 than they were: 0.9 and no dim at all was a
       change you had to be told about before you could see it. A card arriving
       at 0.85 and half lit reads as coming forward, and the one at the middle
       of the screen reads as the one being looked at rather than merely the one
       in the middle. */
    --card-scale-min: 0.85;
    --card-dim-min: 0.5;
    /* Overlay geometry, declared here so the card and its descendants share one
       source for the description's legibility floor. */
    --sp-desc-floor: 19px;
    --sp-desc-ratio: 0.03636;    /* 64 / 1760 */

    max-width: var(--shell);
    margin: 0 auto;
    /* Top padding clears the fixed nav pill, which is 106px deep at desktop, 82
       at tablet and 72 on a phone, so the first card does not arrive already
       underneath it. */
    padding: clamp(80px, 12vh, 132px) var(--pad-x) clamp(24px, 6vh, 80px);

    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w);
    column-gap: var(--rail-gap);
    /* start, not stretch: the rail has to be shorter than its column for
       position:sticky to have anywhere to travel. Stretched to the full height
       of the card stack it would be stuck to itself and never move. */
    align-items: start;
  }
  .hp-cases__list { grid-column: 1; min-width: 0; }

  /* Below 901px the rail's quarter is about 170px, which is not a column, it is
     a margin with type in it. The count survives as the small floating pill it
     started as: same information, in the only space a phone has going spare.

     Kept here, after .hp-cases rather than up with the rest of the count, so it
     is later in the sheet than the grid it is switching off. Two rules of equal
     weight are settled by order, and from above this one only appeared to work:
     the pill moved, the columns did not, and the cards spent a while laid out
     in a quarter of a phone.

     It keeps the nav's treatment exactly — same fill, same hairline, same blur
     — because that is what makes it readable everywhere it has to be. The cards
     are full-bleed colour and one of them is nearly white, so a bare numeral in
     the page's ink would disappear over Sofa to Saddle for the whole time that
     card is on screen. Bottom left, diagonally opposite the nav, so the two
     pieces of floating furniture are never in the same corner of the eye. */
  @media (max-width: 900px) {
    .hp-cases {
      display: block;
      --card-w-px: min(var(--content-w), 1120px);
    }
    .hp-count {
      position: fixed;
      left: var(--pad-x);
      bottom: clamp(18px, 3.5vh, 34px);
      /* Under the nav's 100. They never meet, but if a short window brought
         them close the nav is the one that owns the space. */
      z-index: 90;
      top: auto;
      transform: none;
      padding: 9px 14px 10px;
      border-radius: 999px;
      background: rgba(18,18,22,0.55);
      border: 1px solid rgba(255,255,255,0.09);
      backdrop-filter: blur(28px) saturate(1.6);
      -webkit-backdrop-filter: blur(28px) saturate(1.6);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
    }
    /* Laid on one line here: 01 02 03 04 05, the current one lit.
       Brightness does all of it, and the size step the rail uses is dropped —
       a numeral growing inside a pill this tight would push its neighbours
       along the row and change the width of the pill itself. In a column there
       is room for the lit row to be larger; on one line there is not. */
    .hp-count__list { flex-direction: row; gap: 9px; }
    .hp-count__row { padding: 0; line-height: 1; }
    .hp-count__n,
    .hp-count__row.is-now .hp-count__n {
      font-size: 12px;
      letter-spacing: 0.05em;
    }
  }

  .hp-case {
    /* The card is the containment context for its own contents, so every value
       in the overlay is a share of the card rather than a pixel size that only
       happens to be right at the 1760px reference width. 1cqw is 1% of the
       card, so a spec value converts as value / 17.6. Container units are used
       on the card's DESCENDANTS only; on the query container itself they
       resolve against an ancestor container, which is why the radius above
       comes from --card-w-px instead. */
    container-type: inline-size;
    position: relative;
    width: var(--card-w);
    margin: 0 auto var(--card-gap);
    border-radius: var(--card-r);
    overflow: hidden;
    /* The carousel scales and dims this element, so it gets its own compositing
       layer and both are interpolated rather than re-rasterising the artwork
       every frame. */
    will-change: transform, opacity;
    transform: translateZ(0);
    backface-visibility: hidden;
  }
  .hp-case:last-child { margin-bottom: 0; }

  /* Her artwork, whole and unaltered, at its own aspect. width and height are
     on the tag too, so the box is reserved at the right shape before the file
     arrives and a lazily-loaded card further down cannot shift the page when it
     lands. */
  .hp-case__art {
    display: block;
    width: 100%;
    height: auto;
  }

  /* One link over the whole card, so the hit area is the artwork and not just
     the words on it. The accessible name comes from aria-label rather than from
     the contents, which would otherwise read out as one long run.

     The overlay geometry, once, as shares of the card. Every number is the
     Figma value at the 1760px reference divided by 17.6, which is also what her
     composite measures: its cards are 330px wide with the chip row starting
     24px in, and 24/330 is 7.27% against this 7.386%.

     The max() floors are what keep the card usable on a phone: a 346px-wide
     card would otherwise set the description at 12.6px and the chip border at
     0.5px. Above roughly a 520px card the proportions govern and the floors
     never engage.

     Where a value is a share of TYPE rather than of the card it is written in
     em, so it survives the floors intact: the chip's padding is 0.3em and
     0.95em of its own label and its border is 0.125em of the same. Those ratios
     hold exactly at every size, floored or not, which px or cqw could not do —
     and it is why the chips can be resized by moving one number. */
  .hp-case__link {
    --sp-pad: max(22px, 7.386cqw);       /* 130px */
    --sp-gap: max(18px, 6.818cqw);       /* 120px, text column -> arrow */
    --sp-headgap: max(14px, 2.727cqw);   /* 48px, tags -> description */
    /* Written from the properties the wrapper declares rather than as literals,
       so the floor is stated in one place. 0.03636 * 100cqw is 3.636cqw, the
       spec's 64/1760. */
    --sp-desc: max(var(--sp-desc-floor), calc(var(--sp-desc-ratio) * 100cqw));
    /* Well below the spec's 1.136cqw (20px at its 1760 reference), on the
       owner's instruction twice over: too loud against the sentence they label
       on desktop, and much too loud on a phone.

       The second complaint was the informative one, because the ratio in here
       never governed. The card is capped at 1120px, so 1cqw tops out at 11.2px
       and the floor decides the label at every width below about 1100px — the
       old max(11px, 1cqw) measured 11px on a 264px card and 11.2px on a 1120px
       one, which is a constant wearing a proportion's clothes. A constant is
       the wrong shape for this, because the thing the chip has to stay
       subordinate to is not constant: the description runs 17.5px on a phone
       and 40.7px on desktop. So the same 24px pill was 115% of the
       description's line box on a phone — taller than the sentence it labels —
       and 50% of it on desktop. It only ever looked right at the top of the
       range.

       10px with the padding ratios below brings the pill to 20px: 96% of that
       line box on a phone and 41% on desktop, so it is subordinate at both
       ends rather than at one. It also takes the row back to one line — at
       360px the three chips wrapped to two, which is what made the block read
       as a slab of pills rather than as a label.

       That fixed the loudness and left the scaling: 0.9cqw tops out at 10.08px
       on the capped 1120px card, so the floor decided the label at every width
       below about 1110px and the chip measured 10px on a phone and 10px on a
       desktop. Which is 1.8% of the card it sits on at the top of the range and
       7.6% of it at the bottom, so the thing that reads as a footnote beside a
       40px sentence reads as the loudest object on the card beside a 17px one.

       A clamp with both ends written out, so the label is a proportion the
       whole way rather than a floor pretending to be one. The top is where it
       already was and the bottom is 8px, on the owner's instruction after
       seeing a 9px floor and asking for more.

       8px is small, and it is chosen knowing that. What makes it affordable is
       what these labels are: three or four familiar words, set in white at 500
       on a saturated fill, on a card whose whole job is already done by the
       sentence underneath them. They are the last thing on the card anyone
       needs to read, and on a phone the pill was reading like the first. */
    --sp-tag: clamp(8px, calc(7.23px + 0.292cqw), 10.5px);
    --sp-arrow: max(26px, 4.091cqw);     /* 72px */
    --sp-textcol: 74.318cqw;             /* 1308px */

    display: block;
    color: var(--card-ink);
    text-decoration: none;
  }
  /* Inset so the ring is not clipped away by the card's own overflow:hidden,
     and in the card's ink so it stays visible on the pale card. */
  .hp-case__link:focus-visible {
    outline: 3px solid var(--card-ink);
    outline-offset: -5px;
  }

  /* The head is a row: the text column on the left, the arrow held at the top
     right, both sitting on the flat colour she left clear.
     Absolutely positioned, so it lies in the cleared band without taking part
     in the card's height — the card is exactly as tall as her artwork. Its
     inset is --sp-pad on three sides, which is the spec's 130/1760 and also
     what her composite measures: 24px in from the edge of a 330px card, or
     7.27% against this 7.386%. */
  .hp-case__head {
    position: absolute;
    z-index: 2;
    top: var(--sp-pad);
    left: var(--sp-pad);
    right: var(--sp-pad);
    display: flex;
    align-items: flex-start;
    gap: var(--sp-gap);
  }
  .hp-case__head-text {
    flex: 1 1 auto;
    min-width: 0;
    max-width: var(--sp-textcol);
    display: flex;
    flex-direction: column;
    gap: var(--sp-headgap);
  }

  /* The card is a link to the case study and nothing else says so, now that
     there is no visible title. The arrow used to leave the frame along its own
     diagonal with a second copy following it in from the opposite corner; the
     owner found that odd to watch and asked for it to just move up a little on
     hover, so it does exactly that and nothing else.
     One glyph, one property, one short move. The distance is a share of the
     arrow with a small floor, so it stays proportionate on a 72px arrow and
     stays perceptible on a floored 26px one. */
  .hp-case__arrow {
    flex: 0 0 auto;
    width: var(--sp-arrow);
    height: var(--sp-arrow);
    color: var(--card-ink);
    transition: transform 0.32s cubic-bezier(0.32,0.72,0,1);
  }
  .hp-case__arrow svg { width: 100%; height: 100%; display: block; }
  /* The whole card is the link, so hovering anywhere on it moves the arrow, and
     keyboard focus gets the same feedback as the pointer. */
  .hp-case__link:hover .hp-case__arrow,
  .hp-case__link:focus-visible .hp-case__arrow {
    transform: translateY(calc(-1 * max(4px, 0.34cqw)));
  }

  /* Real heading, kept out of the picture. The reference carries the project
     name only in the bold phrase of the sentence, but the document outline,
     search engines and heading navigation all still need an h2. */
  .hp-case__title {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* Outlined chips, replacing the solid per-card pills. The font-size is set
     on the row so the chips' own padding, gap and border can all be em and
     therefore hold their ratio to the label at any size. */
  .hp-case__tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75em;                      /* 0.75 of the label */
    margin: 0;
    font-size: var(--sp-tag);
  }
  .hp-case__tag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    /* Tighter than the 0.4/1.2 the outlined chip inherited from the solid pill
       it replaced. A solid pill needs the room, because the fill is the shape
       and the label has to sit inside it; an outline is already the shape, so
       the same padding just buys empty box. Most of the size that came off here
       came off the padding rather than the label. */
    padding: 0.28em 0.78em;           /* 0.28 / 0.78 of the label */
    /* The floor comes down with the label. At 1.25px it was the one part of the
       chip that could not shrink, and on the smallest card it was a fifth of
       the pill's height being spent on its outline. 1px still paints as a
       hairline and the em term takes over above about a 9px label, so the
       stroke gains weight with the box rather than in spite of it. */
    border: max(1px, 0.115em) solid var(--card-ink);
    border-radius: 99999px;
    background: transparent;
    color: var(--card-ink);
    font-family: var(--ff-body);
    font-size: 1em;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.004em;
    text-align: center;
    white-space: nowrap;
  }

  /* With no visible title this sentence IS the card's headline. The spec sets
     it at 400 rather than the 700 it carried before, so it reads considerably
     lighter — that is the spec's intent, not a regression.
     Inter, not Manrope: the spec asks for 'Helvetica Neue', which is not loaded
     here and is not dependable off macOS. Inter is the neo-grotesque already on
     the page and the closest thing to what the spec draws. Manrope at 400 and
     this size would not match it — its geometry is much rounder. */
  .hp-case__desc {
    margin: 0;
    /* No measure of its own: the sentence fills the text column. The old
       16.52em (the spec's 1057px against a 64px size) is 60% of the card, and
       measuring her composite shows her own longest line running to 74.5% —
       the full width of the column. That difference is not cosmetic: at 60%
       both British Cycling and Sofa to Saddle wrap to four lines where her
       artwork has three, and the fourth line is what pushed the text out of
       the area she cleared for it and onto her mockup. */
    font-family: var(--ff-body);
    font-size: var(--sp-desc);
    line-height: 1.1875;              /* 76 / 64 */
    letter-spacing: -0.004em;
    font-weight: 400;
    color: var(--card-ink);
  }
  /* The project name stays lifted out of the sentence, as in the spec's own
     screenshot. Against a 400 run, 600 is the step that reads as emphasis
     without turning the phrase into a different voice. */
  .hp-case__desc strong { font-weight: 600; color: inherit; }

  /* ---------- FOOTER ---------- */
  .hp-footer {
    /* The footer's own gutter, so the two rules can align to the content
       column without restating the value. It is --pad-x everywhere except the
       phone band, which sets its own tighter gutter. */
    --foot-x: var(--pad-x);
    min-height: 86vh;
    padding: clamp(80px, 12vh, 160px) var(--foot-x) clamp(32px, 4vh, 52px);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--bg);
    max-width: var(--shell);
    margin: 0 auto;
  }
  /* The rule that opens the footer. It was the element's own border-top, which
     put it edge to edge across the viewport and made it a division of the
     window rather than of the page. It is the content column instead: one
     gutter in on each side, so it begins and ends where the eyebrow, the
     headline, the buttons and the copyright row do.
     It was tried three gutters short on the right, and it was wrong — a line
     that stops inside the row it heads reads as having fallen short of it,
     not as having been placed. The column is the page's own measure and it is
     not the window's: at the top of the range the footer is capped at --shell
     and centred, so the rule is 70% of a 1920 screen with 290px of page either
     side of it, and below that cap it is the gutter that holds it off the
     edge.
     Absolutely positioned rather than a flex child: the footer is a centred
     flex column, so a real element would take part in the distribution and
     move everything under it. */
  .hp-footer::before {
    content: '';
    position: absolute;
    top: 0;
    left: var(--foot-x);
    right: var(--foot-x);
    height: 1px;
    background: var(--rule);
  }
  /* This eyebrow used to have its dash suppressed, on the grounds that the
     full-width hairline 90px above had already opened the footer and the dash
     restated it smaller. Asked for by the owner and reinstated: the dash is not
     doing the hairline's job of dividing the page, it is marking where a label
     starts, and it puts the eyebrow's first ink on the same left edge as the
     hairline, the headline and the copyright row rather than starting the label
     40px inside them. It is the default from .hp-eyebrow--rule now, so there is
     no exception here and the footer matches the case study's other eyebrows. */
  .hp-footer__title {
    margin: clamp(22px, 3vh, 40px) 0 0;
    font-family: var(--ff-display);
    font-size: clamp(52px, 8.4vw, 148px);
    line-height: 0.92;
    letter-spacing: -0.048em;
    font-weight: 800;
    color: var(--ink);
    max-width: 12ch;
  }
  /* The lede is the only thing between the headline and the buttons, so it
     carries the interval on both sides itself. It used to sit in the left
     column of a two-column band with a Based / Open to list beside it; the
     list was removed as duplication — the sentence already says both — and a
     grid with one item in it is not structure, so the wrapper went with it. */
  .hp-footer__lede {
    margin: clamp(40px, 6vh, 80px) 0 clamp(36px, 5vh, 60px);
    /* 50ch, up from 40ch, on the owner's instruction: at 40ch these 163
       characters set in four lines from 901px up and she wants three. The
       measure is the only thing widened — the size curve is untouched, because
       shrinking the type to make the count is the one way of hitting it that
       makes the paragraph worse.
       50ch is where three lines starts, and it is not overshot on purpose: it
       sets ~63/65/35 characters, and the top of a comfortable measure for body
       copy is around 75. Anything wider buys nothing — the line count cannot go
       below three at this length — and costs the reader the return sweep. The
       measure is in ch, so it tracks the font-size curve and the count holds at
       every desktop width rather than at the one it was tuned on. */
    max-width: 50ch;
    font-size: clamp(17px, 1.35vw, 22px);
    line-height: 1.5;
    letter-spacing: -0.011em;
    color: var(--ink-1);
  }
  .hp-footer__lede strong { color: var(--ink); font-weight: 500; }
  .hp-footer__ctas {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .hp-footer__cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    min-height: 44px;
    padding: 18px 24px;
    background: #fff;
    color: #0a0a0c;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.005em;
    text-decoration: none;
    transition: transform 0.4s cubic-bezier(0.32,0.72,0,1);
  }
  .hp-footer__cta.is-ghost {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .hp-footer__cta:hover { transform: translateY(-3px); }
  .hp-footer__cta-arrow { display: inline-flex; align-items: center; }
  .hp-footer__cta-arrow svg { width: 16px; height: 16px; display: block; }

  /* The bar closing the footer, with its hairline back above it at the owner's
     request. The interval is the one it had before the rule was briefly
     removed: 56-110px of margin above the line and 20-28px between the line
     and the copyright, roughly 4:1. While there was no rule the margin was
     raised to 88-160px to stand in for it; leaving it there now would have the
     line floating in the middle of a void of its own instead of closing the
     button group and opening the fine print. */
  .hp-footer__base {
    /* One value, used twice: it is the gap under the rule, and the distance
       the rule has to travel back up to sit on the bar's top edge. */
    --base-gap: clamp(20px, 2.4vw, 28px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    /* The bar is widened to the footer's full width and given the gutter back
       as padding, so its content sits in the same column it always did. The
       reason is the rule below: its insets are measured from whatever box it
       is positioned in, and both rules have to be measured from the same one
       or they cannot come out the same length. From a bar the width of the
       column, a gutter of inset would put the line a gutter inside the column
       rather than on it.
       It also makes that immune to the reveal: GSAP puts a transform on this
       bar, which silently turns it into the containing block for the line, so
       the line would otherwise be one length before the footer animates in and
       another afterwards. */
    margin-left: calc(-1 * var(--foot-x));
    margin-right: calc(-1 * var(--foot-x));
    margin-top: clamp(56px, 9vh, 110px);
    padding: var(--base-gap) var(--foot-x) 0;
    font-size: 13px;
    letter-spacing: -0.003em;
    color: var(--ink-3);
  }
  /* The same geometry as the rule at the top of the footer, in the same terms:
     the content column, a gutter in on each side. The two are the only
     horizontal lines here and they sit 480-740px apart, so they have to be
     coextensive or one of them reads as a mistake.
     Spanning the column is what makes this one a bracket rather than a lid:
     the copyright starts exactly under its left end and Back to top finishes
     exactly under its right, so the line closes over the row instead of
     stopping somewhere inside it.
     Vertically it has no `top` of its own — that would be measured from the
     top of the footer, hundreds of pixels away and dependent on how the copy
     above it wrapped. It takes its static position instead, which for an
     absolutely positioned child of a flex container is where it would sit as
     the only flex item: align-self pins that to the start rather than the
     centre the bar aligns its real items on, landing the line on the top of
     the bar's content, and the translate lifts it back over the padding onto
     the bar's edge. A transform, not a negative margin: margins are dropped on
     an absolutely positioned box that is taking its static position. */
  .hp-footer__base::before {
    content: '';
    position: absolute;
    align-self: flex-start;
    transform: translateY(calc(-1 * var(--base-gap)));
    left: var(--foot-x);
    right: var(--foot-x);
    height: 1px;
    background: var(--rule);
  }
  .hp-footer__top {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 0;
    background: none;
    border: 0;
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    transition: color 0.25s ease;
  }
  .hp-footer__top:hover { color: var(--ink); }
  .hp-footer__top svg { width: 14px; height: 14px; display: block; }

  /* ---------- Responsive ----------
     Four width bands plus a small-phone trim:

       >  1100      desktop — the composition every other band steps down from
       901 – 1100   narrow desktop / landscape tablet: the split case stacks
       601 –  900   tablet portrait: desktop structure at tablet scale
       401 –  600   phone
       <=   400     small phone (nav only)

     601–900 previously inherited the phone rules, so a 768px iPad was styled
     as a 390px phone: phone gutters, phone type, a single-column approach grid
     and two of the four device shots. It is now its own band.

     Anything that can be one continuous curve — the hero statement, the
     wordmark, the device row — is handled with clamp()/min() in the base rules
     rather than restated per band, so there are no size jumps at the seams. */
  /* Shared by tablet and phone. */
  @media (max-width: 900px) {
    /* Fills ~94% of the width instead of ~104%, which is what clipped the
       mark at every width below 900px. */
    .hp-wordmark__row { font-size: min(14.5vw, 28vh, 150px); }
  }

  /* ---------- Tablet portrait ---------- */
  @media (min-width: 601px) and (max-width: 900px) {
    /* Left matching vertical again, for the even surround described in the base
       rule. The avatar is 44px here and so is the link's floor, so the row is the
       avatar's own height and no centring offset is involved. */
    .hp-nav { top: 20px; gap: 16px; padding: 14px 10px 14px 14px; }
    /* 16 gap + 14 link padding. */
    .hp-nav__brand { padding-right: 30px; gap: 12px; }
    .hp-nav__avatar { width: 44px; height: 44px; }
    .hp-nav__name { font-size: 16px; }
    .hp-nav__link { padding: 12px 14px; font-size: 14px; gap: 6px; }
    .hp-nav__arrow svg { width: 14px; height: 14px; }

    .hp-hero { padding: clamp(112px, 14vh, 164px) var(--pad-x) clamp(32px, 4.5vh, 52px); }
    .hp-hero__statement { max-width: 26ch; }

    /* The nav pill is shallower here, so the cards can start higher. */
    .hp-cases { padding-top: clamp(64px, 10vh, 104px); }
    /* No card type overrides in this band: the overlay scales itself from the
       card's own width, so a tablet gets the same proportions as a desktop
       rather than a separately tuned size that has to be kept in step. */

    .hp-footer { min-height: 0; }
    .hp-footer__title { font-size: clamp(60px, 10vw, 92px); }
    /* The 56ch override is gone: the base measure is now 50ch, which is wider
       than the 40ch this band existed to escape and narrower than the 56ch it
       used. At 56ch this band was already setting three lines, but as 66/78/17
       — a 78-character line and a three-word widow. The same copy at 50ch sets
       63/65/35 here, so the band inherits both a better rag and one fewer rule
       to keep in step with the desktop. */
  }

  /* ---------- Phone ---------- */
  @media (max-width: 600px) {
    .hp-nav {
      top: 14px;
      gap: 10px;
      /* Left is vertical + 4, not vertical, because from here down the row is the
         link's 44px tap-target floor rather than the 36px avatar: the avatar is
         centred in it and gains 4px above and below on its own. 6 and 10 give an
         even 11px surround. Left tracks any change to the vertical padding at this
         breakpoint by that offset, not one for one. */
      padding: 6px 6px 6px 10px;
      /* A guard, not a width: the pill still hugs, and this only stops a long
         name taking it to the screen edges. It is close to binding on the
         narrowest phones, which is what sets the width the arrows drop out at —
         see the rule at the bottom of the stylesheet.

         Percentage rather than 100vw: vw counts a classic scrollbar and this
         element's containing block does not, so a narrow window on Windows or
         Linux would allow the pill 15px more than the screen really has. */
      max-width: calc(100% - 24px);
    }
    /* 10 gap + 12 link padding. */
    .hp-nav__brand { padding-right: 22px; gap: 10px; }
    .hp-nav__avatar { width: 36px; height: 36px; }
    .hp-nav__name { font-size: 14px; }
    .hp-nav__links { gap: 2px; }
    /* Labels stay. Hiding them left two identical arrow glyphs with no way to
       tell CV from LinkedIn — the arrow is the decoration, not the label. */
    .hp-nav__link {
      min-width: 44px;
      padding: 11px 12px;
      font-size: 13px;
      /* The arrows are shown at this width now, so the label needs clearing
         from the glyph again. It was 0 only because there was nothing there. */
      gap: 4px;
    }

    /* Tighter spacer floors than the desktop rhythm: on a phone the hero is
       close to content-height already, and a generous minimum open field is
       what pushes the cue off the bottom of a small screen. */
    .hp-hero {
      /* The greeting's phone size, moved onto the property both it and the cue
         read. It was on .hp-hero__greeting, where it sized only the greeting and
         left the cue on its own 12px floor.

         Capped against the viewport as well, because the greeting has to hold
         one line on a phone and at a flat 15px it did not. It needs 353px and
         a 390px phone gives it 346, so it wrapped at every width from 320px to
         390px — every phone in common use — and only came together at 402px.
         Two lines is the wrong shape for it: it is one sentence naming who she
         is, and split with `in the UK.` alone underneath it reads as a stray
         fragment below the statement rather than as a line of its own.

         3.5vw is what the measurement asks for, not a guess. 15px still governs
         from 429px up, and below that the type comes down only as far as the
         line needs — 13.65px on a 390px phone, 11.2px at 320px — keeping about
         13px of slack at the narrowest width so a font fallback with wider
         metrics cannot tip it back onto two lines. The cue comes down with it,
         which is the whole point of the shared property: they remain one size,
         as the owner asked. */
      --hero-body: min(15px, 3.5vw);
      padding: 94px 22px 30px;
      grid-template-rows: 1.5fr auto minmax(24px, 1fr) auto;
    }
    .hp-hero__main { gap: 14px; }
    /* Size comes from the base clamp; this only tightens the setting. */
    .hp-hero__statement {
      max-width: none;
      line-height: 1.06;
      letter-spacing: -0.032em;
    }
    /* The cue takes the full width so it still reads as the thing holding the
       bottom of the hero rather than a label tucked into a corner. */
    .hp-hero__lower { align-items: stretch; padding-top: 20px; }
    .hp-hero__cue { justify-content: space-between; width: 100%; }

    .hp-cases {
      /* The description is the whole measure on a phone, so its floor can come
         down a little and still leave it the largest thing on the card. */
      --sp-desc-floor: 17.5px;
      /* A phone card is nearly the full width of the screen, so the same 0.9
         that reads clearly on a desktop is barely a change here — there is no
         surrounding space for the difference to show against. A wider range
         gives the carousel something to say at this size. */
      --card-scale-min: 0.82;
      --card-dim-min: 0.55;
      padding-top: clamp(56px, 9vh, 92px);
      padding-bottom: 64px;
    }
    /* ---- The text comes out of her cleared band on a phone ----
       Her artwork clears the top 35% of the card for the overlay, which is a
       fixed share, so on a 264px-wide card that band is 82px tall. The overlay
       at its proportional size would fit in 69px of it — but at that size the
       description is 9.6px and the chip labels are 3px, which is not type, it
       is texture. The legibility floors exist for exactly that reason, and with
       them the block is 172px: twice the band.

       There is no width that resolves that, so the text stops sharing the
       card's top with the artwork and sits above it instead. The card takes the
       colour she cleared, the head goes back into the flow, and her image
       follows underneath at its own aspect, untouched. Because the top of every
       one of her images is that same flat colour, the join is invisible: what
       the phone shows is her card with a taller clear band, not a different
       composition.

       The artwork is then pulled up by its own cleared band, less one --sp-gap
       to leave the spec's interval between the sentence and the mockup. Two
       reasons, and the second is the one that matters:

         Without it that band becomes dead space. It is 31-37% of the card's
         width of empty colour sitting between the text and the mockup, on top
         of the text's own padding — measured 155px of nothing on a 334px card.

         Her corners are rounded against black rather than against
         transparency, so once the image is not at the top of the card its top
         two corners would show as black notches partway down it. The crop is
         many times the 3% corner radius, so they go with the band.

       Nothing of hers is lost either way: every pixel removed is the flat
       colour the card is already painted in. --art-crop is per card, measured
       from each file, because the three bands are not the same depth. */
    .hp-case { background: var(--card-bg); }
    .hp-case__head {
      position: static;
      display: block;
      padding: var(--sp-pad) var(--sp-pad) 0;
    }
    /* object-fit rather than a negative margin. A negative margin does not crop
       an image, it moves the whole thing up — including the part that is
       supposed to be gone — and since that part is opaque flat colour it lands
       on top of the sentence and paints it out. Giving the box the height the
       cropped image should have and letting cover trim it from the top is the
       only one of the two that actually removes anything. */
    .hp-case__art {
      height: calc((var(--art-ar) - var(--art-crop)) * 100cqw + var(--sp-gap));
      object-fit: cover;
      object-position: center bottom;
    }
    /* The arrow comes out of the flow and sits over the top-right corner
       instead of holding a column open. In the spec's proportions it costs 72
       of 1500 and the sentence never notices; at a 264px card the floored arrow
       plus the gap was taking 44px of a 214px measure, which put the Boots
       sentence on seven lines. The tag row keeps clear of it. */
    .hp-case__head-text { max-width: 100%; }
    .hp-case__arrow {
      position: absolute;
      top: var(--sp-pad);
      right: var(--sp-pad);
    }
    .hp-case__tags { padding-right: calc(var(--sp-arrow) + 8px); }
    /* Stays max() against the proportional value: a floor must never end up
       capping, which is what a bare px would do at the top of this band. */
    .hp-case__link { --sp-arrow: max(24px, 4.091cqw); }

    /* The phone gutter is 22px, not the 28px --pad-x floors at, so the top
       rule has to be told about it or it would start 6px inside the column it
       is meant to align with. Same padding as before, named once. */
    .hp-footer { --foot-x: 22px; min-height: 0; padding: 76px var(--foot-x) 28px; }
    .hp-footer__title { font-size: clamp(46px, 13vw, 76px); }
    /* Left at 52ch against a 16.5px body: on a phone the viewport is the
       measure long before any ch value is, so this only binds from about 585px
       up. Three lines is not physically available below that at a legible
       size, and the instruction is explicitly not to shrink the type to buy
       it, so the copy wraps to whatever the width allows. */
    .hp-footer__lede { margin: 32px 0 30px; max-width: 52ch; font-size: 16.5px; }
    .hp-footer__cta { padding: 15px 20px; font-size: 14px; }
    /* The rule is back here too, so the margin goes back to what it was when
       it last had one to sit above. --base-gap is inherited from the base
       rule, which floors at 20px — right for a 12px bar. */
    .hp-footer__base { margin-top: 46px; font-size: 12px; }
  }
  /* ---------- Short portrait phones: no scroll cue ----------
     Measured, not assumed. The hero's copy block is a fixed content height at
     a given width, and the cue sits under it, so whether the cue clears the
     fold is a question about height. Sweeping the height at each phone width
     puts the cue's bottom edge at:

       320 wide   714px      390 wide   643px      430 wide   630px

     Below those heights the cue was rendering below the fold — present,
     focusable, and invisible, which is worse than absent. 670px is under all
     three of the heights that have room (390x844, 430x932, 393x852 and every
     other current phone keep their cue) and over the heights that do not, and
     it catches the 320x568 case that prompted this. The owner's decision is
     to keep the whole copy at that size and lose the cue rather than shrink
     the type to fit both.

     The width bound is not a second opinion about which screens are small; it
     is there because landscape phones at 601px and up already have their own
     rule below, which moves the cue out of the flow into the empty space
     beside the paragraph rather than removing it.

     display:none, not opacity or visibility: the cue is a button and a link to
     the wordmark, so hiding it has to take it out of the accessibility tree
     and out of the tab order too. It also takes the hairline with it, which is
     the right outcome — the rule exists to give the composition a second
     horizontal edge to close on, and with nothing under it to close on it is
     a line ruled across the bottom of the copy for no reason. What is left is
     the copy block in the grid it already sits in, upper-middle with the open
     field below it, which is what the hero reads as above the fold anyway. */
  @media (max-width: 600px) and (max-height: 670px) {
    .hp-hero__lower { display: none; }
  }

  /* Landscape phones. Height is the scarce dimension and width is the
     plentiful one, so the statement comes off the desktop curve and spends the
     extra width instead of the extra height.
     Even then there is no room to stack a closing band under the copy — the
     copy block is most of a 390px-tall viewport on its own, and the cue would
     land below the fold, which is the one thing it must never do. So there is
     no void here to anchor and nothing for a rule to close: the copy IS the
     composition, and the cue becomes a corner marker in the space to the right
     of the statement that the short measure leaves empty anyway. */
  @media (max-height: 560px) and (min-width: 601px) {
    /* The pill comes down with everything else, because at these heights it is
       spending the scarce dimension. Its own height plus its offset was taking 118
       of the 92px the hero waits before starting — the greeting was running under
       it, by 14px before the padding was evened up and 26px after. Nothing caught
       that: the height sweep starts at 561px, one pixel above this band.

       Both numbers come down. 12px of offset rather than 28, and 8px of padding
       rather than 18, which puts the pill's underside at 82px and leaves the
       greeting the 10px of daylight it had before. Left padding matches the
       vertical, as everywhere: the surround stays even, at 9px instead of 19. */

      top: 12px;
      padding: 8px 10px 8px 8px;
    }
    .hp-hero {
      min-height: 0;
      padding-top: 92px;
      padding-bottom: 24px;
      grid-template-rows: 0fr auto minmax(20px, 1fr) auto;
    }
    .hp-hero__main { gap: 10px; }
    /* Down ~12% with the main curve, so a landscape phone stays in proportion
       to every other width rather than becoming the one place the statement is
       still set at its old size. */
    .hp-hero__statement { font-size: clamp(26px, 3.8vw, 40px); max-width: 62ch; }
    /* A third of a line rather than a whole one. This was sized against a
       three-sentence statement, which set six lines here and left the closing
       band without the 33px a full seam costs: at 1lh the cue landed 9px under
       the fold on a 390px-tall viewport, which is the one thing this breakpoint
       exists to prevent.

       and the cue now clears the fold at 1lh across this whole band — 17px to
       spare at its tightest, 601x320. So the tightened seam is no longer forced
       and is kept as a proportion: a full blank line between two blocks is a
       third of the hero at these heights. It still reads as the seam, being the
       only gap in the block and the only device marking it at any width. */

      margin-top: 0.35em;
      margin-top: 0.35lh;
    }
    .hp-hero__lower {
      position: absolute;
      right: var(--pad-x);
      bottom: 0;
      padding-top: 0;
      border-top: 0;
    }
  }
