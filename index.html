        wordmark.classList.add('hp-wordmark--static');
      } else {
        // Initial offsets live here rather than in CSS so GSAP owns the
        // transform outright and never has to reconcile with a stylesheet value.
        gsap.set(outer, { xPercent: 100, yPercent: 0 });
        gsap.set(rows[1], { xPercent: -100 });
        gsap.set(inner, { scale: 1 });

        gsap.timeline({
          defaults: { force3D: true },
          scrollTrigger: {
            trigger: wordmark,
            start: 'top top',
            end: 'bottom bottom',
            invalidateOnRefresh: true,
            // Smoothed, like the build after it and for the same reason: the
            // rows sliding in, converging and receding are a sequence with a
            // pace of its own, and a flick through them was three beats in a
            // blink. This used to be scrub: true on the grounds that smoothing
            // had only ever been compensation for a lagging pin; the owner
            // asked for the measured feel back once the pin was gone. Shorter
            // than the build's 2.2s because there is less to see and the
            // receded mark should not still be shrinking as the stage
            // un-sticks and carries it off.
            scrub: 1.2
          }
        })
          // 1 — rows slide in from alternating sides
          .to(outer,   { xPercent: 0, duration: 1, ease: 'none' }, 0)
          .to(rows[1], { xPercent: 0, duration: 1, ease: 'none' }, 0)
          // 2 — outer rows converge behind the middle row
          .to(rows[0], { yPercent: 100,  duration: 1, ease: 'power1.inOut' }, 1.15)
          .to(rows[2], { yPercent: -100, duration: 1, ease: 'power1.inOut' }, 1.15)
          // 3 — the collapsed mark recedes in place. It stays centred and
          // legible as it shrinks, and the stage un-sticking at the end of the
          // scrub is what carries it up and off. (A version that flew it into
          // a corner was tried and dropped: moving sideways while shrinking
          // made the words unreadable for the whole of the travel.)
          .to(inner, {
            scale: function() { return window.innerWidth <= 900 ? 0.34 : 0.2; },
            duration: 1.2,
            ease: 'power2.inOut'
          }, 2.35);
      }
    }

    // ---------- THE BUILD ----------
    // Only present when BUILD_ON put the section in the page; see initBuildScene.
    var buildEl = document.getElementById('hp-build');
    if (buildEl) initBuildScene(root);

    // ---------- CASE CARDS: the deck ----------
    // The cards park on top of one another (see .hp-cases__list), and the one
    // being covered draws back as its cover arrives. Two rules govern how
    // this is allowed to be built, and they come from the wordmark's
    // long-standing shake:
    //
    //   1. Nothing is pinned by script. The parking is the browser's sticky
    //      positioning; what is written here is a scale on a card that is
    //      already where the browser put it. The shake happened because a
    //      transform was being written on the main thread to hold an element
    //      STILL against a compositor-thread scroll, and any lag in that race
    //      shows up as jitter. A scale has no such reference to disagree with.
    //   2. transform and opacity only. No width, no height, no top, no filter
    //      — nothing that would put the card back through layout or paint on
    //      a scroll frame. metic dims a covered card with a brightness
    //      filter; here it is a black layer inside the link brought up by
    //      opacity, which costs the same as the scale it rides with.
    var cards = Array.prototype.slice.call(document.querySelectorAll('.hp-case'));
    var casesEl = document.getElementById('hp-cases');

    // ---------- THE SOUND CONTROL ----------
    // Shown while the work is what is on screen and taken away either side of
    // it, so it never floats over the hero or the footer, where there is
    // nothing it could be switching. Only present when the build is.
    var soundBtn = document.getElementById('hp-sound');

    // How far the top of the control sits above the bottom of the screen.
    // Measured rather than restated: the inset is a clamp on vh and the height
    // comes from the type inside it, and both move between one window and the
    // next. Only opacity ever hides it, so it has a box to measure either way.
    function soundInset() {
      return Math.round(root.clientHeight - soundBtn.getBoundingClientRect().top);
    }

    if (soundBtn && buildEl && casesEl) {
      ScrollTrigger.create({
        trigger: buildEl,
        // On once the stage is properly on screen, after the receded wordmark
        // has left the top of it, so the two are never showing at once: a
        // quarter of the way up the stage's own travel, the mark above it is
        // gone and the first lines are about to draw — which is when a visitor
        // would want to have been offered the sound.
        start: function() { return layoutTop(buildEl) - 0.75 * root.clientHeight; },
        // The control's own top edge is the far end: it goes as the last card
        // passes out from behind it, instead of riding down into the footer.
        // A scroll position rather than 'bottom bottom-=' of the trigger,
        // because the trigger is the stage and the far end is the last card's.
        end: function() {
          return layoutTop(casesEl) + casesEl.offsetHeight - root.clientHeight + soundInset();
        },
        onToggle: function(self) {
          soundBtn.classList.toggle('is-on', self.isActive);
        }
      });
    }

    // ---------- THE DECK ----------
    // Layout positions rather than 'top center' strings. A keyword resolves
    // against the element's bounding box, and every card here is either
    // transformed or stuck: a stuck card measures wherever the page happens
    // to be at refresh, and a drawn-back one measures as a smaller box. The
    // flow position is what neither touches — see layoutTopOf — so every
    // edge comes from that and is handed over as a scroll position.
    function layoutTop(el) { return layoutTopOf(root, el); }

    // Short on purpose. The scale follows the cards' own position on screen,
    // so a long catch-up keeps a card changing size after the wheel has
    // stopped, which is the drift through the pile. The coverage is eased
    // below, so the corner this used to take off — a card kicking as a cover
    // starts, and again as it parks — is gone without the lag that did it.
    var CARD_SCRUB = 0.35;

    // How far back each cover sends a card, and how much darker. metic's one
    // step is scale 0.94; this is a shade less per step because here there
    // are four steps behind the front card, not one, and the card at the back
    // of the pile is still legible as a card at 0.8. The shade is capped so
    // the back of the pile is dim and not black.
    var STEP = 0.05, SHADE = 0.18, SHADE_MAX = 0.6;

    var list = casesEl && casesEl.querySelector('.hp-cases__list');
    if (list && cards.length > 1 && !REDUCED) {
      // One writer per property, for all five cards, driven from one scrub.
      // Each card's position in the pile is worked out every frame from how
      // far each card in front of it has travelled, so there is never a
      // moment where two tweens on the same card disagree about its size —
      // which there would be if each arrival were its own trigger: the
      // smoothing on one would still be settling when the next began.
      // The scale is written to the style directly. Nothing else on the page
      // ever writes a transform to a card, so there is no cache to keep in
      // step, and a direct write is the cheapest thing a frame can do. The
      // translateZ(0) keeps the layer the stylesheet promised the card. Each
      // value is remembered so a frame that changes nothing writes nothing.
      var was = cards.map(function() { return -1; });
      function setScale(k, v) {
        v = Math.round(v * 10000) / 10000;
        if (v === was[k]) return;
        was[k] = v;
        cards[k].style.transform = 'translateZ(0) scale(' + v + ')';
      }
      var setShade = cards.map(function(c) {
        var sh = c.querySelector('.hp-case__shade');
        return sh ? gsap.quickSetter(sh, 'opacity') : null;
      });
      // Measured on every refresh: where the list starts, how far it scrolls,
      // and for each card where it is in the list and where it parks.
      var geo = { len: 1, vh: 1, y: [], park: [] };
      function measure() {
        var top = layoutTop(list);
        geo.vh = root.clientHeight;
        geo.len = Math.max(1, list.offsetHeight - geo.vh);
        cards.forEach(function(c, i) {
          var stage = c.closest('.hp-build');
          // The staged card is in the stage, which parks at 0; the card
          // itself sits at its padding, and the stage's layout top is the
          // card's as far as the deck is concerned.
          geo.y[i] = layoutTop(stage || c) - top;
          geo.park[i] = stage ? c.offsetTop : (parseFloat(getComputedStyle(c).top) || 0);
        });
      }
      function paint() {
        // The deck's scroll, smoothed: the timeline's progress is the
        // trigger's progress run through the scrub, and the trigger covers
        // the list exactly, so progress times the list's travel is where the
        // drawing has got to rather than where the page is.
        if (!deck) return;   // the refresh that fires as the trigger is made
        var s = deck.progress() * geo.len;
        var depth = 0;
        // From the front of the pile to the back. A card's depth is the sum
        // of how far each card in front of it has come: a cover half-way up
        // the screen has sent it half a step back, and a cover that is
        // parked has sent it a whole one, and the next cover adds to that.
        for (var k = cards.length - 1; k >= 0; k--) {
          setScale(k, 1 - STEP * depth);
          if (setShade[k]) setShade[k](Math.min(SHADE_MAX, SHADE * depth));
          if (k > 0) {
            // Card k travels from its top at the bottom of the screen to its
            // top on its parking line; this is how far along that it is.
            // Smoothed, so the step starts and ends at rest instead of at a
            // corner: a linear ramp changes the scale at full speed on the
            // frame a cover arrives and stops dead when it parks.
            var a = (s - (geo.y[k] - geo.vh)) / (geo.vh - geo.park[k]);
            if (a < 0) a = 0;
            else if (a > 1) a = 1;
            else a = a * a * (3 - 2 * a);
            depth += a;
          }
        }
      }
      measure();
      // A one-second timeline with nothing in it. It exists to be scrubbed:
      // the smoothing lives on the scrub, and paint reads the smoothed
      // progress off it rather than the raw scroll. Scroll positions from the
      // layout box for the same reason as everywhere else in this section.
      var deck = gsap.timeline({
        onUpdate: paint,
        scrollTrigger: {
          trigger: list,
          start: function() { return layoutTop(list); },
          end: function() { return layoutTop(list) + list.offsetHeight - root.clientHeight; },
          scrub: CARD_SCRUB,
          invalidateOnRefresh: true,
          onRefresh: function() { measure(); paint(); }
        }
      }).to({}, { duration: 1 });
    }

    // ---------- FOOTER ----------
    var footer = document.getElementById('hp-footer');
    if (footer) {
      reveal(footer, [
        { els: footer.querySelectorAll('.hp-eyebrow--rule, .hp-footer__title'), y: 30, stagger: 0.1 },
        { els: footer.querySelectorAll('.hp-footer__lede, .hp-footer__ctas, .hp-footer__base'), y: 24, stagger: 0.09, at: 0.3 }
      ]);
    }

    ScrollTrigger.refresh();

    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        ScrollTrigger.refresh();
      }, 180);
    });
  }


  // ---------- INTO A CASE STUDY ----------
  // The stylesheet opts the page into cross-document view transitions and
  // describes how the named parts travel. What it cannot do is say which card
  // is leaving: all five have a sentence, a chip row and a picture, and a name
  // may be used once. So the names are handed out here, at the moment the
  // navigation is committed, to the card whose page is the destination, and
  // only then.
  //
  // pageswap fires on the outgoing page with the destination entry in hand;
  // it is the one point at which both of those are known. The names are set
  // and left — the document is about to be gone.
  //
  // Nothing happens on the way back. The card the reader returns to is below
  // the hero, which plays its entrance again; a picture travelling down into
  // a page that is still arriving would be two openings at once.
  // The dot follows the pointer 1:1. Its size is a long ease, always started
  // from whatever size is on screen, so entering and leaving a card mid-grow
  // reverses without a jump. Full travel is 480ms of sine ease-in-out: slow
  // to leave, unhurried through the middle, settled at the end with no tail
  // left creeping. A shorter trip (leaving halfway) takes the same pace over
  // the distance left, not a fresh 480ms and not a snap. Reduced motion sets
  // the size in one frame.
  // Replaced by initCursor. The build calls it when card 01 crosses into
  // the finished card, so a pointer that has not moved still changes: the
  // scrub can finish the drawing after the wheel has stopped.
  var cursorRecheck = function () {};

  function initCursor() {
    var fine = window.matchMedia('(pointer: fine)');
    var motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    var node = null;
    var arrow = null;
    var x = 0;
    var y = 0;
    var shown = false;
    var raf = 0;
    var running = false;
    var root = null;

    var minScale = 8 / 68;
    var scale = minScale;
    var target = minScale;
    var TRAVEL = 480;
    var fromScale = minScale;
    var toScale = minScale;
    var started = 0;
    var dur = 0;

    function easeInOut(t) {
      return (1 - Math.cos(Math.PI * t)) / 2;
    }

    function paint() {
      if (!node) return;
      node.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) scale(' + scale + ')';
      if (!arrow) return;
      var p = (scale - minScale) / (1 - minScale);
      if (p < 0) p = 0;
      else if (p > 1) p = 1;
      var a = (p - 0.62) / 0.38;
      if (a < 0) a = 0;
      else if (a > 1) a = 1;
      arrow.style.opacity = String(a);
    }

    function step(now) {
      var t = dur > 0 ? (now - started) / dur : 1;
      if (t >= 1) {
        scale = toScale;
        running = false;
        paint();
        return;
      }
      if (t < 0) t = 0;
      scale = fromScale + (toScale - fromScale) * easeInOut(t);
      paint();
      raf = requestAnimationFrame(step);
    }

    function kick() {
      if (motion.matches) {
        scale = target;
        running = false;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
        paint();
        return;
      }
      fromScale = scale;
      toScale = target;
      var dist = Math.abs(toScale - fromScale);
      dur = dist < 0.0008 ? 0 : TRAVEL * (dist / (1 - minScale));
      started = performance.now();
      if (dur <= 0) {
        scale = target;
        running = false;
        if (raf) cancelAnimationFrame(raf);
        raf = 0;
        paint();
        return;
      }
      if (running) return;
      running = true;
      raf = requestAnimationFrame(step);
    }

    function setTarget(next) {
      if (next === target) {
        if (motion.matches) kick();
        return;
      }
      target = next;
      kick();
    }

    function overCard(el) {
      var card = el && el.closest && el.closest('.hp-case');
      if (!card) return false;
      // Card 01 lives inside the build until the drawing is the card. The
      // other four are cards the whole time.
      var build = card.closest('.hp-build');
      return !build || build.classList.contains('is-developed');
    }

    function place(clientX, clientY, el) {
      x = clientX;
      y = clientY;
      if (!shown) {
        shown = true;
        node.classList.add('is-on');
        document.documentElement.classList.add('hp-cursor-live');
      }
      setTarget(overCard(el) ? 1 : minScale);
      paint();
    }

    function hide() {
      shown = false;
      if (node) node.classList.remove('is-on');
      document.documentElement.classList.remove('hp-cursor-live');
      target = minScale;
      scale = minScale;
      running = false;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      paint();
    }

    function onMove(e) {
      if (!node) return;
      if (e.pointerType && e.pointerType !== 'mouse') {
        hide();
        return;
      }
      place(e.clientX, e.clientY, e.target);
    }

    function onLeave() {
      hide();
    }

    function onScroll() {
      if (!shown || !node) return;
      setTarget(overCard(document.elementFromPoint(x, y)) ? 1 : minScale);
    }

    cursorRecheck = function () {
      if (!shown || !node) return;
      setTarget(overCard(document.elementFromPoint(x, y)) ? 1 : minScale);
    };

    function mount() {
      if (node || !fine.matches) return;
      node = document.createElement('div');
      node.className = 'hp-cursor';
      node.setAttribute('aria-hidden', 'true');
      node.innerHTML = '<svg class="hp-cursor__arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 17L17 7M8 7h9v9" stroke="#000" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      arrow = node.firstChild;
      document.body.appendChild(node);
      document.documentElement.classList.add('hp-has-cursor');
      scale = minScale;
      target = minScale;
      paint();
      window.addEventListener('pointermove', onMove, true);
      document.documentElement.addEventListener('pointerleave', onLeave);
      root = document.getElementById('hp-root');
      if (root) root.addEventListener('scroll', onScroll, { passive: true });
    }

    function unmount() {
      window.removeEventListener('pointermove', onMove, true);
      document.documentElement.removeEventListener('pointerleave', onLeave);
      if (root) root.removeEventListener('scroll', onScroll);
      root = null;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      running = false;
      hide();
      if (node && node.parentNode) node.parentNode.removeChild(node);
      node = null;
      arrow = null;
      document.documentElement.classList.remove('hp-has-cursor');
    }

    function sync() {
      if (fine.matches) mount();
      else unmount();
    }

    if (fine.addEventListener) fine.addEventListener('change', sync);
    else if (fine.addListener) fine.addListener(sync);
    if (motion.addEventListener) {
      motion.addEventListener('change', function() {
        if (node) kick();
      });
    }
    sync();
  }

  function initCaseTransitions() {
    if (!('onpageswap' in window)) return;
    window.addEventListener('pageswap', function(e) {
      if (!e.viewTransition || !e.activation || !e.activation.entry) return;
      var to;
      try { to = new URL(e.activation.entry.url); } catch (err) { return; }
      if (to.origin !== location.origin) return;
      var path = to.pathname.replace(/\/$/, '');
      var link = null;
      Array.prototype.forEach.call(document.querySelectorAll('.hp-case__link'), function(a) {
        if (a.getAttribute('href') === path) link = a;
      });
      if (!link) return;
      // The words are the thing that stays. The card's sentence and its chip
      // row are named as the case page names its heading and tags, and
      // travel to them: same face, same words, same wrapping, so the move is
      // one block of type gliding to the top of the next page. The artwork
      // is not named; it leaves with the rest of this page in its one fade.
      // The journey itself is described on the arriving page (ARRIVING FROM
      // THE HOMEPAGE in each case study's styles).
      //
      // Names are cleared from every card first. Coming back from the
      // bfcache restores this page exactly as it was left, inline names
      // included, and a second card given the same name while the first
      // still holds it is a duplicate — which makes the browser skip the
      // whole transition and cut to the next page instead.
      clearCaseNames();
      var desc = link.querySelector('.hp-case__desc');
      var tags = link.querySelector('.hp-case__tags');
      if (desc) desc.style.viewTransitionName = 'cs-title';
      if (tags) tags.style.viewTransitionName = 'cs-tags';
    });
    // And on the way back in, for the same reason: no card should still be
    // carrying a name from the last time it was clicked.
    window.addEventListener('pageshow', function(e) { if (e.persisted) clearCaseNames(); });
  }
  function clearCaseNames() {
    Array.prototype.forEach.call(
      document.querySelectorAll('.hp-case__desc, .hp-case__tags'),
      function(el) { el.style.viewTransitionName = ''; }
    );
  }

  function init() {
    try {
      // Before build(): it decides where card 01 is rendered. The deferred
      // GSAP files have run by DOMContentLoaded, so their presence is known.
      BUILD_ON = decideBuild();
      build();
      revealNav();
      initSoundToggle();
      initNavHide();
      initBackToTop();
      initWorkAnchor();
      initHero();          // the closing line and the exit start once it lands
      initClientMarquee();
      initClientLinks();
      initHeroLight();     // independent of the entrance: the room is lit first
      initScrollScenes();
      initCaseTransitions();
      initCursor();

      // Webfont metrics change where the description wraps, which changes how
      // tall a card's text block is; the carousel's start and end are measured
      // from the card, so the triggers have to be recomputed once the fonts are
      // in. Nothing is re-measured by hand any more — the card takes its height
      // from the artwork's own aspect, which does not depend on the fonts.
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function() {
          if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.refresh();
        });
      }
      console.log('HP ' + VERSION + ' ready');
    } catch (err) {
      console.error('HP ' + VERSION + ' error:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
