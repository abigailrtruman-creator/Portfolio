<!-- Everything from here to the <title> is document metadata, and it sits ABOVE
     the title deliberately: build-injection.py cuts the file at the <title>
     line, so none of this reaches the Squarespace build. That is correct — a
     code injection cannot own the page's title, description, canonical or
     icons, because Squarespace emits its own. It belongs to this document.

     The description is 157 characters, drafted down from the hero's own copy so
     the words in a search result are hers. It is the statement's two opening
     sentences verbatim plus a shortened close; the full statement is 184
     characters, which would be truncated in a snippet.
     Both the title and the description are pending the owner's approval. -->
<meta name="description" content="Seven years in, from consultancy pace to in-house depth. I design, I lead, and I invest in the people.">
<link rel="canonical" href="https://abbietruman.vercel.app/">

<!-- Open Graph and Twitter, so a link she sends a hiring manager unfurls as her
     hero instead of as a bare URL. Absolute URLs throughout: scrapers do not
     resolve relative paths against the page they found them on.
     og:image is a static PNG and has to be. No scraper runs JavaScript, and
     this page builds its hero in JS, so the card is a photograph of the hero
     rather than the hero itself — see build-og-image.py, which takes it, hashes
     it and rewrites the two URLs below. It has to be retaken whenever the hero
     copy changes. -->
